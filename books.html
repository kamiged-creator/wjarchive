<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>책 소개 | 샘플 작가</title>
  <meta name="description" content="샘플 작가의 책과 작업 이야기를 소개합니다.">
  <link rel="icon" href="/favicon-32x32.png">
  <style>
    :root{--bg:#f6f1ea;--paper:#fffdf9;--text:#1f1a17;--muted:#6e655d;--line:rgba(31,26,23,.12);--accent:#8b6847;--max:980px}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;word-break:keep-all}
    a{color:inherit;text-decoration:none}
    .wrap{max-width:var(--max);margin:0 auto;padding:0 24px}
    .top{position:sticky;top:0;z-index:10;background:rgba(246,241,234,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
    .topin{height:66px;display:flex;align-items:center;justify-content:space-between;gap:16px}
    .brand{font-weight:800;font-size:23px;color:#2b2724;letter-spacing:-.03em;display:inline-flex;align-items:center;gap:9px}
    .brand-logo{width:32px;height:32px;border-radius:9px;object-fit:cover;display:none;border:1px solid var(--line);background:#fff}
    .back{font-size:13px;color:var(--muted);font-weight:750}
    .hero{padding:36px 0 24px;border-bottom:1px solid var(--line)}
    .eyebrow{font-size:12px;letter-spacing:.12em;color:var(--accent);font-weight:800;text-transform:uppercase}
    h1{margin:7px 0 8px;font-family:"Noto Serif KR","Nanum Myeongjo",serif;font-size:38px;font-weight:500;letter-spacing:-.055em}
    .hero-summary{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
    .hero p{margin:0;color:var(--muted);line-height:1.75;font-size:15px}
    .book-count{flex:0 0 auto;color:var(--accent);font-size:13px;font-weight:800;letter-spacing:.02em;white-space:nowrap}
    .books{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;padding:28px 0 72px}
    .book-card{display:block;border:1px solid var(--line);border-radius:24px;background:var(--paper);overflow:hidden;transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
    .book-card:hover{transform:translateY(-4px);box-shadow:0 18px 42px rgba(31,26,23,.08);border-color:rgba(139,104,71,.3)}
    .cover{aspect-ratio:3/4;background:#eee6dc;overflow:hidden}
    .cover img{width:100%;height:100%;display:block;object-fit:cover;transition:transform .35s ease}
    @media(min-width:821px){
      .cover{aspect-ratio:auto;height:250px}
    }
    .book-card:hover .cover img{transform:scale(1.025)}
    .copy{padding:18px 18px 20px}
    .number{font-size:11px;color:var(--accent);font-weight:800;letter-spacing:.08em}
    .copy h2{margin:8px 0 8px;font-family:"Noto Serif KR","Nanum Myeongjo",serif;font-size:24px;font-weight:600;letter-spacing:-.045em}
    .intro{margin:0;color:var(--muted);font-size:13px;line-height:1.7;min-height:44px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;text-overflow:ellipsis}
    .meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px}
    .status{display:inline-flex;padding:7px 10px;border-radius:999px;background:rgba(139,104,71,.09);color:#725538;font-size:11px;font-weight:800}
    .more{font-size:12px;color:#5f554d;font-weight:750}
    .empty{grid-column:1/-1;padding:60px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:24px;background:rgba(255,253,249,.62)}
    .pagination{display:none;align-items:center;justify-content:center;gap:8px;margin:-20px 0 28px}
    .pagination.show{display:flex}
    .page-btn{min-width:34px;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--muted);font:inherit;font-size:12px;font-weight:800;cursor:pointer}
    .page-btn:hover{border-color:rgba(139,104,71,.35);color:var(--text)}
    .page-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
    .archive-end{margin:0 0 28px;padding:30px 20px 28px;text-align:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
    .archive-end .kicker{font-size:11px;font-weight:850;letter-spacing:.16em;color:var(--accent)}
    .archive-end p{margin:9px 0 14px;color:var(--muted);font-size:14px;line-height:1.7}
    .archive-links{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;font-weight:750;color:#5f554d}
    .archive-links span{opacity:.35}
    .archive-links a{transition:color .18s ease}
    .archive-links a:hover{color:var(--accent)}
    footer{padding:22px 0 34px;border-top:0;font-size:12px;color:var(--muted)}
    .foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
    @media(max-width:820px){.books{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:560px){
      .wrap{padding:0 14px}.topin{height:58px}.hero{padding:14px 0 12px}
      .eyebrow{margin-bottom:2px}
      h1{font-size:34px;margin:2px 0 0}
      .hero-summary{gap:10px;align-items:baseline}
      .hero p{margin-top:6px}
      .book-count{font-size:12px}
      .books{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:12px 0 30px}
      .book-card{border-radius:16px}
      .cover{aspect-ratio:auto;height:180px}
      .copy{padding:10px 10px 11px}
      .number{font-size:9px}
      .copy h2{font-size:17px;margin:5px 0 4px;line-height:1.22}
      .intro{font-size:11px;line-height:1.45;min-height:32px;max-height:32px;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;text-overflow:ellipsis}
      .meta{margin-top:5px;gap:5px}
      .status{padding:4px 7px;font-size:9px}
      .more{font-size:10px}
      .pagination{margin:-12px 0 24px;gap:6px}
      .page-btn{min-width:30px;height:30px;padding:0 8px;font-size:11px}
      .archive-end{margin-bottom:22px;padding:24px 12px 22px}
      .archive-end p{font-size:12px;margin:7px 0 12px}
      .archive-links{font-size:11px;gap:8px}
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap topin">
      <a class="brand" href="/"><img class="brand-logo" id="bookBrandLogo" alt="사이트 로고"><span id="bookBrandArtist">샘플 작가</span></a>
      <a class="back" href="/">← 홈페이지</a>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <div class="eyebrow">Book · Story</div>
      <h1>책 소개</h1>
      <div class="hero-summary">
        <p>작품과 글에 담긴 이야기를 책으로 이어갑니다.</p>
        <span class="book-count" id="bookCount" aria-live="polite">4권+</span>
      </div>
    </section>
    <section class="books" id="bookGrid" aria-live="polite"></section>
    <nav class="pagination" id="bookPagination" aria-label="책 목록 페이지"></nav>
    <section class="archive-end" aria-label="책 아카이브 안내">
      <div class="kicker">BOOK ARCHIVE</div>
      <p>작품과 글의 기록은 계속 이어집니다.</p>
      <div class="archive-links">
        <a href="/#works">작품 보기</a>
        <span>·</span>
        <a href="/#about">작가 소개</a>
        <span>·</span>
        <a href="/">홈으로</a>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap foot"><span>© <span id="year"></span> <span id="bookFooterArtist">Sample Artist</span>.</span><a id="adminFooterLink" href="/admin.html" style="display:none">관리자</a></div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/template-config.js"></script>
  <script>
    const TEMPLATE_CONFIG=window.ARTIST_TEMPLATE_CONFIG||{};

    function normalizeBranding(value={}){
      const accentCandidate=String(value.accentColor || TEMPLATE_CONFIG.accentColor || '#8b6847').trim();
      return {
        artistName:String(value.artistName || TEMPLATE_CONFIG.artistName || 'Sample Artist').trim() || 'Sample Artist',
        siteName:String(value.siteName || TEMPLATE_CONFIG.siteName || 'Artist Portfolio').trim() || 'Artist Portfolio',
        logoUrl:String(value.logoUrl || TEMPLATE_CONFIG.logoUrl || '').trim(),
        accentColor:/^#[0-9a-f]{6}$/i.test(accentCandidate) ? accentCandidate : '#8b6847'
      };
    }

    function applyBranding(value={}){
      const data=normalizeBranding(value);
      document.documentElement.style.setProperty('--accent',data.accentColor);
      const artist=document.getElementById('bookBrandArtist');
      const footer=document.getElementById('bookFooterArtist');
      const logo=document.getElementById('bookBrandLogo');
      if(artist) artist.textContent=data.artistName;
      if(footer) footer.textContent=data.artistName;
      if(logo){
        logo.style.display=data.logoUrl?'block':'none';
        if(data.logoUrl) logo.src=data.logoUrl;
        else logo.removeAttribute('src');
      }
      const metaDescription=document.querySelector('meta[name="description"]');
      if(metaDescription) metaDescription.content=`${data.artistName}의 책과 작업 이야기를 소개합니다.`;
      document.title=`책 소개 | ${data.artistName}`;
    }

    let localBranding=null;
    try{localBranding=JSON.parse(localStorage.getItem('artistTemplateBranding')||'null')}catch(e){}
    applyBranding(localBranding||TEMPLATE_CONFIG);

    const SUPABASE_URL=String(TEMPLATE_CONFIG.supabaseUrl||'').trim();
    const SUPABASE_ANON_KEY=String(TEMPLATE_CONFIG.supabasePublishableKey||'').trim();
    const client=(window.supabase&&/^https:\/\//i.test(SUPABASE_URL)&&SUPABASE_ANON_KEY)
      ?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY)
      :null;
    const grid=document.getElementById('bookGrid');
    const pagination=document.getElementById('bookPagination');
    const bookCount=document.getElementById('bookCount');
    const adminFooterLink=document.getElementById('adminFooterLink');
    const ADMIN_TOKEN_KEY=String(TEMPLATE_CONFIG.adminTokenStorageKey||'artistTemplateAdminAccessToken');
    const DESKTOP_PAGE_SIZE=6;
    const MOBILE_PAGE_SIZE=4;
    let allBookCards=[];
    let currentPage=1;
    document.getElementById('year').textContent=new Date().getFullYear();

    function adminTokenIsFresh(token){
      const expire=Number(String(token||'').split(':')[0]);
      return Number.isFinite(expire) && expire > Math.floor(Date.now()/1000)+15;
    }

    function updateAdminFooterVisibility(){
      const token=sessionStorage.getItem(ADMIN_TOKEN_KEY)||'';
      const loggedIn=adminTokenIsFresh(token);
      if(!loggedIn && token) sessionStorage.removeItem(ADMIN_TOKEN_KEY);
      if(adminFooterLink) adminFooterLink.style.display=loggedIn?'inline':'none';
    }

    updateAdminFooterVisibility();

    const defaultSamples=[
      {
        title:'책 제목 샘플',
        intro:'작품과 글에 담긴 마음을 한 권의 책으로 엮어 소개합니다.',
        image:'https://images.unsplash.com/photo-1515405295579-ba7b45403062?q=80&w=900&auto=format&fit=crop'
      },
      {
        title:'빛이 머무는 자리',
        intro:'빛과 여백, 손의 흔적을 따라 이어지는 작업 이야기를 담았습니다.',
        image:'https://images.unsplash.com/photo-1549490349-8643362247b5?q=80&w=900&auto=format&fit=crop'
      },
      {
        title:'마음의 결',
        intro:'작품 속 선과 색에 스며든 감정과 시간을 차분히 기록한 책입니다.',
        image:'https://images.unsplash.com/photo-1541961017774-22349e4a1262?q=80&w=900&auto=format&fit=crop'
      },
      {
        title:'작업의 시간',
        intro:'작품이 태어나는 과정과 작가의 생각을 함께 엮은 기록입니다.',
        image:'https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?q=80&w=900&auto=format&fit=crop'
      }
    ];

    function esc(value){
      return String(value??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
    }

    function cardHtml(book,href,label,status){
      return `
        <a class="book-card" href="${href}">
          <div class="cover">${book.image?'<img src="'+esc(book.image)+'" alt="'+esc(book.title||'책 표지')+'">':''}</div>
          <div class="copy">
            <div class="number">${label}</div>
            <h2>${esc(book.title||'제목 미정')}</h2>
            <p class="intro">${esc(book.intro||'책 소개를 준비하고 있습니다.')}</p>
            <div class="meta">
              <span class="status">${esc(status||'준비중입니다')}</span>
              <span class="more">상세보기 →</span>
            </div>
          </div>
        </a>
      `;
    }

    function getPageSize(){
      return window.matchMedia('(max-width:560px)').matches ? MOBILE_PAGE_SIZE : DESKTOP_PAGE_SIZE;
    }

    function renderPagination(totalPages){
      pagination.innerHTML='';
      pagination.classList.toggle('show',totalPages>1);
      if(totalPages<=1) return;

      for(let page=1;page<=totalPages;page++){
        const btn=document.createElement('button');
        btn.type='button';
        btn.className='page-btn'+(page===currentPage?' active':'');
        btn.textContent=String(page);
        btn.setAttribute('aria-label','책 목록 '+page+'페이지');
        if(page===currentPage) btn.setAttribute('aria-current','page');
        btn.addEventListener('click',()=>goToPage(page,true));
        pagination.appendChild(btn);
      }
    }

    function renderPage(){
      const pageSize=getPageSize();
      const totalPages=Math.max(1,Math.ceil(allBookCards.length/pageSize));
      if(currentPage>totalPages) currentPage=totalPages;
      if(currentPage<1) currentPage=1;

      const start=(currentPage-1)*pageSize;
      grid.innerHTML=allBookCards.slice(start,start+pageSize).join('');
      renderPagination(totalPages);
    }

    function goToPage(page,push=false){
      const pageSize=getPageSize();
      const totalPages=Math.max(1,Math.ceil(allBookCards.length/pageSize));
      const next=Math.min(Math.max(1,Number(page)||1),totalPages);
      currentPage=next;
      renderPage();

      if(push){
        const url=new URL(window.location.href);
        if(next===1) url.searchParams.delete('page');
        else url.searchParams.set('page',String(next));
        history.pushState({page:next},'',url.pathname+url.search);
      }

      const hero=document.querySelector('.hero');
      const top=document.querySelector('.top');
      const y=(hero?.getBoundingClientRect().bottom||0)+window.scrollY-(top?.offsetHeight||0)+1;
      window.scrollTo({top:Math.max(0,y),behavior:'smooth'});
    }

    function render(realBooks=[],sampleBooks=defaultSamples,sampleHidden=false){
      const visibleSamples=sampleHidden?[]:(Array.isArray(sampleBooks)?sampleBooks:defaultSamples);
      const sampleCards=visibleSamples.map((book,index)=>cardHtml(book,'/book.html?sample='+index,'BOOK '+String(index+1).padStart(2,'0')+' · SAMPLE','준비중입니다'));
      const realCards=(Array.isArray(realBooks)?realBooks:[])
        .filter(b=>b&&(b.title||b.intro||b.body||b.status||b.image))
        .map((book,index)=>cardHtml(book,'/book.html?book='+index,'BOOK '+String(visibleSamples.length+index+1).padStart(2,'0'),book.preparing?'준비중입니다':(book.status||'상세보기')));

      allBookCards=[...sampleCards,...realCards];
      if(bookCount){
        bookCount.textContent=allBookCards.length?allBookCards.length+'권+':'';
        bookCount.hidden=!allBookCards.length;
      }
      currentPage=Math.max(1,Number(new URLSearchParams(window.location.search).get('page'))||1);
      renderPage();
    }

    window.addEventListener('popstate',()=>{
      currentPage=Math.max(1,Number(new URLSearchParams(window.location.search).get('page'))||1);
      renderPage();
    });

    async function load(){
      render([],defaultSamples,false);
      if(!client) return;

      const [booksRes,brandingRes]=await Promise.all([
        client.from('site_settings').select('value').eq('key','books').maybeSingle(),
        client.from('site_settings').select('value').eq('key','branding').maybeSingle()
      ]);

      if(!brandingRes.error && brandingRes.data?.value){
        let branding=brandingRes.data.value;
        if(typeof branding==='string'){try{branding=JSON.parse(branding)}catch(e){branding={}}}
        applyBranding(branding);
        try{localStorage.setItem('artistTemplateBranding',JSON.stringify(branding))}catch(e){}
      }

      if(booksRes.error){console.warn(booksRes.error);return;}
      let value=booksRes.data?.value||{};
      if(typeof value==='string'){try{value=JSON.parse(value)}catch(e){value={}}}
      if(value.enabled===false){
        grid.innerHTML='<div class="empty">이 사이트에서는 책 소개 기능을 사용하지 않습니다.</div>';
        if(pagination) pagination.innerHTML='';
        if(bookCount) bookCount.hidden=true;
        return;
      }
      const savedSamples=Array.isArray(value.sampleItems)?value.sampleItems:[];
      const sampleBooks=defaultSamples.map((fallback,index)=>({...fallback,...(savedSamples[index]||{})}));
      render(value.items||[],sampleBooks,value.sampleHidden===true);
    }
    load();
  </script>
</body>
</html>
