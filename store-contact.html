<!doctype html>
<html lang="ko" translate="no" class="notranslate">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="google" content="notranslate" />
  <title>복작소 문의</title>
  <meta name="description" content="복작소 상품 문의 페이지입니다." />
  <meta name="theme-color" content="#fbf8f4" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/favicon-192x192.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <style>
    :root{--bg:#f6f1ea;--paper:#fffdf9;--text:#1f1a17;--muted:#6e655d;--line:rgba(31,26,23,.12);--accent:#8b6847;--bad:#b6493c;--ok:#257a45;--max:920px}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:linear-gradient(180deg,#fbf8f4 0%,var(--bg) 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",Arial,sans-serif;word-break:keep-all}
    a{color:inherit;text-decoration:none}
    button,input,textarea{font:inherit}
    .wrap{max-width:var(--max);margin:0 auto;padding:0 22px}
    .top{position:sticky;top:0;z-index:10;background:rgba(251,248,244,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
    .top-inner{min-height:60px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0}
    .brand{display:inline-flex;align-items:center;gap:8px;font-size:24px;font-weight:800;letter-spacing:-.06em}
    .brand img{width:21px;height:21px;border-radius:5px;object-fit:cover}
    .back{min-height:36px;display:inline-flex;align-items:center;justify-content:center;padding:0 14px;border:1px solid rgba(139,104,71,.26);border-radius:999px;background:rgba(255,253,249,.72);color:rgba(31,26,23,.74);font-size:13px;font-weight:800}
    main{padding:72px 0 112px}
    .hero{text-align:center;margin:0 auto 28px}
    h1{margin:0;font-size:clamp(34px,5vw,52px);line-height:1.08;letter-spacing:-.055em}
    .copy{max-width:520px;margin:16px auto 0;color:var(--muted);font-size:16px;line-height:1.78}
    .panel{max-width:720px;margin:0 auto;border:1px solid var(--line);border-radius:8px;background:rgba(255,253,249,.82);box-shadow:0 18px 42px rgba(31,26,23,.06);padding:26px}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
    .span-2{grid-column:1/-1}
    .label{display:block;margin:16px 0 7px;color:rgba(31,26,23,.72);font-size:13px;font-weight:850}
    .field{width:100%;min-height:44px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--text);padding:10px 12px}
    textarea.field{min-height:148px;resize:vertical;line-height:1.7}
    .privacy-note{margin:16px 0 0;color:var(--muted);font-size:12px;line-height:1.7}
    .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
    .btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;padding:0 18px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--text);font-weight:900;cursor:pointer}
    .btn.primary{border-color:var(--text);background:var(--text);color:#fffdf9}
    .btn:disabled{opacity:.48;cursor:not-allowed}
    .status{min-height:22px;margin-top:14px;color:var(--muted);font-size:13px;line-height:1.55}
    .status.ok{color:var(--ok)} .status.bad{color:var(--bad)}
    .footer{border-top:1px solid var(--line);background:rgba(255,253,249,.64);color:rgba(31,26,23,.62);padding:34px 0 40px}
    .footer-inner{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;flex-wrap:wrap}
    .footer-brand{display:inline-flex;align-items:center;gap:7px;font-size:18px;line-height:1;font-weight:900;letter-spacing:-.04em;color:var(--text)}
    .footer-brand img{width:18px;height:18px;border-radius:4px;object-fit:cover}
    .footer-note{margin:8px 0 0;color:var(--muted);font-size:13px;line-height:1.6}
    .business-info{max-width:780px;display:flex;justify-content:flex-end;gap:6px 16px;flex-wrap:wrap;font-size:12px;line-height:1.8;text-align:right}
    .business-info span{white-space:nowrap}
    .footer-links{width:100%;display:flex;justify-content:flex-end;gap:12px;font-size:12px;font-weight:800}
    @media(max-width:680px){.top-inner{min-height:68px;padding:calc(16px + env(safe-area-inset-top,0px)) 0 12px}.brand{font-size:24px}.brand img{width:20px;height:20px}.back{font-size:12px;min-height:34px;padding:0 10px}main{padding:54px 0 86px}.form-grid{grid-template-columns:1fr}.span-2{grid-column:auto}.panel{padding:22px}.actions{display:grid}.btn{width:100%}.footer{padding:28px 0 34px}.footer-inner{display:grid;gap:18px}.business-info,.footer-links{justify-content:flex-start;text-align:left}.business-info span{white-space:normal}}
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <a class="brand" href="/store.html"><img src="/favicon-32x32.png" alt="" aria-hidden="true">복작소</a>
      <a class="back" href="/store.html">스토어</a>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1>복작소 문의</h1>
      <p class="copy">상품, 제작 방식, 선물 포장, 수량 문의를 남겨주세요. 확인 후 가능한 방식으로 답변드릴게요.</p>
    </section>

    <form class="panel" id="contactForm">
      <div class="form-grid">
        <label>
          <span class="label">이름</span>
          <input class="field" id="nameInput" autocomplete="name" required placeholder="성함">
        </label>
        <label>
          <span class="label">연락처</span>
          <input class="field" id="contactInput" autocomplete="tel email" required placeholder="전화번호 또는 이메일">
        </label>
        <label class="span-2">
          <span class="label">상품명</span>
          <input class="field" id="productInput" placeholder="문의할 상품명">
        </label>
        <label class="span-2">
          <span class="label">문의 내용</span>
          <textarea class="field" id="messageInput" required placeholder="문의 내용을 적어주세요."></textarea>
        </label>
      </div>
      <p class="privacy-note">입력한 정보는 문의 확인과 답변 목적으로만 사용합니다. 저장 기능은 Supabase 설정이 완료된 뒤 정상 작동합니다.</p>
      <div class="actions">
        <a class="btn" href="/store.html">돌아가기</a>
        <button class="btn primary" type="submit" id="submitBtn">문의 남기기</button>
      </div>
      <div class="status" id="formStatus"></div>
    </form>
  </main>

  <footer class="footer">
    <div class="wrap footer-inner">
      <div>
        <div class="footer-brand"><img src="/favicon-32x32.png" alt="" aria-hidden="true">복작소</div>
        <p class="footer-note">문의 내용은 확인 후 가능한 방식으로 답변드립니다.</p>
      </div>
      <div class="business-info" aria-label="사업자 정보">
        <span>상호 복작소</span>
        <span>사업자등록번호 준비중</span>
        <span>통신판매업 신고번호 준비중</span>
        <span>주소 준비중</span>
        <span>전화번호 준비중</span>
        <span>이메일 준비중</span>
      </div>
      <div class="footer-links">
        <span>이용약관 준비중</span>
      </div>
    </div>
  </footer>

  <script>
    const params = new URLSearchParams(window.location.search);
    const product = params.get('product') || '';
    const form = document.getElementById('contactForm');
    const submitBtn = document.getElementById('submitBtn');
    const status = document.getElementById('formStatus');
    if(product) document.getElementById('productInput').value = product;

    function setStatus(message, type=''){
      status.textContent = message;
      status.className = `status ${type}`.trim();
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const payload = {
        name: document.getElementById('nameInput').value.trim(),
        contact: document.getElementById('contactInput').value.trim(),
        product_name: document.getElementById('productInput').value.trim(),
        message: document.getElementById('messageInput').value.trim()
      };
      if(!payload.name || !payload.contact || !payload.message){
        setStatus('이름, 연락처, 문의 내용을 입력해 주세요.', 'bad');
        return;
      }
      submitBtn.disabled = true;
      setStatus('문의 접수 중...');
      try{
        const response = await fetch('/api/store-inquiries', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify(payload)
        });
        const result = await response.json().catch(() => ({}));
        if(!response.ok) throw new Error(result.message || '문의 접수에 실패했습니다.');
        form.reset();
        setStatus('문의가 접수되었습니다.', 'ok');
      }catch(error){
        setStatus(error.message || '문의 접수에 실패했습니다. Supabase 설정을 확인해 주세요.', 'bad');
      }finally{
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
