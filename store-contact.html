<!doctype html>
<html lang="ko" translate="no" class="notranslate">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="google" content="notranslate" />
  <title>복작소 문의</title>
  <meta name="description" content="복작소 상품 문의 페이지입니다." />
  <meta name="theme-color" content="#fbf8f4" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/favicon-192x192.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#f9f7f2;--paper:#fffdf9;--text:#1b1c19;--muted:#6e655d;--line:#e5e1d9;--accent:#795838;--bad:#b6493c;--ok:#257a45;--max:1200px}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",Arial,sans-serif;word-break:keep-all}
    a{color:inherit;text-decoration:none}
    button,input,textarea{font:inherit}
    .wrap{max-width:var(--max);margin:0 auto;padding:0 48px}
    .top{background:#fffdf9;border-bottom:1px solid var(--line)}
    .top-inner{min-height:80px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px}
    .brand{font-size:42px;line-height:1;font-weight:800;letter-spacing:-.06em}
    .nav{display:flex;align-items:center;justify-content:center;gap:24px;color:var(--muted);font-size:16px}
    .nav a{padding:6px 0}
    .nav .active{color:#000;border-bottom:2px solid #000;font-weight:800}
    .top-action{justify-self:end;min-height:48px;display:inline-flex;align-items:center;justify-content:center;padding:0 18px;border-radius:8px;background:#000;color:#fffdf9;font-size:14px;font-weight:800}
    main{padding:64px 48px 128px}
    .hero{text-align:center;margin:0 auto 48px}
    h1{margin:0;font-size:32px;line-height:1.25;letter-spacing:-.01em;font-weight:800}
    .copy{max-width:640px;margin:12px auto 0;color:var(--muted);font-size:18px;line-height:1.6}
    .panel{max-width:640px;margin:0 auto;border:1px solid var(--line);border-radius:12px;background:#fffdf9;box-shadow:0 2px 10px rgba(31,26,23,.03);padding:48px}
    .form-grid{display:grid;gap:22px}
    .label{display:block;margin:0 0 8px;color:#000;font-size:14px;line-height:1.2;font-weight:800}
    .field{width:100%;min-height:48px;border:1px solid var(--line);border-radius:8px;background:#fffdf9;color:var(--text);padding:12px 16px;transition:border-color .18s ease,box-shadow .18s ease}
    .field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
    textarea.field{min-height:144px;resize:vertical;line-height:1.7}
    .privacy-note{margin:32px auto 0;max-width:560px;color:var(--muted);font-size:14px;line-height:1.65;text-align:center}
    .actions{display:block;margin-top:34px}
    .btn{min-height:48px;display:inline-flex;align-items:center;justify-content:center;padding:0 18px;border:1px solid var(--line);border-radius:8px;background:#fffdf9;color:var(--text);font-weight:800;cursor:pointer}
    .btn.primary{width:100%;border-color:#000;background:#000;color:#fffdf9}
    .btn:disabled{opacity:.48;cursor:not-allowed}
    .status{min-height:22px;margin-top:14px;color:var(--muted);font-size:14px;line-height:1.55;text-align:center}
    .status.ok{color:var(--ok)} .status.bad{color:var(--bad)}
    .footer{border-top:1px solid var(--line);background:#f5f3ee;color:var(--muted);padding:32px 0}
    .footer-inner{display:grid;grid-template-columns:1fr auto;align-items:center;gap:24px}
    .footer-brand{font-size:24px;line-height:1.1;font-weight:700;letter-spacing:-.04em;color:#000}
    .footer-note{margin:14px 0 0;color:var(--muted);font-size:14px;line-height:1.45}
    .footer-links{display:flex;justify-content:flex-end;gap:18px;font-size:14px;text-decoration:underline}
    .business-info{display:none}
    @media(max-width:760px){.wrap{padding:0 16px}.top-inner{min-height:72px;display:flex;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top,0px)) 0 12px}.brand{font-size:30px}.nav{display:none}.top-action{min-height:38px;padding:0 14px;font-size:13px}main{padding:46px 16px 88px}.hero{margin-bottom:34px}h1{font-size:30px}.copy{font-size:16px}.panel{padding:24px 20px;border-radius:12px}.form-grid{gap:18px}.privacy-note{margin-top:24px;font-size:13px}.actions{margin-top:26px}.footer{padding:30px 0}.footer-inner{display:grid;gap:22px}.footer-links{justify-content:flex-start;flex-wrap:wrap}}
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <a class="brand" href="/store.html">Bokjakso</a>
      <nav class="nav" aria-label="스토어 메뉴">
        <a href="/store.html">Store</a>
        <a class="active" href="/store-contact.html" aria-current="page">Inquire</a>
      </nav>
      <a class="top-action" href="/store-contact.html">Inquire</a>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>복작소 문의</h1>
      <p class="copy">무엇이든 물어보세요. 복작소가 친절하게 답변해 드립니다.</p>
    </section>

    <form class="panel" id="contactForm">
      <div class="form-grid">
        <label>
          <span class="label">이름</span>
          <input class="field" id="nameInput" autocomplete="name" required placeholder="이름을 입력해주세요">
        </label>
        <label>
          <span class="label">연락처</span>
          <input class="field" id="contactInput" autocomplete="tel email" required placeholder="연락받으실 번호를 입력해주세요">
        </label>
        <label>
          <span class="label">상품명</span>
          <input class="field" id="productInput" placeholder="문의하실 상품명을 입력해주세요 (선택)">
        </label>
        <label>
          <span class="label">문의 내용</span>
          <textarea class="field" id="messageInput" required placeholder="문의하실 내용을 자세히 적어주세요"></textarea>
        </label>
      </div>
      <div class="actions">
        <button class="btn primary" type="submit" id="submitBtn">문의 남기기</button>
      </div>
      <p class="privacy-note">입력하신 정보는 문의 확인 및 답변 용도로만 사용되며, 관련 법령에 따라 안전하게 보관됩니다.</p>
      <div class="status" id="formStatus"></div>
    </form>
  </main>

  <footer class="footer">
    <div class="wrap footer-inner">
      <div>
        <div class="footer-brand">Bokjakso</div>
        <p class="footer-note">© 2024 Bokjakso. All rights reserved.</p>
      </div>
      <div class="footer-links">
        <a href="/store.html">Store</a>
        <a href="/store-contact.html">Contact Us</a>
        <span>Company Info</span>
      </div>
    </div>
  </footer>

  <script>
    const params = new URLSearchParams(window.location.search);
    const product = params.get('product') || '';
    const form = document.getElementById('contactForm');
    const submitBtn = document.getElementById('submitBtn');
    const status = document.getElementById('formStatus');
    if(product) document.getElementById('productInput').value = product;

    function setStatus(message, type=''){
      status.textContent = message;
      status.className = `status ${type}`.trim();
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const payload = {
        name: document.getElementById('nameInput').value.trim(),
        contact: document.getElementById('contactInput').value.trim(),
        product_name: document.getElementById('productInput').value.trim(),
        message: document.getElementById('messageInput').value.trim()
      };
      if(!payload.name || !payload.contact || !payload.message){
        setStatus('이름, 연락처, 문의 내용을 입력해 주세요.', 'bad');
        return;
      }
      submitBtn.disabled = true;
      setStatus('문의 접수 중...');
      try{
        const response = await fetch('/api/store-inquiries', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify(payload)
        });
        const result = await response.json().catch(() => ({}));
        if(!response.ok) throw new Error(result.message || '문의 접수에 실패했습니다.');
        form.reset();
        setStatus('문의가 접수되었습니다.', 'ok');
      }catch(error){
        setStatus(error.message || '문의 접수에 실패했습니다. Supabase 설정을 확인해 주세요.', 'bad');
      }finally{
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
