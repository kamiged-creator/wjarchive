<!doctype html>
<html lang="ko" translate="no" class="notranslate">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="google" content="notranslate" />
  <title>복작소 스토어 | 이원주 작품 포트폴리오</title>
  <meta name="description" content="이원주 작가의 작품에서 태어난 키링과 소품을 소개하는 복작소 스토어입니다." />
  <meta name="theme-color" content="#fbf8f4" />
  <meta name="application-name" content="복작소" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="복작소" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="msapplication-TileColor" content="#fbf8f4" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/favicon-192x192.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="복작소 스토어 | 이원주 작품 포트폴리오" />
  <meta property="og:description" content="작품에서 태어난 키링과 소품을 차분하게 소개합니다." />
  <style>
    :root{
      --bg:#f6f1ea;
      --paper:#fffdf9;
      --text:#1f1a17;
      --muted:#6e655d;
      --line:rgba(31,26,23,.12);
      --accent:#8b6847;
      --accent-soft:#e7d6c4;
      --seal:#b6493c;
      --shadow:0 20px 48px rgba(31,26,23,.08);
      --max:1180px;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      background:var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",Arial,sans-serif;
      word-break:keep-all;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }
    img{display:block;max-width:100%}
    a{text-decoration:none;color:inherit}
    button{font:inherit}
    .wrap{max-width:var(--max);margin:0 auto;padding:0 24px}

    .store-top{
      position:sticky;
      top:0;
      z-index:20;
      background:rgba(251,248,244,.94);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
    }
    .store-top-inner{
      min-height:72px;
      display:grid;
      grid-template-columns:1fr auto 1fr;
      align-items:center;
      gap:18px;
      padding:16px 0;
    }
    .home-link{
      justify-self:start;
      color:rgba(31,26,23,.72);
      font-size:14px;
      font-weight:700;
      transition:color .2s ease;
    }
    .home-link:hover{color:var(--text)}
    .store-brand{
      justify-self:center;
      text-align:center;
      font-size:28px;
      line-height:1;
      font-weight:900;
      letter-spacing:-.06em;
    }
    .store-action{
      justify-self:end;
      min-height:36px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:0 14px;
      border:1px solid var(--line);
      border-radius:999px;
      background:rgba(255,253,249,.72);
      color:rgba(31,26,23,.74);
      font-size:13px;
      font-weight:800;
      box-shadow:none;
    }

    main{
      background:
        radial-gradient(circle at 18% 0%, rgba(255,253,249,.96), transparent 30%),
        linear-gradient(180deg,#fbf8f4 0%,#f6f1ea 100%);
    }
    .intro{
      padding:72px 0 54px;
      text-align:center;
    }
    .intro-kicker{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:32px;
      padding:0 12px;
      border:1px solid var(--line);
      border-radius:999px;
      background:rgba(255,255,255,.54);
      color:var(--muted);
      font-size:12px;
      font-weight:800;
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    h1{
      margin:18px auto 0;
      max-width:760px;
      font-size:clamp(36px,7vw,66px);
      line-height:1.08;
      letter-spacing:-.055em;
    }
    .intro-line{
      width:52px;
      height:1px;
      margin:30px auto 0;
      background:rgba(139,104,71,.28);
    }
    .intro-copy{
      margin:28px auto 0;
      max-width:620px;
      color:var(--muted);
      font-size:18px;
      line-height:1.78;
    }

    .products{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:32px;
      padding:26px 0 92px;
    }
    .product-card{
      display:flex;
      flex-direction:column;
      min-width:0;
      padding:14px;
      border:1px solid transparent;
      border-radius:8px;
      transition:border-color .28s ease, background .28s ease, transform .28s ease;
    }
    .product-card:hover{
      border-color:rgba(31,26,23,.10);
      background:rgba(255,253,249,.44);
      transform:translateY(-2px);
    }
    .product-media{
      position:relative;
      aspect-ratio:4/5;
      overflow:hidden;
      border-radius:4px;
      background:var(--accent-soft);
    }
    .product-media img{
      width:100%;
      height:100%;
      object-fit:cover;
      transition:transform .7s ease;
    }
    .product-card:hover .product-media img{transform:scale(1.035)}
    .product-body{
      display:flex;
      flex:1;
      flex-direction:column;
      align-items:center;
      text-align:center;
      padding:24px 10px 8px;
    }
    .product-title{
      margin:0;
      font-size:24px;
      line-height:1.28;
      letter-spacing:-.035em;
    }
    .product-copy{
      min-height:52px;
      margin:10px 0 0;
      color:var(--muted);
      font-size:15px;
      line-height:1.62;
    }
    .product-price{
      margin:18px 0 18px;
      color:rgba(31,26,23,.66);
      font-size:12px;
      font-weight:900;
      letter-spacing:.08em;
    }
    .inquiry-btn{
      width:100%;
      min-height:46px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border:1px solid rgba(31,26,23,.34);
      border-radius:2px;
      background:transparent;
      color:var(--text);
      font-size:13px;
      font-weight:900;
      cursor:pointer;
      transition:background .2s ease, border-color .2s ease;
    }
    .inquiry-btn:hover{
      background:rgba(231,214,196,.34);
      border-color:rgba(31,26,23,.54);
    }
    .seal-mark{
      display:flex;
      justify-content:center;
      padding:8px 0 76px;
    }
    .seal-box{
      width:34px;
      height:34px;
      display:grid;
      place-items:center;
      border-radius:4px;
      background:var(--seal);
      color:#fff8ed;
      font-size:20px;
      font-weight:900;
      line-height:1;
      box-shadow:0 10px 24px rgba(182,73,60,.14);
    }

    @media (max-width: 860px){
      .products{
        max-width:560px;
        grid-template-columns:1fr;
        gap:54px;
        margin:0 auto;
        padding-top:10px;
      }
      .product-card{
        padding:0;
      }
      .product-card:hover{
        transform:none;
        background:transparent;
        border-color:transparent;
      }
      .product-card + .product-card::before{
        content:"";
        width:44px;
        height:1px;
        margin:-12px auto 26px;
        display:block;
        background:rgba(139,104,71,.18);
      }
      .product-body{padding:22px 0 0}
      .inquiry-btn{width:auto;min-width:120px;padding:0 22px}
    }

    @media (max-width: 680px){
      .wrap{padding:0 18px}
      .store-top-inner{
        min-height:68px;
        grid-template-columns:auto 1fr auto;
        gap:10px;
        padding:calc(16px + env(safe-area-inset-top, 0px)) 0 12px;
      }
      .store-brand{
        justify-self:center;
        font-size:27px;
      }
      .home-link,.store-action{
        font-size:12px;
      }
      .store-action{
        min-height:34px;
        padding:0 10px;
      }
      .intro{
        padding:54px 0 42px;
      }
      h1{
        max-width:330px;
        font-size:34px;
        letter-spacing:-.045em;
      }
      .intro-copy{
        max-width:320px;
        font-size:16px;
        line-height:1.72;
      }
      .products{
        gap:58px;
        padding-bottom:72px;
      }
      .product-title{font-size:23px}
      .product-copy{font-size:14px}
      .product-media{aspect-ratio:1/1.24}
    }
  </style>
</head>
<body>
  <header class="store-top">
    <div class="wrap store-top-inner">
      <a class="home-link" href="/">홈</a>
      <a class="store-brand" href="/store.html">복작소</a>
      <a class="store-action" href="/" data-section-target="#contact">문의</a>
    </div>
  </header>

  <main>
    <section class="intro">
      <div class="wrap">
        <span class="intro-kicker">Bokjakso Store</span>
        <h1>손끝으로 전하는 고요한 물건들</h1>
        <div class="intro-line" aria-hidden="true"></div>
        <p class="intro-copy">작품에서 나온 문양과 낙관을 작게 담아, 일상 가까이에 둘 수 있는 키링과 소품으로 준비하고 있습니다.</p>
      </div>
    </section>

    <section class="wrap products" aria-label="복작소 상품">
      <article class="product-card">
        <div class="product-media">
          <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuB3cVlEZs05CzKTUVS5pYWTv2wFq094O0quk6KzZr9AHYdhNOcdDt6uPqPCj6CDhGr-o6N7lfH_e2WC7HRu1rDrAtyfzG_KZrXV2-EqjbiuDx-2Y_XxvjJvOH7I8SsfIaNe4jMU1iFkvmtsJ3cRwwVMPoay_eLtEwnpOl3s_ZwYoq6Gq-YntiRGfjMUU8jioysUy_P4E6__Q8gg8i091Qe9LH4Gwn2TSgFbczPZ5d1tkRe5hSkRri1q" alt="나무 목판 키링" loading="lazy">
        </div>
        <div class="product-body">
          <h2 class="product-title">작품 목판 키링</h2>
          <p class="product-copy">작품 문양을 나무 위에 담은 따뜻한 키링</p>
          <div class="product-price">가격 준비중</div>
          <a class="inquiry-btn" href="/" data-section-target="#contact">문의하기</a>
        </div>
      </article>

      <article class="product-card">
        <div class="product-media">
          <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuC_VkFhI-K4A3oVErMcNBhXwNulFqswimZopuXvxLaB0JtktAO_fpVQglSy3Ia_SeyuNw0LLkoZXmEGg_N2bFtcZ5Zw-f33SZiyAvLMAjAbCFBxYQRyjMYfJGiXRkAFG2bSRdVKTxgP09RgvENYe6_L_MFHcJ1y3DZGJLaCzpqIyFnB2bMXdosoUIfZcA9IMMQ5ktECDJv9veJjfI2uH39jCai75EAG1vfAFZwKkfYAOSjEol-zpD3t" alt="석재 낙관 키링" loading="lazy">
        </div>
        <div class="product-body">
          <h2 class="product-title">맞춤 낙관 키링</h2>
          <p class="product-copy">이름과 마음을 새겨 간직하는 작은 낙관</p>
          <div class="product-price">가격 준비중</div>
          <a class="inquiry-btn" href="/" data-section-target="#contact">문의하기</a>
        </div>
      </article>

      <article class="product-card">
        <div class="product-media">
          <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuCOVVlcmPS_Idc1xCw4f3BdT23xwJ5FSTlGg0IeTVkFaEAvMkTmhoArdhTx3QO4E97hQ0tL6O_CsTh8eNrmj8m8QMqTOUkpi4LUnzmq09nOLPgsxx4grm5RHOvpx8seENQoivY6Hkbr0fi8MRgYWqU-t2QKH-QATHOK8YXdJ54AyQdI8mqCE3STvvo_ZW_9k2oS4MOxClRIcjf82rSghukkKGqDMmiIH8virQdFM4o4uMfR8it4J3RH" alt="문방 소품" loading="lazy">
        </div>
        <div class="product-body">
          <h2 class="product-title">전통 문방 소품</h2>
          <p class="product-copy">책상과 서재에 조용히 놓이는 작은 물건들</p>
          <div class="product-price">가격 준비중</div>
          <a class="inquiry-btn" href="/" data-section-target="#contact">문의하기</a>
        </div>
      </article>
    </section>

    <div class="seal-mark" aria-hidden="true">
      <div class="seal-box">印</div>
    </div>
  </main>

  <script>
    document.querySelectorAll('[data-section-target]').forEach(link => {
      link.addEventListener('click', event => {
        const target = link.getAttribute('data-section-target');
        if(!target) return;
        try{
          sessionStorage.setItem('wjarchive:sectionTarget', target);
        }catch(err){}
        event.preventDefault();
        window.location.href = '/';
      });
    });
  </script>
</body>
</html>
