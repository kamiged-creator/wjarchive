<!doctype html>
<html lang="ko" translate="no" class="notranslate">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="google" content="notranslate" />
  <title>스토어 준비중 | 이원주 작품 포트폴리오</title>
  <meta name="description" content="이원주 작가의 스토어는 준비중입니다." />
  <meta name="theme-color" content="#fbf8f4" />
  <meta name="application-name" content="복작소" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="복작소" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="msapplication-TileColor" content="#fbf8f4" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/favicon-192x192.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="스토어 준비중 | 이원주 작품 포트폴리오" />
  <meta property="og:description" content="작품 키링과 소품을 준비하고 있습니다." />
  <style>
    :root{
      --bg:#f6f1ea;
      --paper:#fffdf9;
      --text:#1f1a17;
      --muted:#6e655d;
      --line:rgba(31,26,23,.12);
      --accent:#8b6847;
      --accent-soft:#e7d6c4;
      --shadow:0 20px 48px rgba(31,26,23,.08);
      --radius:24px;
      --max:1180px;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      background:var(--bg);
      color:var(--text);
      font-family:Arial, "Noto Sans KR", sans-serif;
      word-break:keep-all;
    }
    a{text-decoration:none;color:inherit}
    button,input,textarea,select{font:inherit}
    .wrap{max-width:var(--max);margin:0 auto;padding:0 24px}

    .topbar{
      position:sticky;top:0;z-index:20;
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      background:rgba(251,248,244,.92);
      border-bottom:none;
      box-shadow:none;
      margin:0;
      transition:transform .28s ease, opacity .28s ease;
      will-change:transform;
    }
    .topbar-inner{
      min-height:72px;display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding:20px 0 14px;
    }
    .brand{display:flex;flex-direction:column;gap:2px;padding-top:0;flex:0 0 auto}
    .brand-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand-title{
      display:inline-flex;
      align-items:center;
      width:max-content;
      min-height:34px;
      margin:-5px -8px -4px;
      padding:5px 8px 4px;
      font-size:23px;
      font-weight:900;
      letter-spacing:-.04em;
      line-height:1;
      user-select:none;
      -webkit-user-select:none;
    }
    .brand-sub{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
    .nav{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
    .nav a{padding:6px 12px;border-radius:999px;color:rgba(31,26,23,.74);font-size:14px;font-weight:650;background:transparent;transition:all .2s ease}
    .nav a:hover,.nav a.is-active{background:rgba(255,255,255,.55);border-color:var(--line);color:var(--text)}

    .top-tools{display:grid;gap:8px;flex:1 1 auto;min-width:0}
    .top-nav-row{display:flex;align-items:flex-start;justify-content:flex-start;gap:10px;flex-wrap:nowrap}
    .news-mini{
      display:inline-flex;align-items:center;justify-content:center;
      min-height:34px;padding:0 12px;border-radius:12px;
      position:relative; top:0;
      border:1px solid rgba(139,104,71,.18);
      background:rgba(231,214,196,.42);
      color:#6b5746;font-size:13px;font-weight:700;
      box-shadow:none;
    }
    .news-mini:hover{
      background:rgba(231,214,196,.62);
      border-color:rgba(139,104,71,.28);
      color:var(--text);
    }
    .news-link-label{
      display:inline-flex;
      align-items:center;
      gap:6px;
    }
    .new-badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:18px;
      padding:0 7px;
      border-radius:999px;
      background:rgba(139,104,71,.14);
      color:#7a5638;
      font-size:10px;
      font-weight:900;
      line-height:1;
      letter-spacing:.04em;
    }
    .news-mobile{display:none !important}

    main{
      min-height:calc(100vh - 72px);
      display:grid;
      place-items:center;
      padding:70px 0 86px;
      background:
        radial-gradient(circle at 20% 10%, rgba(255,253,249,.9), transparent 38%),
        linear-gradient(135deg, rgba(139,104,71,.10), rgba(255,253,249,.55) 52%, rgba(255,253,249,.82));
    }
    .ready{
      width:min(720px,100%);
      text-align:center;
      padding:54px 32px;
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:rgba(255,253,249,.76);
      box-shadow:var(--shadow);
    }
    .eyebrow{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:34px;
      padding:0 12px;
      border:1px solid var(--line);
      border-radius:999px;
      background:rgba(255,255,255,.62);
      color:var(--muted);
      font-size:13px;
      font-weight:700;
    }
    h1{
      margin:18px 0 14px;
      font-size:clamp(38px,7vw,64px);
      line-height:1.05;
      letter-spacing:-.045em;
    }
    .lead{
      margin:0 auto;
      max-width:520px;
      color:var(--muted);
      font-size:18px;
      line-height:1.72;
    }
    .actions{
      display:flex;
      justify-content:center;
      gap:12px;
      flex-wrap:wrap;
      margin-top:28px;
    }
    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      min-height:48px;padding:0 18px;border-radius:999px;font-weight:700;border:1px solid var(--line);
      background:var(--paper);box-shadow:var(--shadow);cursor:pointer;color:var(--text);
    }
    .btn.primary{background:var(--text);color:#fff;border-color:transparent}

    @media (max-width: 680px){
      .wrap{padding:0 18px}
      .topbar-inner{
        align-items:flex-start;
        flex-direction:column;
        gap:12px;
        padding:calc(26px + env(safe-area-inset-top, 0px)) 0 12px;
      }
      .brand{width:100%}
      .brand-top{
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:12px;
        width:100%;
      }
      .top-tools{width:100%}
      .top-nav-row{width:100%;flex-wrap:wrap;gap:8px}
      .nav{
        width:100%;
        justify-content:flex-start;
        column-gap:10px;
        row-gap:8px;
        margin-top:2px;
      }
      .nav a{
        position:relative;
        display:inline-flex;
        align-items:center;
        padding-left:7px;
        padding-right:7px;
      }
      .nav a + a::before{
        content:"";
        position:absolute;
        left:-5px;
        top:50%;
        width:1px;
        height:12px;
        border-radius:999px;
        background:rgba(31,26,23,.18);
        transform:translateY(-50%);
        pointer-events:none;
      }
      .news-mini{
        min-height:32px;
        padding:0 10px;
        border-radius:10px;
        font-size:12px;
        top:4px;
      }
      .news-mobile{display:inline-flex !important}
      .news-desktop-link{display:none !important}
      main{display:block;min-height:auto;padding:42px 0 64px}
      .ready{padding:40px 22px;border-radius:22px}
      .lead{font-size:16px}
      .btn{width:100%}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <div class="brand">
        <div class="brand-top">
          <a class="brand-title" href="/">이원주</a>
          <a class="news-mini news-mobile" href="/" data-section-target="#news"><span class="news-link-label">소식 <span class="new-badge">NEW</span></span></a>
        </div>
        <div class="brand-sub">Seal · Calligraphy</div>
      </div>
      <div class="top-tools">
        <div class="top-nav-row">
          <nav class="nav" aria-label="주요 메뉴">
            <a href="/" data-section-target="#about">작가 소개</a>
            <a href="/" data-section-target="#works">작품</a>
            <a class="is-active" href="/store.html" aria-current="page">스토어</a>
            <a href="/" data-section-target="#note">작가 노트</a>
            <a href="/" data-section-target="#contact">문의</a>
            <a class="news-desktop-link" href="/" data-section-target="#news"><span class="news-link-label">소식 <span class="new-badge">NEW</span></span></a>
          </nav>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="wrap">
      <section class="ready" aria-labelledby="storeTitle">
        <span class="eyebrow">Bokjakso Store</span>
        <h1 id="storeTitle">스토어 준비중</h1>
        <p class="lead">작품 키링과 소품을 정리하고 있습니다. 준비가 끝나면 이 페이지에서 바로 안내하겠습니다.</p>
        <div class="actions">
          <a class="btn primary" href="/">홈으로 이동</a>
          <a class="btn" href="/" data-section-target="#contact">문의하기</a>
        </div>
      </section>
    </div>
  </main>
  <script>
    document.querySelectorAll('[data-section-target]').forEach(link => {
      link.addEventListener('click', event => {
        const target = link.getAttribute('data-section-target');
        if(!target) return;
        try{
          sessionStorage.setItem('wjarchive:sectionTarget', target);
        }catch(err){}
        event.preventDefault();
        window.location.href = '/';
      });
    });
  </script>
</body>
</html>
