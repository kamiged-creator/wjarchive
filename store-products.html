<link rel="icon" href="/favicon-32x32.png"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
:root{--bg:#f6f1ea;--paper:#fffdf9;--text:#1f1a17;--muted:#6e655d;--line:rgba(31,26,23,.12);--accent:#8b6847;--seal:#b6493c;--max:1180px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;word-break:keep-all}a{color:inherit;text-decoration:none}button,select{font:inherit}.wrap{max-width:var(--max);margin:auto;padding:0 24px}.top{position:sticky;top:0;z-index:10;background:rgba(251,248,244,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.topin{height:66px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:8px;font-size:23px;font-weight:900;letter-spacing:-.06em}.brand img{width:21px;height:21px;border-radius:5px}.nav{display:flex;gap:28px;color:var(--muted);font-size:13px;font-weight:800}.tools{display:flex;align-items:center;gap:8px}.icon{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;font-size:18px}.hero{padding:70px 0 34px}.eyebrow{margin:0 0 12px;color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.12em}.hero h1{margin:0;font-family:"Noto Serif KR","Nanum Myeongjo",serif;font-size:clamp(34px,5vw,54px);font-weight:500;letter-spacing:-.055em}.hero p{margin:14px 0 0;color:var(--muted);line-height:1.7}.controls{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:18px 0 22px;border-top:1px solid var(--line)}.filters{display:flex;gap:8px;overflow:auto;scrollbar-width:none}.filter{flex:0 0 auto;min-height:38px;padding:0 16px;border:1px solid var(--line);border-radius:99px;background:var(--paper);color:var(--muted);font-size:13px;font-weight:800;cursor:pointer}.filter.active{background:var(--text);color:#fff;border-color:var(--text)}select{min-height:40px;padding:0 34px 0 13px;border:1px solid var(--line);border-radius:5px;background:var(--paper);color:var(--text)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;padding-bottom:84px}.card{position:relative;overflow:hidden;border:1px solid rgba(31,26,23,.08);border-radius:8px;background:rgba(255,253,249,.84);box-shadow:0 12px 30px rgba(31,26,23,.04);cursor:pointer}.card[hidden]{display:none}.media{position:relative;aspect-ratio:1/1.06;overflow:hidden;background:#e7d6c4}.media img{width:100%;height:100%;object-fit:cover;transition:transform .6s}.card:hover img{transform:scale(1.025)}.heart{position:absolute;top:10px;right:10px;width:34px;height:34px;border:0;border-radius:50%;background:rgba(255,255,255,.86);font-size:18px}.body{padding:15px}.body h2{margin:0;font-size:15px;letter-spacing:-.03em}.desc{margin:8px 0 0;min-height:38px;color:var(--muted);font-size:12px;line-height:1.55}.price{margin-top:11px;font-size:14px;font-weight:900}.empty{display:none;padding:80px 0;text-align:center;color:var(--muted)}footer{border-top:1px solid var(--line);padding:34px 0 40px;color:var(--muted);font-size:12px}.mobile-nav{display:none}

<header class="top"><div class="wrap topin"><a class="brand" href="/store.html"><img src="/favicon-32x32.png" alt="">복작소</a><nav class="nav"><a href="/store.html">홈</a><a href="?category=keyring">키링</a><a href="?sort=new">신상품</a><a href="/store-guide.html">이용안내</a><a href="/store-contact.html">문의</a></nav><div class="tools"><a class="icon" href="/store.html" aria-label="홈"><i class="bi bi-house"></i></a><a class="icon" href="/store-contact.html" aria-label="문의"><i class="bi bi-chat-dots"></i></a></div></div></header>
<main class="wrap"><section class="hero"><p class="eyebrow">BOKJAKSO COLLECTION</p><h1>전체 작품</h1><p>손에 오래 머무는 작은 작품을 천천히 둘러보세요.</p></section><section class="controls" aria-label="상품 필터"><div class="filters"><button class="filter active" data-filter="all">전체</button><button class="filter" data-filter="keyring">키링</button><button class="filter" data-filter="desk">문방소품</button><button class="filter" data-filter="custom">주문제작</button><button class="filter" data-filter="etc">기타</button></div><label><span class="sr-only"></span><select id="sort"><option value="recommend">추천순</option><option value="new">신상품순</option><option value="price-low">낮은 가격순</option><option value="price-high">높은 가격순</option></select></label></section><div class="grid" id="grid" aria-live="polite"></div><p class="empty" id="empty">이 분류의 상품을 준비하고 있습니다.</p></main>

<script>

ocation.search);active=q.get('category')||'all';sort.value=q.get('sort')||'recommend';document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x.dataset.filter===active));render();fetch('/api/store-products',{cache:'no-store'}).then(r=>r.json()).then(d=>{if(d.products?.length){items=d.products;render()}}).catch(()=>{});
