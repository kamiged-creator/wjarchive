<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>책 소개 | 이원주</title>
  <meta name="description" content="이원주의 책과 작업 이야기를 소개합니다.">
  <link rel="icon" href="/favicon-32x32.png">
  <style>
    :root{--bg:#f6f1ea;--paper:#fffdf9;--text:#1f1a17;--muted:#6e655d;--line:rgba(31,26,23,.12);--accent:#8b6847;--max:980px}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;word-break:keep-all}
    a{color:inherit;text-decoration:none}
    .wrap{max-width:var(--max);margin:0 auto;padding:0 24px}
    .top{position:sticky;top:0;z-index:10;background:rgba(246,241,234,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
    .topin{height:66px;display:flex;align-items:center;justify-content:space-between;gap:16px}
    .brand{font-weight:900;font-size:20px;letter-spacing:-.03em}
    .back{font-size:13px;color:var(--muted);font-weight:750}
    .toplinks{display:flex;align-items:center;gap:16px}
    .hero{padding:68px 0 42px;border-bottom:1px solid var(--line)}
    .eyebrow{font-size:12px;letter-spacing:.12em;color:var(--accent);font-weight:800;text-transform:uppercase}
    h1{margin:10px 0 12px;font-family:"Noto Serif KR","Nanum Myeongjo",serif;font-size:clamp(38px,7vw,62px);font-weight:500;letter-spacing:-.055em}
    .hero p{margin:0;color:var(--muted);line-height:1.75;font-size:15px}
    .books{display:grid;gap:34px;padding:40px 0 72px}
    .book{display:grid;grid-template-columns:minmax(210px,300px) 1fr;gap:32px;align-items:start;padding:24px;border:1px solid var(--line);border-radius:26px;background:var(--paper);transition:opacity .18s ease,transform .18s ease}
    .books.is-switching .book{opacity:0;transform:translateY(8px)}
    .cover{aspect-ratio:4/5;border-radius:18px;overflow:hidden;background:#eee6dc;border:1px solid var(--line)}
    .cover img{width:100%;height:100%;object-fit:cover;display:block}
    .copy{padding:12px 0;display:flex;flex-direction:column}
    .book-nav{margin-top:auto;padding-top:22px;border-top:1px solid var(--line);display:grid;grid-template-columns:auto auto auto;justify-content:center;align-items:center;gap:46px;font-size:12px;font-weight:750;color:var(--muted)}
    .book-nav a{transition:color .18s ease}
    .book-nav a:hover{color:var(--text)}
    .book-nav .prev{text-align:left}
    .book-nav .list-link{text-align:center;color:var(--accent)}
    .book-nav .next{text-align:right}
    .book-nav .disabled{opacity:.28;pointer-events:none}
    .number{font-size:12px;color:var(--accent);font-weight:800;letter-spacing:.08em}
    .copy h2{margin:10px 0 12px;font-family:"Noto Serif KR","Nanum Myeongjo",serif;font-size:clamp(28px,4vw,40px);font-weight:600;letter-spacing:-.045em}
    .intro{margin:0 0 22px;font-size:17px;line-height:1.75;color:#443b34;font-weight:650}
    .body{font-size:15px;color:var(--muted);line-height:1.95;white-space:pre-line}
    .status{display:inline-flex;margin-top:24px;padding:9px 13px;border-radius:999px;background:rgba(139,104,71,.09);color:#725538;font-size:13px;font-weight:800}
    .empty{padding:76px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:24px;background:rgba(255,253,249,.62)}
    footer{padding:28px 0 44px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
    .foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
    @media(min-width:721px){
      .hero{padding:32px 0 20px}
      .hero h1{font-size:38px;margin:6px 0 8px}
      .books{padding:20px 0 34px}
      .book{align-items:stretch}
    }
    @media(max-width:720px){
      .wrap{padding:0 18px}.topin{height:58px}.hero{padding:22px 0 16px}
      .hero h1{margin:6px 0 4px}
      .hero p{line-height:1.6}
      .books{padding:14px 0 44px;gap:22px}
      .book{grid-template-columns:1fr;gap:16px;padding:14px;border-radius:20px}
      .cover{width:min(86%,320px);aspect-ratio:4/5;margin:0 auto;border-radius:16px}
      .copy{padding:2px 4px 8px}.intro{font-size:15px;margin-bottom:16px}.body{font-size:14px;line-height:1.8}
      .book-nav{margin-top:18px;padding-top:14px;gap:20px;font-size:11px}
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap topin">
      <a class="brand" href="/">이원주</a>
      <div class="toplinks">
        <a class="back" href="/books.html">← 책 목록</a>
        <a class="back" href="/">홈페이지</a>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <div class="eyebrow">Book · Detail</div>
      <h1 id="bookHeroTitle">책 제목</h1>
      <p>작품과 글에 담긴 이야기를 책으로 이어갑니다.</p>
    </section>
    <section class="books" id="bookList" aria-live="polite">
      <div class="empty">책 소개를 불러오는 중입니다.</div>
    </section>
  </main>

  <footer>
    <div class="wrap foot"><span>© <span id="year"></span> Lee Wonju.</span><a href="/admin.html">관리자</a></div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL='https://vefeplfczeztbplowjmj.supabase.co';
    const SUPABASE_ANON_KEY='sb_publishable_mYAEJ3rvEscEgM3esQi_7Q_1Nv_fRLC';
    const client=(window.supabase&&SUPABASE_URL&&SUPABASE_ANON_KEY)?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
    const list=document.getElementById('bookList');
    let bookEntries=[];
    let currentBookIndex=0;
    document.getElementById('year').textContent=new Date().getFullYear();

    function esc(value){
      return String(value??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
    }
    const defaultSamples=[
      {
        title:'책 제목 샘플',
        intro:'작품과 글에 담긴 마음을 한 권의 책으로 엮어 소개합니다.',
        body:'이 페이지가 실제 책 소개가 어떻게 보이는지 확인할 수 있도록 만든 샘플입니다.',
        image:'https://images.unsplash.com/photo-1515405295579-ba7b45403062?q=80&w=1200&auto=format&fit=crop',
        status:'준비중입니다'
      },
      {
        title:'빛이 머무는 자리',
        intro:'빛과 여백, 손의 흔적을 따라 이어지는 작업 이야기를 담았습니다.',
        body:'작품이 만들어지는 순간의 빛, 공간의 여백, 손끝에 남은 흔적을 천천히 따라가는 샘플 상세페이지입니다.',
        image:'https://images.unsplash.com/photo-1549490349-8643362247b5?q=80&w=1200&auto=format&fit=crop',
        status:'준비중입니다'
      },
      {
        title:'마음의 결',
        intro:'작품 속 선과 색에 스며든 감정과 시간을 차분히 기록한 책입니다.',
        body:'한 작품을 오래 바라보며 발견한 감정과 시간의 결을 글과 이미지로 엮는 형식을 보여주는 샘플입니다.',
        image:'https://images.unsplash.com/photo-1541961017774-22349e4a1262?q=80&w=1200&auto=format&fit=crop',
        status:'준비중입니다'
      },
      {
        title:'작업의 시간',
        intro:'작품이 태어나는 과정과 작가의 생각을 함께 엮은 기록입니다.',
        body:'작업 전의 생각부터 완성까지 이어지는 과정을 한 권의 기록처럼 구성한 샘플 상세페이지입니다.',
        image:'https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?q=80&w=1200&auto=format&fit=crop',
        status:'준비중입니다'
      }
    ];

    function renderBook(book,label,nav={}){
      if(!book){
        list.innerHTML='<div class="empty">책 정보를 찾을 수 없습니다.</div>';
        return;
      }
      const title=book.title||'제목 미정';
      document.title=title+' | 이원주';
      const heroTitle=document.getElementById('bookHeroTitle');
      if(heroTitle) heroTitle.textContent=title;

      const prevHtml=Number.isInteger(nav.prevIndex)
        ? '<a class="prev book-step" data-book-index="'+nav.prevIndex+'" href="'+esc(nav.prevHref)+'">← 이전 책</a>'
        : '<span class="prev disabled">← 이전 책</span>';
      const nextHtml=Number.isInteger(nav.nextIndex)
        ? '<a class="next book-step" data-book-index="'+nav.nextIndex+'" href="'+esc(nav.nextHref)+'">다음 책 →</a>'
        : '<span class="next disabled">다음 책 →</span>';

      list.innerHTML=`
        <article class="book">
          <div class="cover">${book.image?'<img src="'+esc(book.image)+'" alt="'+esc(book.title||'책 표지')+'">':''}</div>
          <div class="copy">
            <div class="number">${esc(label)}</div>
            ${book.intro?'<p class="intro">'+esc(book.intro)+'</p>':''}
            ${book.body?'<div class="body">'+esc(book.body)+'</div>':''}
            ${book.preparing?'<div class="status">준비중입니다</div>':(book.status?'<div class="status">'+esc(book.status)+'</div>':'')}
            <nav class="book-nav" aria-label="책 이동">
              ${prevHtml}
              <a class="list-link" href="/books.html">책 목록</a>
              ${nextHtml}
            </nav>
          </div>
        </article>
      `;
    }

    function renderEntry(index){
      const entry=bookEntries[index];
      if(!entry){renderBook(null,'');return;}
      currentBookIndex=index;
      renderBook(entry.book,entry.label,{
        prevIndex:index>0?index-1:null,
        prevHref:index>0?bookEntries[index-1].href:'',
        nextIndex:index<bookEntries.length-1?index+1:null,
        nextHref:index<bookEntries.length-1?bookEntries[index+1].href:''
      });
    }

    function scrollToBookCard(){
      const header=document.querySelector('.top');
      const headerHeight=header?.getBoundingClientRect().height||0;
      const y=list.getBoundingClientRect().top+window.scrollY-headerHeight-10;
      window.scrollTo({top:Math.max(0,y),behavior:'smooth'});
    }

    function switchBook(index,{push=true,scroll=true}={}){
      if(!Number.isInteger(index)||index<0||index>=bookEntries.length||index===currentBookIndex) return;
      const target=bookEntries[index];
      list.classList.add('is-switching');

      window.setTimeout(()=>{
        renderEntry(index);
        if(push) history.pushState({bookIndex:index},'',target.href);
        if(scroll) scrollToBookCard();
        window.requestAnimationFrame(()=>{
          window.requestAnimationFrame(()=>list.classList.remove('is-switching'));
        });
      },150);
    }

    function indexFromLocation(){
      const params=new URLSearchParams(window.location.search);
      if(params.has('sample')){
        const sampleIndex=Number(params.get('sample'));
        return bookEntries.findIndex(entry=>entry.kind==='sample'&&entry.sourceIndex===sampleIndex);
      }
      if(params.has('book')){
        const realIndex=Number(params.get('book'));
        return bookEntries.findIndex(entry=>entry.kind==='book'&&entry.sourceIndex===realIndex);
      }
      return 0;
    }

    list.addEventListener('click',event=>{
      const link=event.target.closest('a.book-step');
      if(!link||event.metaKey||event.ctrlKey||event.shiftKey||event.altKey) return;
      const index=Number(link.dataset.bookIndex);
      if(!Number.isInteger(index)) return;
      event.preventDefault();
      switchBook(index,{push:true,scroll:true});
    });

    async function load(){
      let value={};
      if(client){
        const {data,error}=await client.from('site_settings').select('value').eq('key','books').maybeSingle();
        if(error) console.warn(error);
        else{
          value=data?.value||{};
          if(typeof value==='string'){try{value=JSON.parse(value)}catch(e){value={}}}
        }
      }

      const savedSamples=Array.isArray(value.sampleItems)?value.sampleItems:[];
      const samples=defaultSamples.map((fallback,index)=>({...fallback,...(savedSamples[index]||{})}));
      const sampleHidden=value.sampleHidden===true;
      const books=(Array.isArray(value.items)?value.items:[]).filter(b=>b&&(b.title||b.intro||b.body||b.status||b.image));

      bookEntries=[];
      if(!sampleHidden){
        samples.forEach((book,index)=>{
          bookEntries.push({
            book,
            href:'/book.html?sample='+index,
            label:'BOOK '+String(index+1).padStart(2,'0')+' · SAMPLE',
            kind:'sample',
            sourceIndex:index
          });
        });
      }
      books.forEach((book,index)=>{
        const number=index+(sampleHidden?1:samples.length+1);
        bookEntries.push({
          book,
          href:'/book.html?book='+index,
          label:'BOOK '+String(number).padStart(2,'0'),
          kind:'book',
          sourceIndex:index
        });
      });

      if(!bookEntries.length){
        renderBook(null,'');
        return;
      }

      const requested=indexFromLocation();
      currentBookIndex=requested>=0?requested:0;
      renderEntry(currentBookIndex);
    }

    window.addEventListener('popstate',()=>{
      const index=indexFromLocation();
      if(index>=0&&index!==currentBookIndex){
        switchBook(index,{push:false,scroll:true});
      }
    });

    load();
  </script>
</body>
</html>
