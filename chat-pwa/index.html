<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171717">
  <meta name="description" content="복작소 채팅과 승인 회원 전용 클럽을 이용하는 독립 앱">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="복작소 채팅">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css">
  <title>복작소 | 채팅과 클럽</title>
  <style>
    :root{color-scheme:light;--bg:#f6f1ea;--paper:#fffdf9;--panel:#f4ece2;--text:#25201b;--muted:#76695f;--border:#e3d5c6;--accent:#8b6847;--shadow:0 16px 38px rgba(45,29,17,.07)}
    body.dark{color-scheme:dark;--bg:#111111;--paper:#1c1c1c;--panel:#292622;--text:#f6f1ed;--muted:#b9ada3;--border:#3b322c;--accent:#bb9169;--shadow:0 16px 38px rgba(0,0,0,.20)}
    *{box-sizing:border-box}
    html{min-height:100%;font-family:"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
    body{margin:0;min-height:100dvh;background:var(--bg);color:var(--text)}
    a{color:inherit;text-decoration:none}
    button{font:inherit;cursor:pointer}
    .container{max-width:690px;margin:0 auto;padding:30px 18px calc(122px + env(safe-area-inset-bottom))}
    .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px;gap:12px}
    .top-brand{font-size:20px;font-weight:850;letter-spacing:-.04em}
    .top-caption{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.13em;margin-top:3px}
    .theme{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--border);background:var(--paper);color:var(--text);font-size:21px}
    .hero{padding:26px 20px 29px;text-align:center;background:var(--paper);border:1px solid var(--border);border-radius:25px;box-shadow:var(--shadow)}
    .hero-logo{width:90px;height:90px;display:block;margin:0 auto 13px;border-radius:22px;object-fit:cover}
    h1{margin:0 0 7px;font-size:34px;letter-spacing:-.055em;line-height:1.25}
    .en{font-size:11px;letter-spacing:.20em;color:var(--accent);font-weight:850}
    .tagline{margin:15px 0 0;font-size:16px;line-height:1.7;color:var(--muted);word-break:keep-all}
    .section-title{margin:27px 2px 14px;font-size:16px;font-weight:850;letter-spacing:-.02em}
    .cards{display:grid;gap:12px}
    .entry{display:flex;align-items:center;gap:16px;min-height:102px;padding:18px 16px;border:1.5px solid var(--border);border-radius:20px;background:var(--paper);box-shadow:0 5px 18px rgba(0,0,0,.025);transition:transform .15s,border-color .15s}
    .entry:hover{border-color:var(--accent);transform:translateY(-1px)}
    .entry:active{transform:translateY(1px)}
    .entry-icon{display:grid;place-items:center;flex:0 0 56px;width:56px;height:56px;border-radius:16px;background:var(--panel);font-size:27px}
    .entry-text{min-width:0;flex:1}
    .entry-text strong{display:block;font-size:19px;line-height:1.3;letter-spacing:-.02em}
    .entry-text small{display:block;margin-top:6px;color:var(--muted);font-size:13px;line-height:1.5;word-break:keep-all}
    .arrow{font-size:25px;color:var(--accent);flex:0 0 auto}
    .note{margin:23px 4px 0;text-align:center;color:var(--muted);font-size:13px;line-height:1.7;word-break:keep-all}
    .bottom{position:fixed;z-index:4;left:50%;bottom:0;transform:translateX(-50%);width:min(690px,100%);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;padding:9px 8px calc(9px + env(safe-area-inset-bottom));background:var(--paper);border:1px solid var(--border);border-bottom:0;border-radius:21px 21px 0 0;box-shadow:0 -10px 24px rgba(0,0,0,.05)}
    .bottom a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:56px;border-radius:14px;color:var(--text);font-size:12px;font-weight:750;text-align:center}
    .bottom a .nav-icon{font-size:22px;line-height:1.15}
    .bottom a:hover,.bottom a:focus-visible{background:var(--panel)}
    a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
    @media(max-width:380px){.container{padding-left:13px;padding-right:13px}.entry{gap:11px}.entry-icon{width:48px;height:48px;flex-basis:48px}.entry-text strong{font-size:18px}.entry-text small{font-size:12px}}

    /* Small-screen home: make all three entry cards easy to see above
       the fixed bottom navigation without reducing tap targets. */
    @media(max-width:560px){
      .container{padding-top:18px;padding-bottom:calc(95px + env(safe-area-inset-bottom))}
      .top{margin-bottom:17px}
      .hero{padding:16px 15px 18px;border-radius:23px}
      .hero-logo{width:72px;height:72px;margin-bottom:9px;border-radius:18px}
      .hero h1{font-size:30px;margin-bottom:5px}
      .tagline{font-size:14px;margin-top:9px;line-height:1.55}
      .section-title{margin:18px 2px 11px}
      .cards{gap:9px}
      .entry{min-height:84px;padding:10px 14px;gap:12px;border-radius:18px}
      .entry-icon{flex-basis:48px;width:48px;height:48px;font-size:24px;border-radius:14px}
      .entry-text strong{font-size:17px}
      .entry-text small{font-size:12px;margin-top:4px}
      .note{margin-top:15px;font-size:12px}
    }
    @media(max-width:380px){
      .entry{min-height:82px;gap:10px;padding:9px 11px}
      .entry-icon{width:46px;height:46px;flex-basis:46px}
    }
    @media(prefers-reduced-motion:reduce){.entry{transition:none}}
  </style>
</head>
<body>
  <main class="container">
    <header class="top">
      <div><div class="top-brand">복작소</div><div class="top-caption">BOKJAKSO COMMUNITY</div></div>
      <button class="theme" id="themeToggle" type="button" aria-label="화면 테마 변경" title="화면 테마 변경">☾</button>
    </header>
    <section class="hero" aria-labelledby="pageTitle">
      <img src="/icon-192.png" alt="" class="hero-logo" width="90" height="90">
      <h1 id="pageTitle">복작소</h1>
      <div class="en">BOKJAKSO COMMUNITY</div>
      <p class="tagline">우리들의 따뜻한 이야기 공간</p>
    </section>
    <h2 class="section-title">어디로 들어갈까요?</h2>
    <nav class="cards" aria-label="복작소 서비스 선택">
      <a class="entry" href="/chat.html?tab=rooms">
        <span class="entry-icon" aria-hidden="true">💬</span>
        <span class="entry-text"><strong>채팅방</strong><small>누구나 이용하는 자유로운 대화 공간</small></span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>
      <a class="entry" href="/chat.html?tab=club">
        <span class="entry-icon" aria-hidden="true">👥</span>
        <span class="entry-text"><strong>복작소 클럽</strong><small>가입 신청 후 관리자 승인 회원 전용</small></span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>
      <a class="entry" href="/chat.html?tab=me">
        <span class="entry-icon" aria-hidden="true">👤</span>
        <span class="entry-text"><strong>내 정보</strong><small>닉네임과 프로필 사진 관리</small></span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>
    </nav>
    <p class="note">기존 채팅방과 대화는 그대로 유지돼요.<br>클럽에만 별도의 관리자 승인 절차가 있어요.</p>
  </main>
  <nav class="bottom" aria-label="하단 바로가기">
    <a href="/chat.html?tab=rooms"><span class="nav-icon" aria-hidden="true">💬</span>채팅방</a>
    <a href="/chat.html?tab=club"><span class="nav-icon" aria-hidden="true">👥</span>복작소 클럽</a>
    <a href="/chat.html?tab=me"><span class="nav-icon" aria-hidden="true">👤</span>내 정보</a>
  </nav>
  <script>
    (()=>{
      const KEY='bokjaksoChatThemeV1';
      const btn=document.getElementById('themeToggle');
      function setTheme(mode){
        const dark=mode==='dark';
        document.body.classList.toggle('dark',dark);
        btn.textContent=dark?'☀':'☾';
        btn.setAttribute('aria-label',dark?'밝은 모드로 전환':'다크 모드로 전환');
        localStorage.setItem(KEY,dark?'dark':'light');
      }
      setTheme(localStorage.getItem(KEY)||'light');
      btn.addEventListener('click',()=>setTheme(document.body.classList.contains('dark')?'light':'dark'));
      if('serviceWorker' in navigator){
        window.addEventListener('load',()=>navigator.serviceWorker.register('/bokjakso-push-sw.js',{scope:'/'}).catch(()=>{}));
      }
    })();
  </script>
</body>
</html>
