<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#fbf8f4"><title>관리자 로그인 | 복작소 채팅</title>
<link rel="icon" href="/icon-192.png"><link rel="manifest" href="/site.webmanifest">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:20px;background:#f8f4ed;font-family:"Pretendard Variable","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#251d18}
main{background:#fffdfa;width:min(440px,100%);padding:28px;border:1px solid #e6d8ca;border-radius:24px;box-shadow:0 12px 36px #27180b0b}
.logo{width:80px;height:80px;display:block;margin:0 auto 16px}.center{text-align:center}h1{font-size:23px;margin:0 0 10px}.hint{color:#766b62;font-size:15px;line-height:1.6;margin:0 0 24px}
label{display:block;font-size:15px;font-weight:700;margin-bottom:8px}input{font:inherit;font-size:17px;display:block;width:100%;height:56px;border:2px solid #d3c1b0;border-radius:14px;background:#fff;padding:0 14px}
input:focus{outline:3px solid #b99a7c80}button{font:inherit;cursor:pointer}button.submit{width:100%;height:54px;background:#9f7047;border:0;color:#fff;border-radius:14px;font-weight:750;font-size:18px;margin-top:18px}
a{display:inline-block;padding:14px;color:#765e4a;font-size:15px}#status{color:#a33;min-height:24px;margin:10px 0 0;line-height:1.5}
</style></head><body><main><img class="logo" src="/icon-192.png" alt="">
<div class="center"><h1>채팅 관리자 로그인</h1><p class="hint">기존 복작소 관리자 비밀번호로 로그인하면<br>채팅방을 만들고 관리할 수 있어요.</p></div>
<form id="loginForm"><label for="password">관리자 비밀번호</label><input id="password" type="password" autocomplete="current-password" required placeholder="관리자 비밀번호 입력">
<button type="submit" class="submit" id="loginButton">관리자 로그인</button><p id="status" role="status"></p></form>
<div class="center"><a href="/chat.html">채팅방 목록으로 돌아가기</a></div></main>
<script>
const ADMIN_KEY='wjarchiveAdminAccessToken';
const projectUrl='https://vefeplfczeztbplowjmj.supabase.co';
const publishableKey='sb_publishable_mYAEJ3rvEscEgM3esQi_7Q_1Nv_fRLC';
document.getElementById('loginForm').addEventListener('submit',async event=>{
  event.preventDefault();
  const button=document.getElementById('loginButton'),status=document.getElementById('status');
  button.disabled=true;status.textContent='관리자 계정 확인 중...';
  try{
    const response=await fetch(projectUrl+'/auth/v1/token?grant_type=password',{
      method:'POST',headers:{'Content-Type':'application/json',apikey:publishableKey},
      body:JSON.stringify({email:'bokjakso.shop@gmail.com',password:document.getElementById('password').value})
    });
    const auth=await response.json().catch(()=>({}));
    if(!response.ok||!auth.access_token)throw Error('관리자 비밀번호를 확인해 주세요.');
    const minted=await fetch('/api/admin-session',{method:'POST',headers:{Authorization:'Bearer '+auth.access_token}});
    const tokenData=await minted.json().catch(()=>({}));
    if(!minted.ok||!tokenData.accessToken)throw Error(tokenData.message||'관리자 인증을 완료하지 못했습니다.');
    sessionStorage.setItem(ADMIN_KEY,tokenData.accessToken);
    document.getElementById('password').value='';
    location.replace('/chat-admin.html');
  }catch(error){status.textContent=error.message||'로그인에 실패했습니다.'}
  finally{button.disabled=false}
});
</script></body></html>
