<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171411">
<meta name="robots" content="noindex,nofollow">
<title>아라 영상 테스트 | 복작소</title>
<style>
:root{color-scheme:dark;--bg:#171411;--panel:#241e19;--line:#6d563e;--gold:#c6a16e;--text:#f7eee2;--muted:#c4b5a3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,"Apple SD Gothic Neo",sans-serif;min-height:100dvh}
main{width:min(100%,620px);margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:12px 16px calc(20px + env(safe-area-inset-bottom))}
header{height:48px;display:flex;align-items:center;gap:12px}
header a{color:var(--gold);text-decoration:none;font-size:26px;line-height:1}
header strong{font-size:16px}
.intro{text-align:center;padding:18px 4px 15px}
.intro h1{font-size:22px;margin:0 0 7px}
.intro p{font-size:13px;color:var(--muted);margin:0;line-height:1.6}
.scene{position:relative;flex:1;min-height:360px;max-height:76dvh;overflow:hidden;border:1px solid rgba(198,161,110,.35);border-radius:22px;background:#090807}
.scene video{width:100%;height:100%;position:absolute;inset:0;object-fit:cover;object-position:center 42%}
.caption{position:absolute;left:14px;right:14px;bottom:14px;padding:12px 14px;border-radius:14px;background:rgba(0,0,0,.56);backdrop-filter:blur(8px);font-size:14px;line-height:1.6;text-align:center}
.actions{display:flex;gap:10px;margin-top:14px}
.actions button{flex:1;min-height:48px;border:1px solid var(--line);border-radius:14px;background:#382b20;color:var(--text);font:inherit;font-weight:700}
.actions button.primary{background:var(--gold);border-color:var(--gold);color:#20170e}
.status{text-align:center;color:var(--muted);font-size:12px;line-height:1.6;padding:12px 5px 0}
@media(max-width:420px){main{padding-left:12px;padding-right:12px}.scene{min-height:320px}.intro{padding-top:12px}}
</style>
</head>
<body>
<main>
<header><a href="/saju-chat.html" aria-label="복작소 사주 화면으로 돌아가기">‹</a><strong>복작소 · 아라 영상 테스트</strong></header>
<section class="intro">
<h1>아라 영상 미리보기</h1>
<p>기존 아라 영상을 별도 페이지에서 확인하는 테스트 화면입니다.</p>
</section>
<section class="scene" aria-label="아라 상담사 영상">
<video id="araVideo" src="https://pherh2oisbugqyou.public.blob.vercel-storage.com/ara_counselor_final_16s.mp4" autoplay muted loop playsinline controls preload="auto"></video>
<div class="caption">안녕하세요. 복작소 아라 상담사입니다.<br>오늘은 어떤 이야기를 나눠볼까요?</div>
</section>
<div class="actions">
<button class="primary" id="playPause" type="button">영상 일시정지</button>
<button id="sound" type="button">소리 켜기</button>
</div>
<p class="status" id="status" role="status">영상만 확인하는 독립 테스트 페이지입니다. 음성대화·AI 연결은 아직 하지 않았습니다.</p>
</main>
<script>
const video=document.getElementById("araVideo");
const playPause=document.getElementById("playPause");
const sound=document.getElementById("sound");
const status=document.getElementById("status");
playPause.addEventListener("click",async()=>{
 if(video.paused){try{await video.play();playPause.textContent="영상 일시정지";}catch(e){status.textContent="재생 버튼을 한 번 더 눌러 주세요.";}}
 else{video.pause();playPause.textContent="영상 재생";}
});
sound.addEventListener("click",()=>{
 video.muted=!video.muted;
 sound.textContent=video.muted?"소리 켜기":"소리 끄기";
 status.textContent=video.muted?"영상 소리가 꺼져 있습니다.":"영상 소리가 켜졌습니다.";
});
video.addEventListener("error",()=>{status.textContent="영상 파일을 불러오지 못했습니다. 영상 주소와 파일 상태를 확인해 주세요.";});
</script>
</body>
</html>
