<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f0e8">
<title>복작소 AI 사주채팅 · 체험</title>
<style>
:root{font-family:Pretendard,"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;color:#35271e;background:#f6f1e9;font-synthesis:none}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 100% 0%,#fffaf1 0,transparent 38%),#f6f1e9}
button,input{font:inherit}button{cursor:pointer}a{color:inherit}
.page{max-width:760px;margin:auto;min-height:100dvh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:flex-start;gap:10px;padding:11px 17px 7px}
.home{display:inline-flex;align-items:center;gap:8px;min-height:46px;text-decoration:none;font-size:17px;font-weight:850;color:#3c291d}
.home .arrow{font-size:24px;font-weight:400}.brand{font-weight:900;color:#805d43;font-size:15px}
.hero{text-align:center;padding:2px 17px 6px}.eyebrow{letter-spacing:.17em;color:#95745a;font-size:11px;font-weight:800}
h1{font-family:"Noto Serif KR",Georgia,serif;font-size:29px;letter-spacing:-.06em;margin:0 0 5px;color:#513522}
.lead{font-size:14px;line-height:1.5;color:#796b61;margin:0}
.beta{display:inline-flex;align-items:center;justify-content:center;background:#fdf7ec;color:#704f33;border:1px solid #dcc6ab;font-size:12px;font-weight:750;border-radius:999px;padding:7px 12px;margin-top:12px}
section.panel{background:#fffdfa;border:1px solid #e2d5c3;border-radius:22px;margin:10px 14px;padding:17px 13px;box-shadow:0 8px 24px #4837220b}
/* Keep all four portraits large; trim only excessive space beneath the advisor choices. */
.selection-view > section.panel:first-of-type{padding-bottom:9px}
.panel h2{font-size:17px;margin:0 0 14px;letter-spacing:-.025em}.hint{font-size:12px;color:#827266;line-height:1.5}
.avatars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.avatar{background:transparent;color:#3b2b20;border:2px solid transparent;border-radius:15px;padding:9px 3px 5px;display:flex;align-items:center;flex-direction:column;gap:5px;min-width:0;touch-action:manipulation}
.avatar[aria-pressed="true"]{background:transparent;border-color:transparent}
.portrait{display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;width:clamp(56px,17vw,100px);height:clamp(56px,17vw,100px);border-radius:50%;border:2px solid #e4d1be;background:linear-gradient(140deg,#fbe4d1,#ceb29c);color:#704d31;font-size:27px;font-weight:900}
.avatar-portrait-wrap{display:block;position:relative;flex:none}
.avatar[aria-pressed="true"] .portrait{border-color:#bd9369;box-shadow:0 0 0 3px #eddbc3}
.avatar[aria-pressed="true"] strong{color:#7c4f2d}
.avatar-check{position:absolute;right:-3px;bottom:1px;background:#916744;color:white;border:2px solid #fffdfa;border-radius:50%;height:23px;width:23px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;opacity:0;transform:scale(.7);transition:opacity .12s ease,transform .12s ease;pointer-events:none}
.avatar[aria-pressed="true"] .avatar-check{opacity:1;transform:scale(1)}
.portrait img{width:100%;height:100%;object-fit:cover;display:block}
.avatar strong{font-size:15px}.avatar small{font-size:11px;line-height:1.3;color:#877061;text-align:center;word-break:keep-all;min-height:28px}
.topics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.topic{border:1.5px solid #e2d3c1;border-radius:14px;background:#fbf7f1;color:#4b3427;display:flex;align-items:center;gap:7px;text-align:left;padding:12px 10px;min-height:61px;font-weight:750;font-size:14px;touch-action:manipulation}
.topic .symbol{font-size:21px;flex:none}.topic[aria-pressed="true"]{background:#765338;color:white;border-color:#765338}
.topic:disabled{opacity:.45}.topic small{font-size:11px;font-weight:450;display:block;margin-top:2px}
.chat-panel{display:flex;flex-direction:column;flex:1;min-height:355px;margin-top:10px!important}
.chat-heading{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:8px}
.chat-heading h2{margin:0}.clear{padding:8px;border:1px solid #dbccbb;border-radius:10px;background:#fff;color:#745744;font-size:12px;font-weight:750}
.disclaimer{font-size:12px;line-height:1.5;border-radius:11px;padding:9px 10px;background:#f8eee0;color:#775b45;margin:0 0 10px}
.messages{display:flex;flex-direction:column;gap:13px;overflow-y:auto;min-height:240px;max-height:46dvh;padding:8px 2px 14px;overscroll-behavior:contain}
.message{display:flex;align-items:flex-end;gap:7px}.message.user{justify-content:flex-end}
.bubble{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55;font-size:15px;max-width:min(85%,500px);background:#f4ede4;padding:12px 14px;border-radius:16px 16px 16px 5px}
.user .bubble{background:#d8b99c;color:#38261b;border-radius:16px 16px 5px 16px}
.msg-avatar{width:32px;height:32px;border:2px solid #b99675;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#f4dfcc;flex:none}
.msg-avatar img{display:block;width:100%;height:100%;object-fit:cover}
.msg-fallback{font-size:14px;background:#e8d0b9;color:#6a4530;display:flex;align-items:center;justify-content:center;font-weight:800}
.meta{font-size:11px;color:#958678;margin:3px 0 0 36px}
.composer{display:flex;gap:7px;border-top:1px solid #eee3d6;padding:12px 0 2px;align-items:center}
.composer input{flex:1;min-width:0;min-height:49px;border-radius:14px;border:1.5px solid #d8c7b5;padding:10px 13px;outline:none;font-size:15px;background:white;color:#382b23}
.composer input:focus{border-color:#947456;box-shadow:0 0 0 2px #a67b4a22}
.send{min-width:74px;min-height:49px;border:0;border-radius:14px;background:#765338;color:#fff;font-weight:850}
.send:disabled{opacity:.5}.tips{margin:8px 0 0;font-size:11px;color:#88766a;line-height:1.55;text-align:center}
footer{text-align:center;color:#938073;padding:12px 20px 25px;font-size:11px;line-height:1.55}
button:focus-visible,a:focus-visible{outline:3px solid #9b6e4d;outline-offset:3px}
@media(min-width:600px){.top{padding-top:22px}.hero{padding-top:10px}.messages{min-height:295px}.portrait{width:96px;height:96px}}
@media(max-width:355px){.top{padding:11px}.avatar small{font-size:10px}.avatar strong{font-size:14px}.topic{padding:9px 7px;font-size:13px}.panel{margin-left:9px!important;margin-right:9px!important}}

/* Two-stage mobile flow: adviser/topic selection then viewport-filling chat. */
[hidden]{display:none!important}
.selection-view{display:flex;flex-direction:column;padding-bottom:10px}
.choose-tip{text-align:center;color:#846f5d;font-size:12px;line-height:1.5;margin:8px 18px}
.start-chat{display:block;margin:7px 14px 8px;min-height:49px;border:0;border-radius:15px;background:#765338;color:white;font-weight:850;font-size:16px}
body.chat-active{height:100dvh;overflow:hidden}
.chat-active .page{height:100dvh;min-height:0;max-width:none;overflow:hidden}
.chat-active footer{display:none}
.chat-view{display:flex;flex-direction:column;flex:1;min-height:0;height:100%;width:100%;background:#fffaf4}
section.panel.chat-full{display:flex;flex:1;flex-direction:column;min-height:0;max-width:760px;width:100%;height:100%;overflow:hidden;margin:0 auto!important;padding:0;border:0;border-radius:0;background:#fffaf4;box-shadow:none}
.chat-full .chat-heading{flex-shrink:0;display:flex;gap:9px;align-items:center;margin:0;min-height:66px;padding:9px 12px;background:#fffdfa;border-bottom:1px solid #e7d8c6}
.back-to-select{width:38px;height:44px;border:0;border-radius:8px;background:none;color:#60442e;font-size:29px;flex:none}
.header-portrait{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden;border:2px solid #b99675;border-radius:50%;background:#f4dfcc;color:#674631;font-weight:800}
.header-portrait img{display:block;width:100%;height:100%;object-fit:cover}
.chat-info{display:flex;flex:1;min-width:0;flex-direction:column;gap:3px}
.chat-info h2{font-size:17px;margin:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chat-info small{font-size:11px;color:#856d59;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-full .clear{flex:none;min-height:36px}
.chat-full .disclaimer{flex:none;border-radius:0;border-bottom:1px solid #eee0ce;margin:0;padding:8px 15px;font-size:11px;background:#fcf1e2}
.chat-full .messages{flex:1;min-height:0;max-height:none;overflow-y:auto;padding:17px max(14px,calc((100% - 720px)/2)) 20px;gap:14px;background:linear-gradient(160deg,#fffaf4,#f7f0e6);-webkit-overflow-scrolling:touch}
.chat-full .composer{flex:none;min-height:72px;margin:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#fffdfa;border-top:1px solid #e7d8c6}
.chat-full .composer input,.chat-full .send{min-height:50px}
/* Match the rounded, unified text-entry field in the Bokjakso Club chat. */
.chat-full .composer{min-height:65px;gap:0;padding:6px 12px calc(6px + env(safe-area-inset-bottom));background:#fffdfa}
.chat-full .composer-inner{display:flex;align-items:center;gap:5px;min-width:0;width:min(calc(100% - 44px),450px);margin-inline:auto;min-height:53px;padding:5px 6px 5px 12px;background:#fff;border:1.5px solid rgba(31,26,23,.12);border-radius:25px;box-shadow:none}
.chat-full .composer-inner:focus-within{border-color:#8b6847}
.chat-full .composer .composer-inner input{display:block;flex:1;min-width:0;width:100%;height:40px;min-height:40px;padding:0 4px;border:0;border-radius:0;outline:none;background:transparent;color:#382b23;font-size:17px;box-shadow:none}
.chat-full .composer .composer-inner input:focus{border:0;outline:none;box-shadow:none}
.chat-full .composer .composer-inner input::placeholder{color:#918980;opacity:1}
.chat-full .composer .composer-inner .send{flex:none;width:55px;min-width:55px;height:40px;min-height:40px;padding:0 4px;border:0;border-radius:20px;background:#a7825c;color:#fff;font-size:16px;font-weight:850;white-space:nowrap}
.chat-full .tips{display:none}
@media(max-width:355px){.chat-full .chat-heading{padding:8px 6px;gap:5px}.chat-info h2{font-size:15px}.chat-full .clear{padding:6px}}

/* Inline birth-information intake inside the chat stream; never sent or persisted. */
.intake-card{align-self:center;width:min(calc(100% - 40px),450px);margin:0 auto;background:#fffdfa;border:1px solid #deccb8;border-radius:18px;padding:15px 14px;box-shadow:0 4px 14px #56402b10}
.intake-title{font-weight:850;font-size:15px;color:#61412c;line-height:1.4;margin:0 0 5px}
.intake-intro{font-size:12px;line-height:1.55;color:#836c59;margin:0 0 12px}
.intake-section{border-top:1px solid #f0e6d9;padding:12px 0 6px}
.intake-section:first-of-type{border-top:0;padding-top:2px}
.intake-person{font-size:13px;font-weight:850;color:#73523a;margin:0 0 10px}
.intake-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px 9px}
.intake-field{display:flex;flex-direction:column;gap:5px;min-width:0;font-size:12px;color:#705b4c;font-weight:750}
.intake-field.wide{grid-column:1/-1}
.intake-date-parts{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,.9fr) minmax(0,.9fr);gap:7px;min-width:0}
.intake-date-parts input,.intake-date-parts select{min-width:0;width:100%;height:44px;font-size:15px}
.intake-date-parts input::placeholder{font-size:13px;color:#8a7666}
.intake-time-parts{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:8px;min-width:0}
.intake-time-parts input,.intake-time-parts select{width:100%;min-width:0;height:44px;font-size:15px}
.intake-time-parts input::placeholder{color:#a59a8f;opacity:1;font-weight:500}
.intake-time-parts input:disabled,.intake-time-parts select:disabled{background:#f5f1eb;color:#8c8178}
.intake-time-options{grid-column:1/-1}
@media(max-width:355px){.intake-date-parts{gap:5px;grid-template-columns:minmax(0,1.4fr) minmax(0,.85fr) minmax(0,.85fr)}.intake-date-parts input::placeholder{font-size:12px}}
.intake-field input,.intake-field select{width:100%;min-width:0;height:44px;border:1px solid #d6c3ad;border-radius:9px;background:#fff;color:#49372c;padding:5px 8px;font-size:15px}
.intake-field input:focus-visible,.intake-field select:focus-visible{outline:2px solid #ac815b;outline-offset:1px}
.intake-check{display:inline-flex;gap:7px;align-items:center;font-size:12px;color:#694e39;min-height:30px;cursor:pointer;white-space:normal}
.intake-check input{width:17px;height:17px;accent-color:#826045}
.intake-actions{display:flex;align-items:center;gap:8px;margin-top:12px}
.intake-action{flex:1;min-height:44px;border:0;border-radius:11px;background:#765338;color:#fff;font-size:14px;font-weight:800}
.intake-action:disabled{background:#e6ded5;color:#978879;border:1px solid #d9cbbd;cursor:default;opacity:1}
.intake-field.is-disabled>span{color:#95877a}
.intake-sample{min-height:44px;padding:0 10px;border:1px solid #d5c2ab;border-radius:11px;background:#faf2e7;color:#70513b;font-size:12px;font-weight:800}
.intake-privacy{font-size:11px;line-height:1.55;color:#92735d;margin:9px 0 0}
.intake-summary{white-space:pre-wrap;line-height:1.65;font-size:13px;color:#49372e;margin:10px 0}
.intake-edit{border:1px solid #d5c2ab;color:#6e4e33;background:#fff;border-radius:10px;min-height:37px;padding:5px 14px;font-size:13px;font-weight:800}
@media(max-width:355px){.intake-card{width:calc(100% - 32px);margin-inline:auto;padding:12px}.intake-fields{gap:7px}.intake-field input,.intake-field select{font-size:14px;padding:5px}}

/* 50–60대 회원 가독성 개선: 16px 이상의 입력 글씨와 넉넉한 행간.
   작은 화면에서도 가로 넘침 없이 상담 카드 구조를 유지한다. */
.lead{font-size:16px;line-height:1.6;color:#68564a}
.panel h2{font-size:20px;line-height:1.4}
.avatar strong{font-size:17px}
.avatar small{font-size:13px;line-height:1.4;color:#705d4f}
.topic{font-size:16px;min-height:65px}
.topic small{font-size:13px;font-weight:500;line-height:1.4}
.start-chat{font-size:17px;min-height:50px}
.chat-info h2{font-size:18px}
.chat-info small{font-size:13px;color:#735d4d}
.chat-full .clear{font-size:15px;min-height:44px;padding:8px 12px}
.chat-full .disclaimer{font-size:13px;line-height:1.65;color:#67503d}
.bubble{font-size:17px;line-height:1.65}
.composer input{font-size:17px}
.send{font-size:17px}
.intake-title{font-size:20px;line-height:1.4}
.intake-intro{font-size:15px;line-height:1.65;color:#725d4b}
.intake-person{font-size:16px}
.intake-field{font-size:15px;line-height:1.5;color:#5c4535}
.intake-field input,.intake-field select{height:48px;min-height:48px;font-size:16px;padding:6px 8px}
.intake-date-parts input,.intake-date-parts select,
.intake-time-parts input,.intake-time-parts select{height:48px;min-height:48px;font-size:16px}
.intake-date-parts input::placeholder{font-size:14px}
.intake-check{font-size:15px;line-height:1.5;min-height:36px;color:#604b3c}
.intake-check input{width:20px;height:20px;flex:none}
.intake-action,.intake-sample{font-size:16px;min-height:48px}
.intake-privacy{font-size:13px;line-height:1.65;color:#745d4c}
.intake-summary{font-size:15px;line-height:1.65}
.intake-edit{font-size:15px;min-height:44px}
@media(max-width:355px){
  .avatar small{font-size:12px}
  .avatar strong{font-size:16px}
  .topic{font-size:15px}
  .topic small{font-size:12px}
  .intake-field input,.intake-field select{font-size:16px;padding:5px 6px}
  .intake-date-parts,.intake-time-parts{gap:5px}
  .intake-date-parts input::placeholder{font-size:12px}
}

/* Compact, readable, field-anchored selectors instead of oversized Android sheets. */
.saju-hidden-select{display:none!important}
.saju-select-wrap{display:block;width:100%;min-width:0}
.saju-select-trigger{
  display:flex;align-items:center;justify-content:space-between;gap:6px;
  width:100%;min-width:0;min-height:48px;padding:8px 11px;
  border:1px solid #d6c3ad;border-radius:10px;background:#fff;
  color:#49372c;text-align:left;font:inherit;font-size:16px;line-height:1.3;
  white-space:nowrap;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent
}
.saju-select-trigger::after{
  content:"";width:8px;height:8px;flex:none;margin-right:3px;
  border-right:1.7px solid #765338;border-bottom:1.7px solid #765338;
  transform:translateY(-2px) rotate(45deg)
}
.saju-select-trigger:focus-visible{outline:2px solid #947456;outline-offset:2px}
.saju-select-trigger:disabled{background:#f5f1eb;color:#8c8178;cursor:default}
.saju-select-popup{
  position:fixed;z-index:1500;box-sizing:border-box;
  overflow-y:auto;overscroll-behavior:contain;
  padding:5px;background:#fffdfa;
  border:1px solid #d7c3ac;border-radius:14px;
  box-shadow:0 10px 26px rgba(58,38,23,.20);
  -webkit-overflow-scrolling:touch
}
.saju-select-option{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  width:100%;min-height:48px;padding:9px 12px;
  border:0;border-radius:9px;background:transparent;
  color:#49372c;font-size:16px;font-weight:650;text-align:left;cursor:pointer
}
.saju-select-option[aria-selected="true"]{background:#f3e9dc;color:#69452a;font-weight:800}
.saju-select-option[aria-selected="true"]::after{content:"✓";font-size:18px;font-weight:900;color:#765338}
.saju-select-option:focus-visible{outline:2px solid #9b6e4d;outline-offset:-2px}
.saju-select-option:active{background:#ead8c5}
@media(max-width:355px){
 .saju-select-trigger{font-size:15px;padding:7px 8px;min-height:48px}
 .saju-select-option{font-size:16px}
}
</style>
<script src="/saju-avatars.js"></script>

<body>
<div class="page">
  <header class="top"><a class="home" href="/" aria-label="복작소 홈으로"><span class="arrow" aria-hidden="true">←</span> 복작소</a></header>
  <main class="selection-view" id="selectionView">
  <div class="hero"><h1>AI 사주채팅</h1><p class="lead">상담사와 분야를 선택해 주세요.</p></div>
  <section class="panel" aria-labelledby="advisorsTitle"><h2 id="advisorsTitle">상담사 선택</h2><div class="avatars" id="avatars"></div></section>
  <section class="panel" aria-labelledby="topicsTitle"><h2 id="topicsTitle">상담 분야</h2><div class="topics" id="topics"></div></section>
  <button id="startChat" type="button" class="start-chat">아라와 채팅 시작하기 →</button>
  </main>
  <div id="chatView" class="chat-view" hidden>
  <section class="panel chat-panel chat-full" aria-labelledby="chatTitle">
    <div class="chat-heading"><button type="button" class="back-to-select" id="backToSelect" aria-label="상담사 다시 선택">‹</button><span id="chatPortrait"></span><div class="chat-info"><h2 id="chatTitle">아라 · 사주</h2><small id="chatSpecialty">따뜻한 상담 · 체험판</small></div><button type="button" id="clearChat" class="clear">지우기</button></div>
    <p class="disclaimer">체험판 · 생년월일은 가상 정보로 시험해 줘. 실제 AI와 만세력은 아직 연결되지 않았어.</p>
    <div class="messages" id="messages" role="log" aria-label="체험 상담 대화" aria-live="polite"></div>
    <form class="composer" id="composer"><div class="composer-inner"><input id="question" type="text" autocomplete="off" maxlength="350" placeholder="메시지 입력" enterkeyhint="send" aria-label="상담 질문 입력"><button class="send" id="send" type="submit">전송</button></div></form>
    <p class="tips" id="chatTip">체험 대화는 이 브라우저 탭에만 임시 보관돼. 실제 AI와 연결되기 전에는 개인정보 입력을 삼가줘.</p>
  </section>
  </div>
  <footer>복작소 사주채팅 미리보기 · 실제 상담 및 명식 해석 기능은 개발 중이야.</footer>
</div>
<script>
(() => {

function makeEl(tag,cls,txt){const node=document.createElement(tag);if(cls)node.className=cls;if(txt!==undefined)node.textContent=txt;return node;}
// Replace OS-wide select sheets with a small in-page menu beside the field.
// Native select values still drive the existing birth-date and calendar logic.
let closeSajuPopup=null;
function upgradeSajuSelect(select){
  const field=select.closest(".intake-field");
  const label=select.getAttribute("aria-label")||field?.querySelector("span")?.textContent||"선택";
  const wrap=document.createElement("span");wrap.className="saju-select-wrap";
  const trigger=document.createElement("button");
  trigger.type="button";trigger.className="saju-select-trigger";
  trigger.setAttribute("aria-label",label);
  trigger.setAttribute("aria-haspopup","listbox");
  trigger.setAttribute("aria-expanded","false");
  wrap.append(trigger);
  select.after(wrap);
  // Required month/day are validated by the intake form, not by hidden controls.
  select.required=false;
  select.classList.add("saju-hidden-select");
  select.tabIndex=-1;
  select.setAttribute("aria-hidden","true");
  function sync(){
    const opt=select.options[select.selectedIndex];
    trigger.textContent=opt?.textContent||"선택";
    trigger.disabled=select.disabled;
    if(trigger.disabled && trigger.getAttribute("aria-expanded")==="true")closeSajuPopup?.();
  }
  select.addEventListener("change",sync);
  select._syncSaju=sync;
  sync();
  trigger.addEventListener("click",()=>{
    if(select.disabled)return;
    if(closeSajuPopup){const existing=closeSajuPopup;existing();if(existing._trigger===trigger)return}
    const popup=document.createElement("div");
    popup.className="saju-select-popup";
    popup.setAttribute("role","listbox");
    popup.setAttribute("aria-label",label);
    let selectedButton=null;
    for(const opt of Array.from(select.options)){
      if(opt.disabled||opt.value==="")continue;
      const item=document.createElement("button");
      item.type="button";item.className="saju-select-option";
      item.setAttribute("role","option");
      const isSelected=opt.value===select.value;
      item.setAttribute("aria-selected",String(isSelected));
      item.textContent=opt.textContent;
      if(isSelected)selectedButton=item;
      item.addEventListener("click",()=>{
        select.value=opt.value;
        select.dispatchEvent(new Event("change",{bubbles:true}));
        closeSajuPopup?.();trigger.focus({preventScroll:true});
      });
      popup.append(item);
    }
    if(!popup.childElementCount)return;
    document.body.append(popup);
    trigger.setAttribute("aria-expanded","true");
    let closed=false;
    function reposition(){
      if(closed)return;
      const rect=trigger.getBoundingClientRect(),vw=window.innerWidth,vh=window.innerHeight;
      const width=Math.min(Math.max(rect.width,120),220,vw-24);
      popup.style.width=width+"px";
      const maxHeight=Math.min(276,Math.max(150,vh-32));
      popup.style.maxHeight=maxHeight+"px";
      const actualHeight=Math.min(popup.scrollHeight,maxHeight);
      const roomBelow=vh-rect.bottom-12,roomAbove=rect.top-12;
      const above=roomBelow<actualHeight && roomAbove>roomBelow;
      const left=Math.max(12,Math.min(rect.left,vw-width-12));
      const top=above?Math.max(12,rect.top-actualHeight-6):Math.min(vh-actualHeight-12,rect.bottom+6);
      popup.style.left=Math.round(left)+"px";
      popup.style.top=Math.round(Math.max(12,top))+"px";
    }
    function close(){
      if(closed)return;
      closed=true;popup.remove();trigger.setAttribute("aria-expanded","false");
      document.removeEventListener("pointerdown",outside,true);
      document.removeEventListener("keydown",onKey,true);
      window.removeEventListener("resize",reposition);
      window.removeEventListener("scroll",onScroll,true);
      if(closeSajuPopup===close)closeSajuPopup=null;
    }
    close._trigger=trigger;
    closeSajuPopup=close;
    function outside(event){if(!popup.contains(event.target)&&!trigger.contains(event.target))close()}
    function onScroll(event){if(event.target===popup||popup.contains(event.target))return;close()}
    function onKey(event){
      if(event.key==="Escape"){event.preventDefault();close();trigger.focus({preventScroll:true});return}
      if(!popup.contains(document.activeElement))return;
      const options=Array.from(popup.querySelectorAll(".saju-select-option"));
      const index=options.indexOf(document.activeElement);
      if(event.key==="ArrowDown"||event.key==="ArrowUp"){
        event.preventDefault();
        options[(index+(event.key==="ArrowDown"?1:-1)+options.length)%options.length].focus({preventScroll:true});
      }else if(event.key==="Home"||event.key==="End"){
        event.preventDefault();options[event.key==="Home"?0:options.length-1].focus({preventScroll:true});
      }
    }
    document.addEventListener("pointerdown",outside,true);
    document.addEventListener("keydown",onKey,true);
    window.addEventListener("resize",reposition);
    window.addEventListener("scroll",onScroll,true);
    reposition();
    if(selectedButton){
      // Scroll inside the menu only. Do not move the chat/feed itself.
      popup.scrollTop=Math.max(0,selectedButton.offsetTop-Math.floor(popup.clientHeight/3));
      selectedButton.focus({preventScroll:true});
    }else popup.firstElementChild?.focus({preventScroll:true});
  });
}

 const actions=makeEl("div","intake-actions");const sample=makeEl("button","intake-sample","예시 입력");sample.type="button";

 const submit=makeEl("button","intake-action","입력 확인");submit.type="submit";submit.disabled=true;actions.append(sample,submit);form.append(actions);
 // Keep incomplete or invalid birth information from enabling confirmation.
 function canSubmitIntake(){
   const today=new Intl.DateTimeFormat("sv-SE",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
   return sets.every(p=>{
     const yearText=p.year.value.trim(),y=Number(yearText),m=Number(p.month.value),d=Number(p.day.value);
     if(!/^[0-9]{4}$/.test(yearText)||y<1900||y>Number(today.slice(0,4)))return false;
     if(!p.month.value||!p.day.value||m<1||m>12||d<1||d>new Date(y,m,0).getDate())return false;
     if(yearText+"-"+p.month.value+"-"+p.day.value>today)return false;
     if(p.unknown.checked)return true;
     const h=p.hour.value.trim(),min=p.minute.value.trim();
     return /^[0-9]{1,2}$/.test(h)&&Number(h)>=1&&Number(h)<=12&&
       /^[0-9]{1,2}$/.test(min)&&Number(min)>=0&&Number(min)<=59;
   });
 }
 function syncSubmitState(){submit.disabled=!canSubmitIntake();}
 form.addEventListener("input",syncSubmitState);

 form.addEventListener("submit",ev=>{
   ev.preventDefault();

   const today=new Intl.DateTimeFormat("sv-SE",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
   for(const p of sets){
     p.year.setCustomValidity("");p.day.setCustomValidity("");
     const yearText=p.year.value.trim(),y=Number(yearText),m=Number(p.month.value),d=Number(p.day.value);
     if(yearText&&!/^[0-9]{4}$/.test(yearText)||yearText&&y<1900||yearText&&y>Number(today.slice(0,4))){
       p.year.setCustomValidity("출생 연도는 1900년부터 올해까지 숫자 4자리로 입력해 주세요.");
     }else if(yearText&&(!p.month.value||!p.day.value)){
       p.year.setCustomValidity("출생 월과 일을 모두 선택해 주세요.");
     }else if(yearText&&p.month.value&&p.day.value){
       const lastDay=new Date(y,m,0).getDate();

       if(d>lastDay||iso>today){

     }

function renderAll(){renderAdvisors();renderTopics();$("chatTitle").textContent=selected.name+" · "+topic[2];$("chatSpecialty").textContent=selected.specialty+" · 체험판";$("chatPortrait").replaceChildren(portrait(selected.id,selected.name,"header-portrait"));$("startChat").textContent=selected.name+"와 채팅 시작하기 →";renderMessages();save();}
function syncChatView(){const open=location.hash==="#chat";document.body.classList.toggle("chat-active",open);$("selectionView").hidden=open;document.querySelector(".top").hidden=open;$("chatView").hidden=!open;if(open){renderMessages(false)}else{$("question").blur();}}
function openChat(){if(location.hash!=="#chat")location.hash="chat";syncChatView();}
function closeChat(){if(location.hash==="#chat")history.replaceState(null,"",location.pathname+location.search);syncChatView();}
function response(){return selected.name+" 상담방에 질문이 입력됐어.\n\n지금은 "+topic[2]+" 분야의 대화 화면을 미리 보는 체험판이야. 실제 상담사의 AI 답변과 만세력 분석을 연결하면 이 자리에서 질문에 맞춘 풀이를 이어갈 수 있어.";}
function send(){if(sentBusy)return;const input=$("question");const content=input.value.trim();if(!content)return;sentBusy=true;conversation.push(msg("user",content));input.value="";renderMessages();conversation.push(msg("bot",response()));save();renderMessages();sentBusy=false;}
const form=$("composer"),input=$("question"),sendBtn=$("send");
$("startChat").addEventListener("click",openChat);
$("backToSelect").addEventListener("click",closeChat);
window.addEventListener("hashchange",syncChatView);
form.addEventListener("submit",e=>{e.preventDefault();send()});
// Keep focus when tapping Send with the on-screen IME, including Samsung browsers.
sendBtn.addEventListener("pointerdown",e=>{if(e.pointerType!=="mouse"&&e.isPrimary&&document.activeElement===input)e.preventDefault()});
sendBtn.addEventListener("pointerup",e=>{if(e.pointerType==="mouse"||!e.isPrimary)return;const r=sendBtn.getBoundingClientRect();if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){form.requestSubmit(sendBtn);input.focus({preventScroll:true})}});
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.isComposing||e.keyCode===229))e.preventDefault()});
$("clearChat").addEventListener("click",()=>{if(!confirm(selected.name+" · "+topic[2]+" 체험 대화를 지울까?"))return;delete birthProfiles[birthKey()];birthEditing.delete(birthKey());conversation=[greeting()];save();renderMessages(false)});
renderAll();
syncChatView();
})();
</script>
</body>
</html>
