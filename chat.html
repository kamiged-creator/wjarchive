<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>관계자 채팅 | 복작소</title>
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#fbf8f4">
  <style>
    :root{
      --bg:#f6f1ea;--paper:#fffdf9;--text:#1f1a17;--muted:#746a61;
      --line:rgba(31,26,23,.12);--accent:#8b6847;--soft:#eadfd2;--shadow:0 24px 60px rgba(31,26,23,.12);
      --notice:#fff8ec;--notice-text:#7f674f;--msg-bg:#fff;--mine-bg:#2a2521;--field-bg:#fff;--primary:#a67c52;
      --composer-bg:#fff8ef;--composer-input:#fffefa;--composer-line:rgba(139,104,71,.19);
      --chat-meta:#60564d;--bubble-border:#d0c2b4;--admin-bubble:#efddca;--admin-border:#c8a888;--admin-ink:#30251d;
      --scroll-thumb:#b6a28f;--scroll-track:#eee7df;
    }
    body.dark{
      --bg:#111111;--paper:#171717;--text:#f2f2f2;--muted:#a9a9a9;
      --line:rgba(255,255,255,.10);--accent:#b68456;--soft:#222222;--shadow:0 24px 60px rgba(0,0,0,.42);
      --notice:#1d1d1d;--notice-text:#d0d0d0;--msg-bg:#242424;--mine-bg:#9f7148;--field-bg:#1f1f1f;--primary:#b68456;
      --composer-bg:#1a1a1a;--composer-input:#242424;--composer-line:rgba(255,255,255,.16);
      --chat-meta:#c8bbae;--bubble-border:#66605a;--admin-bubble:#48382b;--admin-border:#977653;--admin-ink:#fff1e2;
      --scroll-thumb:#79624e;--scroll-track:#262320;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;color:var(--text);background:linear-gradient(180deg,var(--paper),var(--bg));transition:background .2s ease,color .2s ease}
    button,input,textarea{font:inherit}
    button{cursor:pointer}
    .page{min-height:100vh;display:flex;flex-direction:column}
    header{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(12px);position:sticky;top:0;z-index:5}
    .brand{font-weight:850;letter-spacing:-.03em;cursor:pointer}.sub{font-size:12px;color:var(--muted);margin-top:2px}
    .back{border:0;background:transparent;color:var(--muted);font-weight:700}
    main{width:min(720px,100%);margin:0 auto;padding:24px 14px 28px;flex:1}
    .card{background:color-mix(in srgb,var(--paper) 96%,transparent);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);overflow:hidden}
    .join{padding:28px 22px}
    .eyebrow{font-size:11px;font-weight:850;letter-spacing:.16em;color:var(--accent)}
    h1{font-size:30px;margin:8px 0 8px;letter-spacing:-.04em;font-weight:800}
    .lead{margin:0 0 22px;color:var(--muted);font-size:14px;line-height:1.7}
    .field{margin-top:13px}
    .field label{display:block;font-size:12px;font-weight:800;margin:0 0 7px}
    .field input{width:100%;height:48px;border:1px solid var(--line);border-radius:14px;background:var(--field-bg);color:var(--text);padding:0 14px;outline:none}
    .field input:focus{border-color:rgba(139,104,71,.55);box-shadow:0 0 0 3px rgba(139,104,71,.09)}
    .primary{width:100%;height:50px;margin-top:18px;border:0;border-radius:14px;background:var(--primary);color:#fff;font-weight:750;box-shadow:0 8px 18px rgba(139,104,71,.14);transition:background .18s ease,transform .12s ease}
    .primary:hover{background:color-mix(in srgb,var(--primary) 90%,#000)}
    .primary:active{transform:translateY(1px)}
    .help{margin-top:12px;text-align:center;color:var(--muted);font-size:12px}
    .admin-room-list{display:none;margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
    .admin-room-list.show{display:block}
    .admin-room-list h2{font-size:15px;margin:0 0 8px}
    .admin-room-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 0;border-top:1px solid var(--line)}
    .admin-room-item:first-of-type{border-top:0}
    .admin-room-item.remembered,.public-room-item.remembered{background:color-mix(in srgb,var(--paper) 91%,#92bd9e);border-radius:12px;padding-left:10px;padding-right:10px}
    .entered-badge{display:inline-flex;align-items:center;vertical-align:middle;gap:4px;border:1px solid color-mix(in srgb,#388555 45%,var(--line));border-radius:999px;background:color-mix(in srgb,var(--paper) 83%,#a2caaa);color:var(--text);font-size:11px;font-weight:850;line-height:1.3;white-space:nowrap;padding:3px 7px;margin-left:5px}
    .room-title-line{display:flex;align-items:center;gap:8px;min-width:0}
    .room-title-line .room-title{min-width:0}
    .room-presence{display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;background:color-mix(in srgb,var(--paper) 82%,#99cda9);border:1px solid color-mix(in srgb,#388555 40%,var(--line));border-radius:999px;padding:4px 9px;font-size:11px;font-weight:850;white-space:nowrap}
    .room-presence::before{content:'';width:7px;height:7px;flex:0 0 7px;border-radius:50%;background:#28864e}
    .admin-room-name{font-weight:850;font-size:16px;line-height:1.4}
    .admin-room-meta{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.4}
    .admin-room-enter{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;min-width:104px;min-height:52px;border:2px solid #795738;border-radius:15px;background:#795738;color:#fff;padding:10px 16px;font-size:17px;line-height:1.2;font-weight:850;box-shadow:0 5px 13px rgba(93,64,42,.16);cursor:pointer}
    .admin-room-enter:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
    .admin-room-enter:disabled{background:var(--soft);border-color:var(--line);color:var(--muted);box-shadow:none;cursor:default}
    .admin-empty{padding:14px 0;color:var(--muted);font-size:12px;text-align:center}
    .public-room-list{margin:18px 0 18px;border:2px solid var(--line);border-radius:20px;padding:16px;background:color-mix(in srgb,var(--paper) 94%,var(--primary) 6%);box-shadow:0 8px 24px rgba(0,0,0,.04)}
    .public-room-list h2{font-size:16px;margin:0 0 10px;font-weight:800;letter-spacing:-.03em}
    .public-room-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
    .public-room-item:first-of-type{border-top:0}
    .public-room-name{font-size:15px;font-weight:750;letter-spacing:-.02em}
    .public-room-code{font-size:12px;color:var(--muted);margin-top:4px}
    .public-room-enter{min-width:72px;border:2px solid var(--primary);border-radius:999px;background:var(--paper);color:var(--primary);padding:10px 14px;font-size:13px;font-weight:750;white-space:nowrap}
    .public-room-enter.selected{background:var(--primary);color:#fff}
    .room-pagination{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:14px;flex-wrap:wrap}
    .room-page-btn{min-width:34px;height:34px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--text);font-size:12px;font-weight:750;padding:0 10px}
    .room-page-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}
    .room-page-btn:disabled{opacity:.38;cursor:default}
    .join-selected{margin:0 0 14px;padding:11px 13px;border-radius:14px;background:color-mix(in srgb,var(--primary) 10%,var(--paper));font-size:12px;font-weight:800;color:var(--text);display:none}
    .entry-modal{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(25,20,16,.48);backdrop-filter:blur(3px)}
    .entry-modal.show{display:flex}
    .entry-dialog{width:min(420px,100%);background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.22)}
    .entry-title{font-size:22px;font-weight:800;letter-spacing:-.04em;margin:0 0 6px}
    .entry-room{margin:0 0 18px;padding:13px 14px;border:2px solid color-mix(in srgb,var(--primary) 55%,var(--line));border-radius:15px;background:color-mix(in srgb,var(--primary) 10%,var(--paper));font-size:16px;font-weight:750}
    .entry-field{margin-top:13px}
    .entry-field label{display:block;font-size:13px;font-weight:700;margin:0 0 7px}
    .entry-field input{width:100%;height:54px;border:2px solid color-mix(in srgb,var(--text) 20%,var(--line));border-radius:15px;background:#fff;color:#1f1a17;padding:0 15px;font-size:16px;font-weight:500;outline:none}
    body.dark .entry-field input{background:#202020;color:#f2f2f2}
    .entry-field input:focus{border-color:var(--primary);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 14%,transparent)}
    .entry-actions{display:flex;gap:9px;margin-top:18px}
    .entry-cancel,.entry-submit{height:50px;border-radius:14px;font-weight:750}
    .entry-cancel{width:34%;border:1px solid var(--line);background:var(--paper);color:var(--muted)}
    .entry-submit{flex:1;border:0;background:var(--primary);color:#fff}
    .entry-status{min-height:18px;margin-top:10px;font-size:12px;color:#a33}
    .status{min-height:18px;margin-top:10px;font-size:12px;color:#a33}
    .chat{display:none;height:min(720px,calc(100vh - 120px));min-height:520px;flex-direction:column}
    .chat.show{display:flex}
    .chat-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
    .room-title{font-weight:850}.room-meta{font-size:12px;color:var(--muted);margin-top:2px}
    .head-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
    .leave,.invite,.delete-room{border:1px solid var(--line);border-radius:999px;font-size:12px;font-weight:800;line-height:1;white-space:nowrap}
    .invite{padding:9px 13px;color:#fff;background:var(--accent);border-color:var(--accent);box-shadow:0 7px 16px rgba(139,104,71,.16)}
    .leave{padding:8px 10px;background:var(--paper);color:var(--muted)}
    .theme-toggle{width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:50%;padding:0;background:var(--paper);color:var(--muted);font-size:18px;font-weight:700;line-height:1;white-space:nowrap}
    .admin-room-add{display:none;border:1px solid var(--line);border-radius:999px;padding:9px 12px;background:var(--paper);color:var(--text);font-size:12px;font-weight:800;white-space:nowrap}
    .admin-room-add.show{display:inline-flex;align-items:center;gap:4px}
    .delete-room{display:none;padding:7px 9px;color:#b33d3d;background:transparent;border-color:rgba(179,61,61,.2);font-size:11px}
    .delete-room.show{display:inline-flex}
    .messages{flex:1;overflow:auto;padding:18px;background:linear-gradient(180deg,color-mix(in srgb,var(--soft) 72%,transparent),color-mix(in srgb,var(--paper) 92%,transparent));scroll-behavior:auto;scroll-padding-top:14px}
    /* Replace the bright Windows scrollbars with slim, theme-matched scroll indicators. */
    .messages,.text-modal-body{scrollbar-width:thin;scrollbar-color:var(--scroll-thumb) var(--scroll-track)}
    .messages::-webkit-scrollbar,.text-modal-body::-webkit-scrollbar{width:7px}
    .messages::-webkit-scrollbar-track,.text-modal-body::-webkit-scrollbar-track{background:var(--scroll-track)}
    .messages::-webkit-scrollbar-thumb,.text-modal-body::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:10px;border:1px solid var(--scroll-track)}
    /* Keep text input scrolling functional, but hide distracting default arrows. */
    .composer textarea{scrollbar-width:none;-ms-overflow-style:none}
    .composer textarea::-webkit-scrollbar{display:none}
    .empty{text-align:center;color:var(--muted);font-size:13px;padding:40px 16px}
    .msg{display:flex;flex-direction:column;align-items:flex-start;margin:0 0 14px}
    .msg.mine{align-items:flex-end}
    .name{font-size:12px;color:var(--chat-meta);font-weight:650;margin:0 6px 5px}
    .bubble{max-width:78%;padding:10px 13px;border-radius:16px 16px 16px 4px;background:var(--msg-bg);border:1px solid var(--bubble-border);box-shadow:0 8px 18px rgba(31,26,23,.05);white-space:pre-wrap;word-break:break-word;font-size:15px;line-height:1.55}
    .mine .bubble{background:var(--mine-bg);color:#fff;border-color:var(--mine-bg);border-radius:16px 16px 4px 16px}
    .msg.admin .bubble{background:var(--admin-bubble);color:var(--admin-ink);border-color:var(--admin-border)}
    .msg.admin .name{font-weight:750;color:var(--chat-meta)}
    .message-text{white-space:pre-wrap;overflow-wrap:anywhere}
    .bubble.is-truncated{cursor:pointer}
    .bubble.is-truncated .message-text{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;line-clamp:4;overflow:hidden}
    .read-more{display:none}
    .bubble.is-truncated .read-more{display:block;margin-top:5px;text-align:right;font-size:13px;font-weight:800;color:inherit;opacity:.88;text-decoration:underline;text-underline-offset:3px}
    .bubble.is-truncated:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
    .time{font-size:11px;color:var(--chat-meta);margin:5px 6px 0}
    .composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--composer-line);background:var(--composer-bg);align-items:flex-end}
    .composer textarea{flex:1;resize:none;max-height:112px;min-height:46px;border:1px solid var(--composer-line);border-radius:14px;padding:11px 12px;outline:none;background:var(--composer-input);color:var(--text)}
    .composer textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 10%,transparent)}
    .photo{width:46px;height:46px;flex:0 0 46px;border:1px solid var(--composer-line);border-radius:14px;background:var(--composer-input);color:var(--accent);font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:center}
    .photo:disabled,.send:disabled{opacity:.55;cursor:wait}
    .send{width:72px;height:46px;border:0;border-radius:14px;background:var(--accent);color:#fff;font-weight:850}
    .image-bubble{max-width:78%;padding:4px;border-radius:16px 16px 16px 4px;background:var(--composer-input);border:1px solid var(--composer-line);box-shadow:0 8px 18px rgba(31,26,23,.05);overflow:hidden}
    .mine .image-bubble{border-radius:16px 16px 4px 16px}
    .chat-image{display:block;max-width:min(220px,65vw);max-height:240px;width:auto;height:auto;object-fit:contain;border-radius:12px;cursor:zoom-in}
    .chat-image:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
    .image-modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(20,17,15,.88)}
    .image-modal.show{display:flex}
    .image-modal img{max-width:96vw;max-height:90vh;object-fit:contain;border-radius:14px}
    .image-close{position:absolute;top:16px;right:16px;width:42px;height:42px;border:0;border-radius:50%;background:rgba(255,255,255,.9);font-size:24px;line-height:1}
    .text-modal{position:fixed;inset:0;z-index:125;display:none;flex-direction:column;background:var(--paper);color:var(--text)}
    .text-modal.show{display:flex}
    .text-modal-head{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:max(14px,env(safe-area-inset-top)) 18px 12px;border-bottom:1px solid var(--line);background:var(--composer-bg)}
    .text-modal-title{font-weight:850;font-size:19px}
    .text-modal-close{min-width:76px;min-height:46px;border:1px solid var(--bubble-border);border-radius:13px;background:var(--paper);color:var(--text);font-size:17px;font-weight:800}
    .text-modal-meta{flex:0 0 auto;padding:16px 20px 8px;color:var(--chat-meta);font-size:14px;font-weight:650}
    .text-modal-body{flex:1;min-height:0;overflow-y:auto;padding:8px 20px max(28px,env(safe-area-inset-bottom));font-size:19px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere;overscroll-behavior:contain}
    .text-modal-close:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
    .notice{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;background:var(--notice);border-bottom:1px solid var(--line);font-size:11px;color:var(--notice-text)}
    .notice-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-left:auto}
    .notice-actions .sound-toggle{order:1}
    .notice-actions .sound-volume{order:2}
    .notice-actions .push-toggle{order:3}
    .push-toggle{flex:0 0 auto;min-height:40px;padding:8px 12px;border:1.5px solid var(--admin-border);border-radius:11px;background:var(--composer-input);color:var(--admin-ink);font-size:12px;font-weight:850;cursor:pointer}
    .push-toggle[aria-pressed="true"]{background:var(--admin-bubble);color:var(--admin-ink)}
    .push-toggle:disabled{opacity:.6;cursor:wait}
    .push-toggle:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
    .notice-copy{min-width:0;line-height:1.5}
    .sound-toggle{flex:0 0 auto;min-height:38px;padding:6px 11px;border:1.5px solid var(--composer-line);border-radius:11px;background:var(--paper);color:var(--text);font-size:12px;font-weight:800;white-space:nowrap;cursor:pointer}
    .sound-toggle[aria-pressed="true"]{background:var(--admin-bubble);border-color:var(--admin-border);color:var(--admin-ink)}
    .sound-toggle:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
    .sound-volume{display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;font-size:12px;font-weight:800;color:var(--text)}
    .sound-volume select{min-height:40px;max-width:112px;padding:0 8px;border:1.5px solid var(--admin-border);border-radius:11px;background:var(--paper);color:var(--text);font-size:13px;font-weight:800;cursor:pointer}
    .sound-volume select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
    @media(max-width:560px){
      html,body{height:100%;overscroll-behavior:none}
      body.chat-active{height:var(--app-height,100dvh);overflow:hidden}
      .page{height:var(--app-height,100dvh);min-height:var(--app-height,100dvh);overflow:hidden}
      header{height:54px;flex:0 0 54px}.sub{display:none}
      main{width:100%;padding:6px 8px max(8px,env(safe-area-inset-bottom));margin:0;flex:1;min-height:0;overflow:hidden;display:flex}
      .card{border-radius:20px}
      .join{padding:24px 18px;width:100%}
      .chat{width:100%;height:100%;max-height:none;min-height:0;overflow:hidden}
      .chat-head{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;padding:9px 12px}
      .chat-head>div:first-child{min-width:0}
      .room-title{font-size:15px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .room-meta{font-size:11px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .head-actions{gap:6px;max-width:160px;flex-wrap:wrap;justify-content:flex-end}
      .invite{min-height:40px;padding:0 12px;font-size:12px}
      .leave{min-height:40px;padding:0 12px;font-size:12px}
      .delete-room{min-height:32px;padding:0 9px;font-size:10px}
      /* On small screens admins delete rooms from the dedicated management page. */
      .admin-mode .chat-head{min-height:62px}
      .admin-mode .head-actions{max-width:none;flex-wrap:nowrap;gap:6px}
      .admin-mode .chat-head .delete-room.show{display:none}
      .admin-mode .invite,.admin-mode .leave{min-height:40px;padding:0 10px;font-size:12px}
      /* Keep the push permission action prominent, while separating in-chat sound settings. */
      .notice{display:block;padding:9px 12px 11px}
      .notice-copy{display:block;font-size:11px;line-height:1.5;margin-bottom:9px}
      .notice-actions{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-left:0;width:100%}
      .notice-actions .push-toggle{order:0;grid-column:1/-1;grid-row:1;min-width:0;width:100%;min-height:44px;font-size:14px;border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--paper));color:var(--text)}
      .notice-actions .push-toggle[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
      .notice-actions .sound-toggle{order:0;grid-column:1;grid-row:2;min-width:0;width:100%;min-height:44px;font-size:13px;white-space:nowrap}
      .notice-actions .sound-volume{order:0;grid-column:2;grid-row:2;display:flex;align-items:center;justify-content:flex-end;gap:6px;min-width:0;font-size:13px;white-space:nowrap}
      .notice-actions .sound-volume select{flex:1;min-width:0;max-width:114px;min-height:44px;font-size:13px}
      .messages{padding:14px 11px;min-height:0;overscroll-behavior:contain;scrollbar-width:none}.bubble{max-width:84%}
      .messages::-webkit-scrollbar{display:none}
      .chat-image{max-width:min(190px,52vw);max-height:200px}
      .composer{position:sticky;bottom:0;z-index:4;flex:0 0 auto;padding:10px 10px max(10px,env(safe-area-inset-bottom));background:var(--composer-bg)}
    }
  </style>
</head>
<body>
<div class="page">
  <header>
    <div><div class="brand" id="brandHome" role="link" tabindex="0" aria-label="복작소 홈으로">복작소</div><div class="sub">채팅</div></div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="admin-room-add" id="adminRoomAddBtn" type="button" aria-label="채팅방 관리">채팅방 관리</button>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="다크모드 전환" title="다크모드 전환">☾</button>
      <button class="back" type="button" onclick="location.href='/'">홈으로</button>
    </div>
  </header>
  <main>
    <section class="card join" id="joinCard">
      <div class="eyebrow">PRIVATE LOUNGE</div>
      <h1>복작소 채팅방</h1>
      <p class="lead">입장할 채팅방을 먼저 선택해 주세요. 비밀번호와 닉네임은 아래에서 입력합니다.</p>
      <div class="public-room-list" id="publicRoomList">
        <h2>채팅방 목록</h2>
        <div id="publicRooms"><div class="admin-empty">불러오는 중...</div></div>
      </div>
      <div class="field" id="roomCodeField"><label for="roomCode">방 코드</label><input id="roomCode" autocomplete="off" placeholder="예: BOKJAKSO"></div>
      <div class="join-selected" id="selectedRoom"></div>
      <div id="joinCredentials" style="display:none">
        <div class="field"><label for="roomPassword">비밀번호</label><input id="roomPassword" type="password" autocomplete="current-password" placeholder="비밀번호 입력"></div>
        <div class="field"><label for="nickname">닉네임</label><input id="nickname" maxlength="20" autocomplete="nickname" placeholder="대화에 표시할 이름"></div>
        <button class="primary" id="joinBtn" type="button">선택한 방 입장</button>
        <div class="status" id="joinStatus"></div>
        <div class="help" id="joinHelp">방마다 비밀번호가 다를 수 있습니다.</div>
      </div>
      <div class="admin-room-list" id="adminRoomList">
        <h2>채팅방 목록</h2>
        <div id="adminRooms"><div class="admin-empty">불러오는 중...</div></div>
      </div>
    </section>

    <section class="card chat" id="chatCard" aria-live="polite">
      <div class="chat-head">
        <div>
          <div class="room-title-line"><div class="room-title" id="roomTitle">복작소 채팅방</div><span class="room-presence" aria-label="현재 채팅방에 입장 중">입장 중</span></div>
          <div class="room-meta"><span id="roomCodeText"></span> · 현재 접속 <span id="activeCount">1</span>명</div>
        </div>
        <div class="head-actions">
          <button class="invite" id="inviteBtn" type="button">초대하기</button>
          <button class="delete-room" id="deleteRoomBtn" type="button">방 삭제</button>
          <button class="leave" id="leaveBtn" type="button">나가기</button>
        </div>
      </div>
      <div class="notice"><span class="notice-copy">민감한 개인정보·비밀번호·금융정보는 채팅방에 올리지 않는 것을 권장합니다.</span><div class="notice-actions"><button class="push-toggle" id="pushToggle" type="button" aria-pressed="false" title="앱을 닫아도 새 메시지 알림 받기">📱 휴대폰 알림 받기</button><button class="sound-toggle" id="soundToggle" type="button" aria-pressed="false" title="채팅 중 알림 소리">🔕 소리 켜기</button><label class="sound-volume" for="soundVolumeSelect">음량 <select id="soundVolumeSelect" title="뽁짝 알림 소리 크기"><option value="30">작게</option><option value="60">보통</option><option value="100" selected>크게</option></select></label></div></div>
      <div class="messages" id="messages"><div class="empty" id="emptyState">아직 대화가 없습니다. 첫 메시지를 남겨보세요.</div></div>
      <div class="composer">
        <input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp" hidden>
        <button class="photo" id="photoBtn" type="button" aria-label="사진 올리기" title="사진 올리기">＋</button>
        <textarea id="messageInput" rows="1" maxlength="1000" placeholder="메시지 입력"></textarea>
        <button class="send" id="sendBtn" type="button">전송</button>
      </div>
    </section>
  </main>
</div>

<div class="entry-modal" id="entryModal" aria-hidden="true">
  <div class="entry-dialog" role="dialog" aria-modal="true" aria-labelledby="entryTitle">
    <div class="entry-title" id="entryTitle">처음 입장</div>
    <div class="entry-room" id="entryRoomName"></div>
    <div class="entry-field">
      <label for="entryPassword">비밀번호</label>
      <input id="entryPassword" type="password" autocomplete="current-password" placeholder="비밀번호 입력">
    </div>
    <div class="entry-field">
      <label for="entryNickname">닉네임</label>
      <input id="entryNickname" maxlength="20" autocomplete="nickname" placeholder="대화에 표시할 이름">
    </div>
    <div class="entry-actions">
      <button class="entry-cancel" id="entryCancel" type="button">취소</button>
      <button class="entry-submit" id="entrySubmit" type="button">입장하기</button>
    </div>
    <div class="entry-status" id="entryStatus"></div>
  </div>
</div>
<div class="image-modal" id="imageModal" aria-hidden="true">
  <button class="image-close" id="imageClose" type="button" aria-label="닫기">×</button>
  <img id="imageModalImg" alt="채팅 이미지 크게 보기">
</div>
<div class="text-modal" id="textModal" role="dialog" aria-modal="true" aria-labelledby="textModalTitle" aria-hidden="true">
  <div class="text-modal-head"><div class="text-modal-title" id="textModalTitle">전체 메시지</div><button class="text-modal-close" id="textModalClose" type="button">닫기</button></div>
  <div class="text-modal-meta" id="textModalMeta"></div>
  <div class="text-modal-body" id="textModalBody" tabindex="0"></div>
</div>
<script>
  function syncViewportHeight(){
    const h=window.visualViewport?.height||window.innerHeight;
    document.documentElement.style.setProperty('--app-height',Math.round(h)+'px');
  }
  syncViewportHeight();
  window.addEventListener('resize',syncViewportHeight,{passive:true});
  window.visualViewport?.addEventListener('resize',syncViewportHeight,{passive:true});
  window.visualViewport?.addEventListener('scroll',syncViewportHeight,{passive:true});

  const KEY='bokjaksoChatSessionV1';
  const SESSIONS_KEY='bokjaksoChatSessionsV2';
  const REMEMBER_MS=365*24*60*60*1000;
  const ADMIN_KEY='wjarchiveAdminAccessToken';
  const THEME_KEY='bokjaksoChatThemeV1';
  const SOUND_KEY='bokjaksoChatSoundV1';
  const SOUND_VOLUME_KEY='bokjaksoChatSoundVolumeV1';
  const els={
    joinCard:document.getElementById('joinCard'),chatCard:document.getElementById('chatCard'),
    roomCode:document.getElementById('roomCode'),roomPassword:document.getElementById('roomPassword'),
    nickname:document.getElementById('nickname'),joinBtn:document.getElementById('joinBtn'),joinStatus:document.getElementById('joinStatus'),
    roomTitle:document.getElementById('roomTitle'),roomCodeText:document.getElementById('roomCodeText'),activeCount:document.getElementById('activeCount'),
    messages:document.getElementById('messages'),emptyState:document.getElementById('emptyState'),
    messageInput:document.getElementById('messageInput'),sendBtn:document.getElementById('sendBtn'),leaveBtn:document.getElementById('leaveBtn'),inviteBtn:document.getElementById('inviteBtn'),deleteRoomBtn:document.getElementById('deleteRoomBtn'),
    photoInput:document.getElementById('photoInput'),photoBtn:document.getElementById('photoBtn'),
    imageModal:document.getElementById('imageModal'),imageModalImg:document.getElementById('imageModalImg'),imageClose:document.getElementById('imageClose'),
    textModal:document.getElementById('textModal'),textModalClose:document.getElementById('textModalClose'),textModalMeta:document.getElementById('textModalMeta'),textModalBody:document.getElementById('textModalBody'),
    themeToggle:document.getElementById('themeToggle'),soundToggle:document.getElementById('soundToggle'),soundVolumeSelect:document.getElementById('soundVolumeSelect'),pushToggle:document.getElementById('pushToggle'),
    adminRoomAddBtn:document.getElementById('adminRoomAddBtn'),
    adminRoomList:document.getElementById('adminRoomList'),
    adminRooms:document.getElementById('adminRooms'),
    joinHelp:document.getElementById('joinHelp'),
    publicRoomList:document.getElementById('publicRoomList'),
    publicRooms:document.getElementById('publicRooms'),
    roomCodeField:document.getElementById('roomCodeField'),
    selectedRoom:document.getElementById('selectedRoom'),
    joinCredentials:document.getElementById('joinCredentials'),
    entryModal:document.getElementById('entryModal'),
    entryRoomName:document.getElementById('entryRoomName'),
    entryPassword:document.getElementById('entryPassword'),
    entryNickname:document.getElementById('entryNickname'),
    entrySubmit:document.getElementById('entrySubmit'),
    entryCancel:document.getElementById('entryCancel'),
    entryStatus:document.getElementById('entryStatus')
  };
  let session=null,lastId=0,lastSyncAt='',pollTimer=null,busy=false;
  let soundEnabled=localStorage.getItem(SOUND_KEY)==='on';
  const savedSoundVolume=localStorage.getItem(SOUND_VOLUME_KEY);
  let personalSoundVolume=[30,60,100].includes(Number(savedSoundVolume))?Number(savedSoundVolume):null;
  let defaultSoundVolume=100;
  let lastSoundAt=0;
  function effectiveSoundVolume(){return personalSoundVolume??defaultSoundVolume}
  function displaySoundVolume(){els.soundVolumeSelect.value=String(effectiveSoundVolume())}
  async function loadSoundDefault(){
    try{
      const data=await api({action:'chat-sound-config'});
      const level=Number(data.level);
      if([30,60,100].includes(level))defaultSoundVolume=level;
    }catch(error){console.warn('기본 알림 음량 불러오기 실패',error)}
    displaySoundVolume();
  }
  function updateSoundToggle(){
    els.soundToggle.textContent=soundEnabled?'🔔 소리 켜짐':'🔕 소리 켜기';
    els.soundToggle.setAttribute('aria-pressed',String(soundEnabled));
    els.soundToggle.setAttribute('aria-label',soundEnabled?'복작 알림 소리 끄기':'복작 알림 소리 켜기');
    els.soundToggle.title=soundEnabled?'새 메시지 알림 소리 끄기':'새 메시지 알림 소리 켜기';
  }
  function playBokjakSound(preview=false){
    if(!soundEnabled||(!preview&&document.visibilityState==='hidden'))return;
    const now=Date.now();
    if(!preview&&now-lastSoundAt<2500)return;
    lastSoundAt=now;
    const volume=effectiveSoundVolume()/100;
    function fallbackChime(){
      try{
        const AudioCtx=window.AudioContext||window.webkitAudioContext;
        if(!AudioCtx)return;
        const context=new AudioCtx();
        if(context.state==='suspended')context.resume().catch(()=>{});
        const t=context.currentTime;
        [[0,640],[.14,860]].forEach(([offset,freq])=>{
          const oscillator=context.createOscillator(),gain=context.createGain();
          oscillator.type='sine';
          oscillator.frequency.value=freq;
          gain.gain.setValueAtTime(.0001,t+offset);
          gain.gain.exponentialRampToValueAtTime(.22*volume,t+offset+.015);
          gain.gain.exponentialRampToValueAtTime(.0001,t+offset+.13);
          oscillator.connect(gain);gain.connect(context.destination);
          oscillator.start(t+offset);oscillator.stop(t+offset+.14);
        });
        setTimeout(()=>context.close().catch(()=>{}),700);
      }catch(_){}
    }
    try{
      if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){
        fallbackChime();return;
      }
      const voice=new SpeechSynthesisUtterance('뽁짝');
      voice.lang='ko-KR';
      voice.rate=1.18;
      voice.pitch=1.2;
      voice.volume=volume;
      const koreanVoice=window.speechSynthesis.getVoices().find(v=>String(v.lang).toLowerCase().startsWith('ko'));
      if(koreanVoice)voice.voice=koreanVoice;
      voice.onerror=()=>fallbackChime();
      window.speechSynthesis.speak(voice);
    }catch(_){fallbackChime()}
  }
  updateSoundToggle();
  displaySoundVolume();
  function applyTheme(mode){
    const dark=mode==='dark';
    document.body.classList.toggle('dark',dark);
    els.themeToggle.textContent=dark?'☀':'☾';
    els.themeToggle.setAttribute('aria-label',dark?'밝은 모드로 전환':'다크모드로 전환');
    els.themeToggle.setAttribute('title',dark?'밝은 모드로 전환':'다크모드로 전환');
    localStorage.setItem(THEME_KEY,dark?'dark':'light');
  }

  function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
  function fmtTime(value){try{return new Intl.DateTimeFormat('ko-KR',{hour:'2-digit',minute:'2-digit'}).format(new Date(value))}catch(_){return ''}}
  async function api(payload){
    const r=await fetch('/api/store-inquiries',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const data=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(data.message||'요청에 실패했습니다.');
    return data;
  }
  let pushEnabled=false,pushBusy=false;
  function pushAvailable(){
    return window.isSecureContext && ('serviceWorker' in navigator) &&
      ('PushManager' in window) && ('Notification' in window);
  }
  function updatePushButton(){
    els.pushToggle.textContent=pushBusy?'처리 중…':(pushEnabled?'🔔 휴대폰 알림 켜짐':'📱 휴대폰 알림 받기');
    els.pushToggle.setAttribute('aria-pressed',String(pushEnabled));
    els.pushToggle.setAttribute('aria-label',pushEnabled?'휴대폰 푸시 알림 해제':'휴대폰 푸시 알림 받기');
    els.pushToggle.disabled=pushBusy;
  }
  function vapidKeyBytes(base64){
    const encoded=base64.replace(/-/g,'+').replace(/_/g,'/');
    const decoded=atob(encoded.padEnd(Math.ceil(encoded.length/4)*4,'='));
    return Uint8Array.from(decoded,char=>char.charCodeAt(0));
  }
  async function refreshPushState(){
    const memberId=session?.member?.id;
    pushEnabled=false;
    if(!memberId||!pushAvailable()){updatePushButton();return}
    try{
      const worker=await navigator.serviceWorker.getRegistration('/');
      const current=await worker?.pushManager.getSubscription();
      if(current && session?.member?.id===memberId){
        const response=await api({action:'chat-push-status',memberId,sessionToken:session.sessionToken,endpoint:current.endpoint});
        pushEnabled=Boolean(response.subscribed);
      }
    }catch(error){console.warn('알림 상태 확인 실패',error)}
    updatePushButton();
  }
  async function togglePhonePush(){
    if(!session||pushBusy)return;
    if(!pushAvailable()){
      alert('이 브라우저는 휴대폰 푸시 알림을 지원하지 않습니다. 안드로이드에서는 크롬으로 복작소를 열어주세요.');
      return;
    }
    if(/iPhone|iPad|iPod/i.test(navigator.userAgent)&&!navigator.standalone){
      alert('아이폰에서는 Safari의 공유 버튼을 눌러 홈 화면에 복작소를 추가한 뒤, 그 아이콘에서 열어 알림을 켜주세요.');
      return;
    }
    const memberId=session.member.id,sessionToken=session.sessionToken;
    // Request permission directly from the click gesture, before any network await.
    let permission=Notification.permission;
    if(!pushEnabled){
      if(permission==='denied'){
        alert('휴대폰 설정에서 이 사이트의 알림이 차단되어 있습니다. 브라우저 알림 설정에서 복작소를 허용해 주세요.');
        return;
      }
      if(permission!=='granted'){
        permission=await Notification.requestPermission();
        if(permission!=='granted'){
          alert('알림이 허용되지 않았습니다. 허용한 뒤 다시 시도해 주세요.');
          return;
        }
      }
    }
    pushBusy=true;updatePushButton();
    try{
      const registration=await navigator.serviceWorker.register('/bokjakso-push-sw.js',{scope:'/'});
      await navigator.serviceWorker.ready;
      let subscription=await registration.pushManager.getSubscription();
      if(pushEnabled){
        if(subscription){
          await api({action:'chat-push-unsubscribe',memberId,sessionToken,endpoint:subscription.endpoint});
        }
        pushEnabled=false;
        alert('이 채팅방의 휴대폰 알림을 해제했습니다.');
      }else{
        if(!subscription){
          const config=await api({action:'chat-push-config'});
          subscription=await registration.pushManager.subscribe({
            userVisibleOnly:true,applicationServerKey:vapidKeyBytes(config.publicKey)
          });
        }
        await api({action:'chat-push-subscribe',memberId,sessionToken,subscription:subscription.toJSON()});
        pushEnabled=true;
        alert('휴대폰 알림을 켰습니다. 복작소를 닫아도 새 메시지를 받도록 설정했어요.');
      }
    }catch(error){
      alert('휴대폰 알림 설정에 실패했습니다. '+(error.message||'브라우저 설정을 확인해 주세요.'));
    }finally{pushBusy=false;updatePushButton()}
  }
  updatePushButton();
  function getRememberedSessions(){
    let map={};
    try{
      map=JSON.parse(localStorage.getItem(SESSIONS_KEY)||'{}')||{};
      const now=Date.now();
      for(const [code,s] of Object.entries(map)){
        if(!s?.expiresAt||s.expiresAt<=now||!s?.member?.id||!s?.sessionToken||!s?.room?.id) delete map[code];
      }
      const legacy=JSON.parse(localStorage.getItem(KEY)||'null');
      if(legacy?.expiresAt>Date.now()&&legacy?.room?.code&&legacy?.member?.id&&legacy?.sessionToken){
        map[String(legacy.room.code).toUpperCase()]=legacy;
        localStorage.removeItem(KEY);
      }
      localStorage.setItem(SESSIONS_KEY,JSON.stringify(map));
    }catch(_){map={}}
    return map;
  }
  function rememberedFor(code){
    return getRememberedSessions()[String(code||'').toUpperCase()]||null;
  }
  function saveSession(){
    const saved={...session,expiresAt:Date.now()+REMEMBER_MS};
    const map=getRememberedSessions();
    map[String(session.room.code||'').toUpperCase()]=saved;
    localStorage.setItem(SESSIONS_KEY,JSON.stringify(map));
  }
  function forgetCurrentRoom(){
    if(session?.room?.code){
      const map=getRememberedSessions();
      delete map[String(session.room.code).toUpperCase()];
      localStorage.setItem(SESSIONS_KEY,JSON.stringify(map));
    }
  }
  function clearSession(removeRemembered=false){
    if(removeRemembered)forgetCurrentRoom();
    session=null;lastId=0;lastSyncAt='';
  }
  let followLatestAfterEntry=false;
  function scrollToNewest(){
    if(!els.chatCard.classList.contains('show'))return;
    els.messages.scrollTop=els.messages.scrollHeight;
  }
  const entryLayoutObserver=typeof ResizeObserver==='function'
    ? new ResizeObserver(()=>{if(followLatestAfterEntry)scrollToNewest()})
    : null;
  function stopEntryAutoScroll(){
    followLatestAfterEntry=false;
    entryLayoutObserver?.disconnect();
  }
  function showChat(){
    document.body.classList.add('chat-active');
    followLatestAfterEntry=true;
    entryLayoutObserver?.disconnect();
    clearInterval(pollTimer);pollTimer=null;
    lastId=0;lastSyncAt='';
    els.messages.innerHTML='<div class="empty" id="emptyState">아직 대화가 없습니다. 첫 메시지를 남겨보세요.</div>';
    els.joinCard.style.display='none';els.chatCard.classList.add('show');
    els.roomTitle.textContent=session.room.title||'복작소 채팅방';els.roomCodeText.textContent='#'+session.room.code;
    els.deleteRoomBtn.classList.toggle('show',Boolean(sessionStorage.getItem(ADMIN_KEY)));
    loadMessages(true);pollTimer=setInterval(()=>loadMessages(false),3000);
    refreshPushState();
  }
  function showJoin(preserveRemembered=false){
    stopEntryAutoScroll();
    document.body.classList.remove('chat-active');
    clearInterval(pollTimer);pollTimer=null;lastSyncAt='';els.chatCard.classList.remove('show');els.joinCard.style.display='block';
    if(preserveRemembered){
      session=null;lastId=0;
    }else{
      clearSession();
    }
  }
  let textModalReturnFocus=null;
  function openTextMessage(message,author,time,bubble){
    textModalReturnFocus=bubble;
    els.textModalMeta.textContent=author+' · '+fmtTime(time);
    els.textModalBody.textContent=message;
    els.textModalBody.scrollTop=0;
    els.textModal.classList.add('show');
    els.textModal.setAttribute('aria-hidden','false');
    els.textModalClose.focus();
  }
  function closeTextMessage(){
    els.textModal.classList.remove('show');
    els.textModal.setAttribute('aria-hidden','true');
    els.textModalBody.textContent='';
    if(textModalReturnFocus?.isConnected)textModalReturnFocus.focus();
    textModalReturnFocus=null;
  }
  function updateLongMessage(bubble){
    if(!bubble)return;
    const preview=bubble.querySelector('.message-text');
    if(!preview)return;
    bubble.classList.remove('is-truncated');
    const lineHeight=parseFloat(getComputedStyle(preview).lineHeight)||23.25;
    const long=preview.scrollHeight>lineHeight*4+3;
    bubble.classList.toggle('is-truncated',long);
    if(long){
      bubble.setAttribute('role','button');
      bubble.setAttribute('tabindex','0');
      bubble.setAttribute('aria-haspopup','dialog');
      bubble.setAttribute('aria-label','긴 메시지 전체보기');
    }else{
      bubble.removeAttribute('role');
      bubble.removeAttribute('tabindex');
      bubble.removeAttribute('aria-haspopup');
      bubble.removeAttribute('aria-label');
    }
  }
  window.addEventListener('resize',()=>{
    document.querySelectorAll('#messages .bubble').forEach(updateLongMessage);
  },{passive:true});
  function appendMessages(items){
    if(!Array.isArray(items)||!items.length)return;
    const empty=document.getElementById('emptyState');if(empty)empty.remove();
    const nearBottom=els.messages.scrollHeight-els.messages.scrollTop-els.messages.clientHeight<90;
    for(const m of items){
      if(document.getElementById('msg-'+m.id))continue;
      lastId=Math.max(lastId,Number(m.id)||0);
      const mine=session&&m.member_id===session.member.id;
      const isAdminMessage=String(m.nickname||'').trim()==='관리자';
      const wrap=document.createElement('div');wrap.className='msg'+(mine?' mine':'')+(isAdminMessage?' admin':'');wrap.id='msg-'+m.id;
      if(m.message_type==='image'&&m.image_url){

  function attachLongPressDelete(target,messageId,onLongPress){
    if(!target)return;
    let timer=null,startX=0,startY=0,longPressed=false;
    const clear=()=>{
      if(timer){clearTimeout(timer);timer=null}
      target.classList.remove('pressing');
    };
    target.addEventListener('pointerdown',e=>{
      if(e.pointerType==='mouse'&&e.button!==0)return;
      startX=e.clientX;startY=e.clientY;longPressed=false;
      timer=setTimeout(async()=>{
        timer=null;longPressed=true;target.classList.add('pressing');
        if(navigator.vibrate)navigator.vibrate(35);
        onLongPress?.();
        await deleteMyMessage(messageId);
        clear();
      },650);
    });
    target.addEventListener('pointermove',e=>{
      if(Math.abs(e.clientX-startX)>10||Math.abs(e.clientY-startY)>10)clear();
    });
    target.addEventListener('pointerup',clear);
    target.addEventListener('pointercancel',clear);
    target.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')clear()});
    target.addEventListener('contextmenu',e=>{
      if(session){e.preventDefault();onLongPress?.();deleteMyMessage(messageId)}
    });
  }

  // Only the small chat preview is cleaned. Tapping it always opens the untouched original image.
  // Preserve artwork, text and dark photos: remove only consistent near-black outer bands.
  async function trimDarkImageMargins(img,originalUrl){
    if(img.dataset.trimAttempted)return;
    img.dataset.trimAttempted='1';
    if(!img.naturalWidth||!img.naturalHeight||img.naturalWidth/img.naturalHeight>.72)return;
    let bitmap;
    try{
      const response=await fetch(originalUrl,{mode:'cors'});
      if(!response.ok)return;
      bitmap=await createImageBitmap(await response.blob());
      const w=Math.min(320,bitmap.width),h=Math.round(w*bitmap.height/bitmap.width);
      if(w<40||h<80)return;
      const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
      const ctx=canvas.getContext('2d',{willReadFrequently:true});
      if(!ctx)return;
      ctx.drawImage(bitmap,0,0,w,h);
      const pixels=ctx.getImageData(0,0,w,h).data;
      const darkAt=(x,y)=>{
        const i=(y*w+x)*4;
        return pixels[i+3]>230&&pixels[i]<48&&pixels[i+1]<48&&pixels[i+2]<48;
      };
      const rowIsMatte=y=>{
        let n=0,dark=0;
        for(let x=0;x<w;x+=4){n++;if(darkAt(x,y))dark++}
        return dark/n>.93;
      };
      let top=0,bottom=h;
      while(top<Math.floor(h*.22)&&rowIsMatte(top))top++;
      while(bottom>Math.ceil(h*.78)&&rowIsMatte(bottom-1))bottom--;
      const colIsMatte=x=>{
        let n=0,dark=0;
        for(let y=top;y<bottom;y+=4){n++;if(darkAt(x,y))dark++}
        return n>0&&dark/n>.94;
      };
      let left=0,right=w;
      while(left<Math.floor(w*.16)&&colIsMatte(left))left++;
      while(right>Math.ceil(w*.84)&&colIsMatte(right-1))right--;
      if(top+h-bottom+left+w-right<8||right-left<40||bottom-top<50)return;
      const preview=document.createElement('canvas');preview.width=right-left;preview.height=bottom-top;
      preview.getContext('2d').drawImage(canvas,left,top,preview.width,preview.height,0,0,preview.width,preview.height);
      preview.toBlob(blob=>{
        if(!blob||!img.isConnected)return;
        const url=URL.createObjectURL(blob);
        img.addEventListener('load',()=>URL.revokeObjectURL(url),{once:true});
        img.src=url;
      },'image/webp',.86);
    }catch(_){
      // A photo host without CORS support still displays the original preview normally.
    }finally{
      if(bitmap)bitmap.close();
    }
  }

  async function compressImage(file){
    if(!file.type.startsWith('image/')) throw new Error('이미지 파일만 올릴 수 있어요.');
    if(file.size>12*1024*1024) throw new Error('사진은 12MB 이하만 올릴 수 있어요.');
    const bitmap=await createImageBitmap(file);
    const max=1600;
    const scale=Math.min(1,max/Math.max(bitmap.width,bitmap.height));
    const canvas=document.createElement('canvas');
    canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));
    const ctx=canvas.getContext('2d');ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close?.();
    const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',0.82));
    if(!blob) throw new Error('사진을 처리하지 못했습니다.');
    return new File([blob],'chat-'+Date.now()+'.webp',{type:'image/webp'});
  }
  async function uploadPhoto(file){

      const form=new FormData();
      form.append('file',prepared);
      form.append('fileName',prepared.name);
      form.append('publicKey',auth.publicKey);
      form.append('signature',auth.signature);
      form.append('expire',String(auth.expire));
      form.append('token',auth.token);
      form.append('folder',auth.folder);
      form.append('useUniqueFileName','true');
      const r=await fetch(auth.uploadEndpoint,{method:'POST',body:form});
      const uploaded=await r.json().catch(()=>({}));
      if(!r.ok||!uploaded.url||!uploaded.fileId) throw new Error(uploaded.message||'사진 업로드에 실패했습니다.');
      const sent=await api({
        action:'chat-send',memberId:session.member.id,sessionToken:session.sessionToken,
        messageType:'image',message:'사진',imageUrl:uploaded.url,imageFileId:uploaded.fileId
      });
      appendMessages(sent.message?[sent.message]:[]);els.messages.scrollTop=els.messages.scrollHeight;
    }catch(e){alert(e.message||'사진 업로드에 실패했습니다.')}

  async function loadPublicRooms(){
    try{
      const data=await api({action:'chat-public-list-rooms'});
      const rooms=Array.isArray(data.rooms)?data.rooms:[];
      if(!rooms.length){
        els.publicRooms.innerHTML='<div class="admin-empty">현재 입장 가능한 채팅방이 없습니다.</div>';
        return;
      }
      const remembered=getRememberedSessions();
      const PAGE_SIZE=5;
      let page=1;
      const totalPages=Math.max(1,Math.ceil(rooms.length/PAGE_SIZE));

      const render=()=>{
        if(page>totalPages)page=totalPages;
        const slice=rooms.slice((page-1)*PAGE_SIZE,page*PAGE_SIZE);
        const rows=slice.map(room=>{
          const known=Boolean(remembered[String(room.code).toUpperCase()]);
          return '<div class="public-room-item'+(known?' remembered':'')+'"><div><div class="public-room-name">'+esc(room.title||'채팅방')+(known?' <span class="entered-badge">✓ 이전 입장</span>':'')+'</div></div><button class="public-room-enter'+(known?' selected':'')+'" type="button" data-public-room="'+esc(room.code)+'">'+(known?'바로 입장':'입장')+'</button></div>';
        }).join('');

        let pager='';
        if(totalPages>1){
          let nums='';
          for(let i=1;i<=totalPages;i++){
            nums+='<button class="room-page-btn'+(i===page?' active':'')+'" type="button" data-page="'+i+'">'+i+'</button>';
          }
          pager='<div class="room-pagination"><button class="room-page-btn" type="button" data-prev '+(page===1?'disabled':'')+'>‹</button>'+nums+'<button class="room-page-btn" type="button" data-next '+(page===totalPages?'disabled':'')+'>›</button></div>';
        }
        els.publicRooms.innerHTML=rows+pager;

        els.publicRooms.querySelectorAll('[data-public-room]').forEach(btn=>btn.addEventListener('click',()=>{
          const code=String(btn.dataset.publicRoom||'').toUpperCase();
          const known=rememberedFor(code);
          if(known){
            session={room:known.room,member:known.member,sessionToken:known.sessionToken};
            saveSession();
            showChat();
            return;
          }
          const room=rooms.find(r=>String(r.code).toUpperCase()===code);
          if(room)openFirstEntry(room);
        }));

        els.publicRooms.querySelectorAll('[data-page]').forEach(btn=>btn.addEventListener('click',()=>{
          page=Number(btn.dataset.page)||1;
          render();
        }));
        els.publicRooms.querySelector('[data-prev]')?.addEventListener('click',()=>{
          if(page>1){page--;render()}
        });
        els.publicRooms.querySelector('[data-next]')?.addEventListener('click',()=>{
          if(page<totalPages){page++;render()}
        });
      };
      render();
    }catch(e){
      els.publicRooms.innerHTML='<div class="admin-empty">'+esc(e.message)+'</div>';
    }
  }

          const data=await r.json().catch(()=>({}));

            room:data.room,

            sessionToken:data.sessionToken,
            expiresAt:Date.now()+REMEMBER_MS
          };
          session={room:data.room,member:data.member,sessionToken:data.sessionToken};
          saveSession();
          showChat();
        }catch(e){
          alert(e.message||'채팅방에 입장하지 못했습니다.');

  els.themeToggle.addEventListener('click',()=>applyTheme(document.body.classList.contains('dark')?'light':'dark'));
  document.getElementById('brandHome').addEventListener('click',()=>{location.href='/'});
  document.getElementById('brandHome').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();location.href='/'}});
  els.adminRoomAddBtn.addEventListener('click',()=>{location.href='/chat-admin.html?new=1'});
  els.imageModal.addEventListener('click',e=>{if(e.target===els.imageModal)closeImage()});
  els.messageInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
  applyTheme(localStorage.getItem(THEME_KEY)||'light');
  loadSoundDefault();
  const isAdmin=Boolean(sessionStorage.getItem(ADMIN_KEY));
  document.body.classList.toggle('admin-mode',isAdmin);
  els.adminRoomAddBtn.classList.toggle('show',isAdmin);
  if(isAdmin){
    els.joinCredentials.style.display='block';
    els.joinBtn.textContent='채팅방 만들기';
    els.joinBtn.setAttribute('aria-label','채팅방 만들기');
    document.querySelectorAll('#joinCard .field').forEach(el=>el.style.display='none');
    els.publicRoomList.style.display='none';
    els.joinHelp.textContent='관리자 전용 화면입니다. 새 방을 만들거나 아래 목록에서 기존 방에 입장할 수 있습니다.';
    els.adminRoomList.classList.add('show');
    loadAdminRooms();
  }else{
    els.joinCredentials.style.display='none';
    loadPublicRooms();
  }
  let invitedRoom='';
  try{
    const params=new URLSearchParams(window.location.search);
    invitedRoom=String(params.get('room')||'').toUpperCase();
    if(invitedRoom){
      els.roomCode.value=invitedRoom;
      if(!isAdmin){
        els.publicRoomList.style.display='none';
        els.roomCodeField.style.display='none';
        els.joinCredentials.style.display='block';
        els.selectedRoom.style.display='block';
        els.selectedRoom.textContent='초대받은 채팅방입니다.';
        els.joinStatus.textContent='비밀번호와 닉네임을 입력해 주세요.';
      }
    }else if(!isAdmin){
      els.roomCodeField.style.display='none';
    }
  }catch(_){}
  try{
    getRememberedSessions();
    if(invitedRoom){
      const saved=rememberedFor(invitedRoom);
      if(saved){
        session={room:saved.room,member:saved.member,sessionToken:saved.sessionToken};
        saveSession();
        showChat();
      }
    }
  }catch(_){clearSession()}
</script>
</body>
</html>
