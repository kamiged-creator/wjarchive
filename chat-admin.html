<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>관계자 채팅 관리 | 복작소</title>
  <style>
    :root{--bg:#f6f1ea;--paper:#fffdf9;--text:#1f1a17;--muted:#746a61;--line:rgba(31,26,23,.12);--accent:#8b6847;--danger:#b94b4b;--ok:#2f7d4d}
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;background:linear-gradient(180deg,#fbf8f4,var(--bg));color:var(--text)}
    button,input{font:inherit}
    header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:rgba(255,253,249,.9);border-bottom:1px solid var(--line);position:sticky;top:0}
    header strong{font-size:18px}.back{border:0;background:transparent;color:var(--muted);font-weight:700;cursor:pointer}
    main{width:min(860px,100%);margin:0 auto;padding:24px 14px 40px}
    .card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:16px}
    h1,h2{letter-spacing:-.035em}h1{font-size:28px;margin:0 0 6px}h2{font-size:18px;margin:0 0 14px}.muted{color:var(--muted);font-size:13px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid .wide{grid-column:1/-1}
    label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}
    input{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:#fff}
    .primary{height:46px;border:0;border-radius:12px;padding:0 16px;background:var(--text);color:#fff;font-weight:850;cursor:pointer}
    .status{min-height:18px;margin-top:10px;font-size:12px;color:var(--danger)}
    .room{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
    .room:first-child{border-top:0}.room-title{font-weight:850}.room-meta{font-size:12px;color:var(--muted);margin-top:3px}
    .actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
    .small{border:1px solid var(--line);border-radius:999px;background:#fff;padding:7px 10px;font-size:11px;font-weight:750;cursor:pointer}
    .small.danger{color:var(--danger)}.small.ok{color:var(--ok)}
    .empty{padding:24px;text-align:center;color:var(--muted);font-size:13px}
    .section-label{margin:18px 0 6px;font-size:12px;font-weight:850;color:var(--muted);letter-spacing:.04em}
    .archived-room{opacity:.72}
    .small.edit{border-color:rgba(139,104,71,.45);color:#735337;background:#fffaf3}
    .title-status{font-size:13px;color:#326846;min-height:0;margin:-6px 0 12px;font-weight:700}
    .title-status:empty{display:none}
    .rename-panel{grid-column:1/-1;padding:14px;background:#faf4eb;border:1px solid rgba(139,104,71,.25);border-radius:15px}
    .rename-panel[hidden]{display:none}
    .rename-panel label{font-size:14px}
    .rename-panel input{font-size:16px;margin-top:7px;border-color:rgba(139,104,71,.3)}
    .rename-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
    .rename-actions button{min-height:44px;padding:0 18px;border-radius:12px;font-size:14px;font-weight:800}
    .rename-save{background:var(--accent);color:white;border:1px solid var(--accent)}
    .rename-cancel{background:#fff;color:var(--text);border:1px solid var(--line)}
    .rename-feedback{font-size:13px;color:var(--danger);min-height:0;margin-top:8px}
    .rename-feedback:empty{display:none}
    @media(max-width:620px){.grid{grid-template-columns:1fr}.grid .wide{grid-column:auto}.room{grid-template-columns:1fr}.actions{justify-content:flex-start}}
  </style>
</head>
<body>
<header><strong>관계자 채팅 관리</strong><button class="back" onclick="location.href='/admin.html'">관리자로 돌아가기</button></header>
<main>
  <section class="card">
    <h1>채팅방 만들기</h1>
    <div class="muted">방 이름과 입장 비밀번호만 입력하면 됩니다. 방 코드는 자동으로 생성됩니다.</div>
    <div class="grid" style="margin-top:16px">
      <div class="wide"><label for="title">방 이름</label><input id="title" placeholder="예: 복작소 관계자방"></div>
      <div class="wide"><label for="password">입장 비밀번호</label><input id="password" type="password" placeholder="4자 이상"></div>
      <div class="wide"><button class="primary" id="createBtn">채팅방 만들기</button></div>
    </div>
    <div class="status" id="status"></div>
  </section>

  <section class="card">
    <h2>채팅방 목록</h2>
    <div class="title-status" id="titleUpdateStatus" role="status" aria-live="polite"></div>
    <div id="rooms"><div class="empty">불러오는 중...</div></div>
  </section>
</main>
<script>
  const ADMIN_KEY='wjarchiveAdminAccessToken';
  const statusEl=document.getElementById('status'),roomsEl=document.getElementById('rooms'),titleUpdateStatus=document.getElementById('titleUpdateStatus');
  function token(){return sessionStorage.getItem(ADMIN_KEY)||''}
  async function api(payload){
    const t=token();if(!t)throw new Error('먼저 관리자 페이지에서 로그인해 주세요.');
    const r=await fetch('/api/content-admin',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+t},body:JSON.stringify(payload)});
    const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||'처리하지 못했습니다.');return d;
  }
  function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
  function makeRoomCode(title){
    const cleaned=String(title||'').trim().toUpperCase()
      .replace(/[^A-Z0-9가-힣]+/g,'')
      .slice(0,8);
    const base=cleaned||'ROOM';
    const suffix=Date.now().toString(36).slice(-5).toUpperCase();
    return (base+suffix).slice(0,16);
  }

  async function load(){
    try{
      const d=await api({action:'chat-list-rooms'});
      if(!d.rooms.length){roomsEl.innerHTML='<div class="empty">아직 만든 채팅방이 없습니다.</div>';return}
      const rowHtml=r=>{
        const archived=!!r.is_archived;
        const editTitleButton='<button class="small edit" type="button" data-edit-title="'+esc(r.id)+'">제목 수정</button>';
        const state=archived?'보관됨':(r.is_active?'입장 가능':'닫힘');
        const actionButtons=archived
          ? editTitleButton+'<button class="small ok" data-archive="'+r.id+'" data-archived="true">복원</button><button class="small danger" data-delete="'+r.id+'" data-title="'+encodeURIComponent(r.title)+'">완전 삭제</button>'
          : '<button class="small" data-enter="'+r.id+'">입장</button>'+editTitleButton+'<button class="small" data-copy="'+r.code+'">초대 링크 복사</button><button class="small" data-pass="'+r.id+'">비밀번호 변경</button><button class="small '+(r.is_active?'danger':'ok')+'" data-toggle="'+r.id+'" data-active="'+r.is_active+'">'+(r.is_active?'방 닫기':'다시 열기')+'</button><button class="small" data-archive="'+r.id+'" data-archived="false">보관</button><button class="small danger" data-delete="'+r.id+'" data-title="'+encodeURIComponent(r.title)+'">방 삭제</button>';
        const editPanel='<div class="rename-panel" hidden><label>새 채팅방 제목<input class="rename-input" type="text" maxlength="50" autocomplete="off" aria-label="새 채팅방 제목"></label><div class="rename-actions"><button class="rename-save" type="button" data-save-title>저장</button><button class="rename-cancel" type="button" data-cancel-title>취소</button></div><div class="rename-feedback" role="alert"></div></div>';
        return '<div class="room '+(archived?'archived-room':'')+'"><div><div class="room-title">'+esc(r.title)+'</div><div class="room-meta">#'+esc(r.code)+' · '+state+'</div></div><div class="actions">'+actionButtons+'</div>'+editPanel+'</div>';
      };
      const active=d.rooms.filter(r=>!r.is_archived), archived=d.rooms.filter(r=>r.is_archived);
      roomsEl.innerHTML=
        '<div class="section-label">사용 중</div>'+(active.length?active.map(rowHtml).join(''):'<div class="empty">사용 중인 채팅방이 없습니다.</div>')+
        '<div class="section-label">보관함</div>'+(archived.length?archived.map(rowHtml).join(''):'<div class="empty">보관된 채팅방이 없습니다.</div>');
      roomsEl.querySelectorAll('[data-edit-title]').forEach(b=>b.addEventListener('click',()=>{
        titleUpdateStatus.textContent='';
        const row=b.closest('.room');
        const panel=row?.querySelector('.rename-panel');
        const room=d.rooms.find(item=>String(item.id)===String(b.dataset.editTitle));
        if(!panel||!room)return;
        roomsEl.querySelectorAll('.rename-panel').forEach(item=>item.hidden=true);
        const input=panel.querySelector('.rename-input');
        const feedback=panel.querySelector('.rename-feedback');
        feedback.textContent='';
        input.value=room.title||'';
        panel.hidden=false;
        input.focus();
        input.select();
      }));
      roomsEl.querySelectorAll('[data-cancel-title]').forEach(b=>b.addEventListener('click',()=>{
        b.closest('.rename-panel').hidden=true;
      }));
      roomsEl.querySelectorAll('[data-save-title]').forEach(b=>b.addEventListener('click',async()=>{
        const panel=b.closest('.rename-panel');
        const row=b.closest('.room');
        const editButton=row.querySelector('[data-edit-title]');
        const room=d.rooms.find(item=>String(item.id)===String(editButton?.dataset.editTitle));
        const input=panel.querySelector('.rename-input');
        const feedback=panel.querySelector('.rename-feedback');
        const title=input.value.trim();
        feedback.textContent='';
        if(!room)return;
        if(!title||title.length>50){
          feedback.textContent='제목은 1~50자로 입력해 주세요.';
          input.focus();
          return;
        }
        if(title===room.title){panel.hidden=true;return}
        b.disabled=true;
        try{
          await api({action:'chat-rename-room',roomId:room.id,expectedTitle:room.title,title});
          titleUpdateStatus.textContent='채팅방 제목이 수정되었습니다.';
          await load();
        }catch(e){
          feedback.textContent=e.message||'제목을 저장하지 못했습니다.';
          if(e.message&&e.message.includes('다른 관리자')){
            titleUpdateStatus.textContent='방 이름이 다른 관리자에 의해 변경되었을 수 있습니다.';
          }
        }finally{b.disabled=false}
      }));
      roomsEl.querySelectorAll('.rename-input').forEach(input=>input.addEventListener('keydown',e=>{
        if(e.key==='Enter'){e.preventDefault();input.closest('.rename-panel').querySelector('[data-save-title]').click()}
        if(e.key==='Escape'){input.closest('.rename-panel').querySelector('[data-cancel-title]').click()}
      }));
      roomsEl.querySelectorAll('[data-enter]').forEach(b=>b.addEventListener('click',async()=>{
        b.disabled=true;
        try{
          const data=await api({action:'chat-admin-enter-room',roomId:b.dataset.enter});
          const saved={
            room:data.room,
            member:data.member,
            sessionToken:data.sessionToken,
            expiresAt:Date.now()+30*24*60*60*1000
          };
          localStorage.setItem('bokjaksoChatSessionV1',JSON.stringify(saved));
          location.href='/chat.html';
        }catch(e){
          alert(e.message||'채팅방에 입장하지 못했습니다.');
          b.disabled=false;
        }
      }));
      roomsEl.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',async()=>{const url=new URL('/chat.html',window.location.origin);url.searchParams.set('room',b.dataset.copy);const text=url.toString();try{await navigator.clipboard.writeText(text);alert('초대 링크를 복사했습니다.\n비밀번호는 따로 전달해 주세요.')}catch(_){prompt('아래 초대 링크를 복사해 주세요.',text)}}));
      roomsEl.querySelectorAll('[data-delete]').forEach(b=>b.addEventListener('click',async()=>{const title=decodeURIComponent(b.dataset.title||'채팅방');const ok=confirm('['+title+'] 방을 완전히 삭제할까요?\n삭제하면 이 방의 대화와 참여 기록도 함께 삭제되며 복구할 수 없습니다.');if(!ok)return;try{await api({action:'chat-delete-room',roomId:b.dataset.delete});alert('채팅방을 삭제했습니다.');load()}catch(e){alert(e.message)}}));
      roomsEl.querySelectorAll('[data-archive]').forEach(b=>b.addEventListener('click',async()=>{const restoring=b.dataset.archived==='true';const msg=restoring?'이 채팅방을 다시 사용할까요?':'이 채팅방을 보관할까요?\n보관 중에는 일반 사용자가 입장할 수 없습니다.';if(!confirm(msg))return;try{await api({action:'chat-set-archived',roomId:b.dataset.archive,isArchived:!restoring});alert(restoring?'채팅방을 복원했습니다.':'채팅방을 보관했습니다.');load()}catch(e){alert(e.message)}}));
      roomsEl.querySelectorAll('[data-toggle]').forEach(b=>b.addEventListener('click',async()=>{await api({action:'chat-set-active',roomId:b.dataset.toggle,isActive:b.dataset.active!=='true'});load()}));
      roomsEl.querySelectorAll('[data-pass]').forEach(b=>b.addEventListener('click',async()=>{const p=prompt('새 비밀번호를 입력해 주세요. (4자 이상)');if(!p)return;try{await api({action:'chat-change-password',roomId:b.dataset.pass,password:p});alert('비밀번호를 변경했습니다.')}catch(e){alert(e.message)}}));
    }catch(e){roomsEl.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}
  }
  document.getElementById('createBtn').addEventListener('click',async()=>{
    statusEl.textContent='';
    const btn=document.getElementById('createBtn');
    btn.disabled=true;
    try{
      const title=document.getElementById('title').value.trim();
      const password=document.getElementById('password').value;
      if(!title)throw new Error('방 이름을 입력해 주세요.');
      const code=makeRoomCode(title);
      const created=await api({action:'chat-create-room',title,code,password});
      const roomId=created.room?.id;
      if(!roomId)throw new Error('채팅방은 만들었지만 입장 정보를 확인하지 못했습니다.');
      const entered=await api({action:'chat-admin-enter-room',roomId});
      const saved={
        room:entered.room,
        member:entered.member,
        sessionToken:entered.sessionToken,
        expiresAt:Date.now()+30*24*60*60*1000
      };
      localStorage.setItem('bokjaksoChatSessionV1',JSON.stringify(saved));
      location.href='/chat.html';
    }catch(e){
      btn.disabled=false;
      statusEl.style.color='var(--danger)';
      statusEl.textContent=e.message;
    }
  });
  load();
</script>
</body>
</html>
