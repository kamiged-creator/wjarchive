<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>복작소 일반 채팅 운영진</title>
<style>
:root{color-scheme:light;--bg:#f6f1ea;--paper:#fffefa;--ink:#30261f;--muted:#66594d;--line:#c9b8a5;--accent:#795738}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}
header{background:var(--paper);border-bottom:1px solid var(--line);padding:16px max(16px,calc((100vw - 850px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}
header strong{font-size:18px}a{color:#604328}main{max-width:850px;margin:0 auto;padding:18px 14px 44px}
.card{background:var(--paper);border:1px solid #dfd0bf;border-radius:18px;padding:20px;margin-bottom:17px;box-shadow:0 3px 14px #30200d0a}
h1{font-size:24px;margin:0 0 6px}h2{font-size:19px;margin:0 0 10px}p{line-height:1.65;margin:9px 0;color:var(--muted)}
label{display:block;font-weight:750;margin:16px 0 7px}input{width:100%;height:53px;border:1.5px solid var(--line);border-radius:12px;background:white;color:var(--ink);font-size:16px;padding:12px}
button{font:inherit;min-height:45px;border-radius:11px;border:1.5px solid #b6a18c;background:white;color:var(--ink);padding:9px 13px;font-weight:750;cursor:pointer;word-break:keep-all}
button.primary{border-color:var(--accent);background:var(--accent);color:white}
button.danger{border-color:#d6a5a0;color:#903b35;background:#fff7f6}
button:disabled{opacity:.55;cursor:wait}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #ae8963;outline-offset:2px}
#loginBtn{width:100%;margin-top:16px;min-height:53px;font-size:16px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.row>*{flex:0 0 auto}
.heading{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.room{border:1.5px solid #dacaba;background:#fffcf7;border-radius:15px;padding:16px;margin-top:14px}
.room h3{font-size:18px;margin:0 0 5px;overflow-wrap:anywhere}.meta{color:var(--muted);font-size:13px;margin-bottom:10px}
.room .row{margin-top:12px}.panel{background:#f8f1e8;border:1px solid #d6c6b4;border-radius:13px;margin-top:14px;padding:13px}
.panel h4{margin:0 0 9px}.member,.message{padding:10px 0;border-bottom:1px solid #dbcbbb;display:flex;align-items:center;justify-content:space-between;gap:12px}
.member:last-child,.message:last-child{border-bottom:0}.member>div,.message>div{flex:1;min-width:0}
.message small,.member small{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.message span{display:block;white-space:normal;overflow-wrap:anywhere;line-height:1.5}
.feedback{min-height:18px;font-size:14px;color:#ad332d;margin-top:9px}
[hidden]{display:none!important}
@media(max-width:450px){.card{padding:16px 12px}.room{padding:14px 11px}button{min-height:48px}.room .row button{flex:1 1 42%}.member button,.message button{min-width:70px}}
/* Compact, one-room-at-a-time controls. All rooms start collapsed. */
.room{padding:0!important;overflow:hidden}
.room-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:74px;padding:14px 16px;cursor:pointer;list-style:none;user-select:none}
.room-heading::-webkit-details-marker{display:none}
.room-heading::marker{content:''}
.room-heading:focus-visible{outline:3px solid #ae8963;outline-offset:-4px;border-radius:14px}
.room-title-block{min-width:0;flex:1}
.room-title-block strong{display:block;font-size:18px;line-height:1.45;overflow-wrap:anywhere}
.room-title-block small{display:block;color:var(--muted);font-size:13px;margin-top:5px}
.room-chevron{font-size:24px;line-height:1;color:var(--accent);transition:transform .18s ease}
.room[open] .room-chevron{transform:rotate(180deg)}
.room[open] .room-heading{background:#f7f0e7;border-bottom:1px solid #dacaba}
.room-body{padding:4px 16px 16px}
.operator-footer{display:flex;justify-content:flex-end;border-top:1px solid #e5dacd;padding-top:22px;margin-top:28px}
.operator-footer button{background:transparent;font-size:14px;font-weight:650}
@media(max-width:450px){.room-heading{padding:15px 13px}.room-body{padding:4px 12px 14px}}
@media(prefers-reduced-motion:reduce){.room-chevron{transition:none}}
/* Chat-room creation opens by tapping ＋ and closes with −. */
.create-room-details{padding:0!important;overflow:hidden}
.create-room-summary{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:74px;padding:18px 16px;cursor:pointer;list-style:none;font-size:20px;font-weight:800;color:var(--ink)}
.create-room-summary::-webkit-details-marker{display:none}
.create-room-summary::marker{content:''}
.create-room-summary:focus-visible{outline:3px solid #ae8963;outline-offset:-4px;border-radius:12px}
.create-room-toggle{display:flex;align-items:center;justify-content:center;flex:0 0 42px;width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper);font-size:25px;line-height:1;color:var(--accent)}
.create-room-toggle .create-minus,.create-room-details[open] .create-plus{display:none}
.create-room-details[open] .create-minus{display:inline}
.create-room-details[open] .create-room-summary{border-bottom:1px solid var(--line)}
.create-room-body{padding:10px 16px 20px}
@media(max-width:450px){.create-room-summary{padding:14px 13px;min-height:70px;font-size:19px}.create-room-body{padding:8px 13px 17px}}
/* The operator's personal profile replaces the bulky heading. */
.visually-hidden{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.operator-profile{border-bottom:1px solid #e2d4c3;margin-bottom:17px;padding:8px 0 20px;text-align:center}
.operator-profile-button{display:flex;flex-direction:column;align-items:center;gap:7px;width:100%;border:0;background:transparent;padding:10px 6px;min-height:auto}
.operator-avatar{display:flex;align-items:center;justify-content:center;width:84px;height:84px;border-radius:50%;border:2px solid var(--line);background:#f7f0e8;font-size:36px;overflow:hidden}
.operator-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.operator-display-name{font-size:22px;font-weight:800;line-height:1.35;overflow-wrap:anywhere}
.operator-role-badge{display:inline-block;padding:5px 12px;border-radius:999px;border:1px solid #c5b09a;color:#765637;background:#f7efe4;font-size:13px;font-weight:750}
.operator-profile-hint{font-size:13px;color:var(--muted)}
.operator-profile-form{max-width:440px;margin:9px auto 0;padding:15px;text-align:left;background:#f8f2ea;border:1px solid var(--line);border-radius:15px}
.operator-profile-form label:first-child{margin-top:0}
.operator-profile-form input[type=file]{height:auto;min-height:52px;padding:12px;font-size:14px}
.operator-profile-actions{display:flex;gap:10px;margin-top:14px}
.operator-profile-actions button{flex:1;min-width:0}
@media(max-width:450px){.operator-profile{padding-top:1px}.operator-avatar{width:78px;height:78px}}
/* Keep the refresh control visually attached to the list it updates. */
.operator-room-tools{margin-bottom:12px}
.operator-room-list #panelStatus:empty{display:none}
.operator-room-list #panelStatus:not(:empty){min-height:0;margin:0 0 12px;line-height:1.45}
.operator-room-list #rooms>.room:first-child{margin-top:0}
/* Remember-me checkbox, explicit opt-in. */
.remember-operator{display:flex;align-items:center;gap:11px;cursor:pointer;margin:16px 0 0;font-size:15px;font-weight:700}
.remember-operator input{width:23px;height:23px;flex:0 0 23px;margin:0;accent-color:var(--accent);cursor:pointer}
.remember-operator small{font-size:13px;font-weight:550;color:var(--muted)}
.remember-operator-hint{margin:5px 0 8px 34px;font-size:12px;color:var(--muted);line-height:1.5}
</style>
</head>
<body>
<header><strong>🔒 복작소 운영진</strong><a href="/chat.html">일반 채팅방 보기</a></header>
<main>
<section class="card" id="loginCard">
  <h1>운영진 로그인</h1>
  <p>최고관리자가 발급한 <b>운영진 전용 비밀번호</b>로 로그인해 줘. 홈페이지 관리자 비밀번호와는 달라.</p>
  <form id="loginForm"><label for="operatorPassword">운영진 비밀번호</label><input id="operatorPassword" type="password" autocomplete="current-password" required minlength="12" placeholder="운영진 비밀번호 입력">
    <label class="remember-operator" for="rememberOperator">
      <input id="rememberOperator" type="checkbox">
      <span>이 기기에서 로그인 유지 <small>(30일)</small></span>
    </label>
    <p class="remember-operator-hint">개인 휴대폰에서만 체크해 주세요. 비밀번호는 저장되지 않아요.</p>
    <button class="primary" id="loginBtn" type="submit">로그인</button>
  </form><div id="loginStatus" class="feedback" role="status"></div>
</section>
<section id="panelCard" hidden>
  <div class="card">
    <h1 class="visually-hidden">운영진 관리</h1>
    <section class="operator-profile" aria-label="운영진 내 프로필">
      <button type="button" id="profileEditToggle" class="operator-profile-button" aria-expanded="false" aria-controls="operatorProfileForm">
        <span class="operator-avatar" id="operatorProfileAvatar">👤</span>
        <span class="operator-display-name" id="operatorDisplayName">운영진</span>
        <span class="operator-role-badge">공식 운영진</span>
        <span class="operator-profile-hint">사진·닉네임 수정 <span aria-hidden="true">›</span></span>
      </button>
      <form id="operatorProfileForm" class="operator-profile-form" hidden>
        <label for="operatorNickname">내 닉네임</label>
        <input id="operatorNickname" type="text" maxlength="20" autocomplete="nickname" placeholder="운영진 닉네임" required>
        <label for="operatorAvatarFile">프로필 사진 (선택·최대 2MB)</label>
        <input id="operatorAvatarFile" type="file" accept="image/jpeg,image/png,image/webp">
        <div class="operator-profile-actions">
          <button type="button" id="operatorRemoveAvatar">기본 아이콘</button>
          <button class="primary" type="submit" id="operatorProfileSave">프로필 저장</button>
        </div>
        <div id="operatorProfileStatus" class="feedback" role="status"></div>
      </form>
    </section>
    <details id="createRoomDetails" class="panel create-room-details" style="margin:17px 0">
      <summary class="create-room-summary">
        <span>새 채팅방 만들기</span>
        <span class="create-room-toggle" aria-hidden="true"><span class="create-plus">＋</span><span class="create-minus">−</span></span>
      </summary>
      <form id="createRoomForm" class="create-room-body">
        <p>방 이름과 입장 비밀번호를 설정하면 코드가 자동으로 만들어져.</p>
        <label for="newRoomTitle">방 이름</label>
        <input id="newRoomTitle" type="text" maxlength="50" required placeholder="예: 문학 이야기방" autocomplete="off">
        <label for="newRoomPassword">방 입장 비밀번호 (8자 이상)</label>
        <input id="newRoomPassword" type="password" minlength="8" maxlength="128" required autocomplete="new-password" placeholder="참여자에게 따로 알려줄 비밀번호">
        <button id="createRoomBtn" class="primary" type="submit" style="width:100%;margin-top:14px">채팅방 만들기</button>
        <div id="createRoomStatus" class="feedback" role="status"></div>
      </form>
    </details>
    <div class="operator-room-list">
      <div class="row operator-room-tools"><button id="refreshBtn" type="button">↻ 목록 새로고침</button></div>
      <div id="panelStatus" class="feedback" role="status"></div>
      <div id="rooms"></div>
    </div>
    <div class="operator-footer"><button id="logoutBtn" type="button">로그아웃</button></div>
  </div>
</section>
</main>
<script>
(function(){
  'use strict';
  const KEY='bokjaksoRegularRoomOperatorSessionV1';
  let operatorProfile={nickname:'운영진',avatar_url:null},removeOperatorAvatar=false;
  const profileForm=document.getElementById('operatorProfileForm');
  const profileFile=document.getElementById('operatorAvatarFile');
  function paintOperatorProfile(){
    const el=document.getElementById('operatorProfileAvatar');
    el.replaceChildren();
    if(operatorProfile.avatar_url){
      const img=document.createElement('img');
      img.alt='운영진 프로필 사진';img.src=operatorProfile.avatar_url;
      el.appendChild(img);
    }else{el.textContent='👤'}
    document.getElementById('operatorDisplayName').textContent=operatorProfile.nickname||'운영진';
    document.getElementById('operatorNickname').value=operatorProfile.nickname||'운영진';
  }
  async function loadOperatorProfile(){
    const data=await api('operator-profile-get');
    operatorProfile=data.profile||{nickname:'운영진',avatar_url:null};
    paintOperatorProfile();
  }
  document.getElementById('profileEditToggle').addEventListener('click',()=>{
    profileForm.hidden=!profileForm.hidden;
    document.getElementById('profileEditToggle').setAttribute('aria-expanded',String(!profileForm.hidden));
    if(!profileForm.hidden)document.getElementById('operatorNickname').focus();
  });
  document.getElementById('operatorRemoveAvatar').addEventListener('click',()=>{
    removeOperatorAvatar=true;profileFile.value='';
    document.getElementById('operatorProfileStatus').textContent='저장하면 기본 아이콘으로 바뀌어.';
  });
  profileFile.addEventListener('change',()=>{
    removeOperatorAvatar=false;
    document.getElementById('operatorProfileStatus').textContent=profileFile.files?.[0]?'사진을 선택했어. 프로필 저장을 눌러줘.':'';
  });
  profileForm.addEventListener('submit',async event=>{
    event.preventDefault();
    const nickname=document.getElementById('operatorNickname').value.trim();
    const status=document.getElementById('operatorProfileStatus');
    const button=document.getElementById('operatorProfileSave'),file=profileFile.files?.[0];
    if(!nickname||nickname.length>20||nickname==='관리자'){status.textContent='닉네임을 1~20자로 입력해 줘.';return}
    if(file&&(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>2*1024*1024)){
      status.textContent='JPG·PNG·WEBP 사진만 2MB 이하로 올릴 수 있어.';return;
    }
    button.disabled=true;status.textContent='프로필 저장 중…';
    try{
      const payload={nickname};
      if(file){
        const auth=await api('operator-profile-image-auth');
        const data=new FormData();
        data.append('file',file,file.name||'operator-avatar.jpg');
        data.append('publicKey',auth.publicKey);data.append('token',auth.token);
        data.append('expire',String(auth.expire));data.append('signature',auth.signature);
        data.append('folder',auth.folder);data.append('useUniqueFileName','true');
        const uploaded=await fetch(auth.uploadEndpoint,{method:'POST',body:data});
        const result=await uploaded.json().catch(()=>({}));
        if(!uploaded.ok||!result.fileId)throw Error(result.message||'사진 업로드에 실패했어.');
        payload.avatarFileId=result.fileId;
      }else if(removeOperatorAvatar)payload.avatarFileId='';
      const saved=await api('operator-profile-save',payload);
      operatorProfile=saved.profile;paintOperatorProfile();
      profileFile.value='';removeOperatorAvatar=false;
      status.textContent='내 프로필을 저장했어. 모든 채팅방에서 사용돼.';
      profileForm.hidden=true;
      document.getElementById('profileEditToggle').setAttribute('aria-expanded','false');
    }catch(error){if(!check(error))status.textContent=error.message||'프로필을 저장하지 못했어.'}
    finally{button.disabled=false}
  });
  const loginCard=document.getElementById('loginCard'),panel=document.getElementById('panelCard');
  const loginStatus=document.getElementById('loginStatus'),panelStatus=document.getElementById('panelStatus');
  const roomsEl=document.getElementById('rooms');
  const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  function token(){
    try{return sessionStorage.getItem(KEY)||localStorage.getItem(KEY)||''}
    catch(_){try{return sessionStorage.getItem(KEY)||''}catch(__){return ''}}
  }
  function clearToken(){
    try{sessionStorage.removeItem(KEY)}catch(_){}
    try{localStorage.removeItem(KEY)}catch(_){}
  }
  function clearOperatorRoomSessions(){
    try{
      const key='bokjaksoChatSessionsV2';
      const rooms=JSON.parse(localStorage.getItem(key)||'{}')||{};
      let changed=false;
      for(const code of Object.keys(rooms)){
        if(rooms[code]?.operator===true){delete rooms[code];changed=true}
      }
      if(changed)localStorage.setItem(key,JSON.stringify(rooms));
      const old=JSON.parse(localStorage.getItem('bokjaksoChatSessionV1')||'null');
      if(old?.operator===true)localStorage.removeItem('bokjaksoChatSessionV1');
    }catch(_){}
  }
  function showLogin(message=''){
    clearToken();clearOperatorRoomSessions();loginCard.hidden=false;panel.hidden=true;
    profileForm.hidden=true;document.getElementById('profileEditToggle').setAttribute('aria-expanded','false');
    profileFile.value='';removeOperatorAvatar=false;
    loginStatus.textContent=message;
    document.getElementById('operatorPassword').value='';
    document.getElementById('rememberOperator').checked=false;
  }
  async function api(action,other={},auth=token()){
    const r=await fetch('/api/content-admin',{method:'POST',cache:'no-store',
      headers:{'Content-Type':'application/json',...(auth?{Authorization:'Bearer '+auth}:{})},
      body:JSON.stringify({action,...other})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){const err=new Error(d.message||'처리하지 못했어.');err.status=r.status;throw err}
    return d;
  }
  function check(e){if(e?.status===401){showLogin('로그인 시간이 끝났어. 다시 로그인해 줘.');return true}return false}
  function note(text){panelStatus.textContent=text}
  function roomHtml(r){
    const state=r.is_archived?'보관된 방':(r.is_active?'열림':'닫힘');
    const disabled=r.is_archived?' disabled title="먼저 방을 복원해 주세요"':'';
    return '<details class="room" name="operator-room-list" data-room="'+esc(r.id)+'">'+
      '<summary class="room-heading"><span class="room-title-block"><strong>'+esc(r.title)+'</strong>'+
      '<small>#'+esc(r.code)+' · '+state+' · 현재 접속 <span data-online-room-id="'+esc(r.id)+'">'+(Number.isFinite(Number(r.online_count))?Math.max(0,Number(r.online_count)):0)+'</span>명</small></span><span class="room-chevron" aria-hidden="true">⌄</span></summary>'+
      '<div class="room-body"><div class="row"><button data-op="rename">제목 수정</button>'+
      '<button data-op="toggle"'+disabled+'>'+(r.is_active?'방 닫기':'방 열기')+'</button>'+
      '<button data-op="password">비밀번호 변경</button>'+
      '<button data-op="archive">'+(r.is_archived?'방 복원':'보관')+'</button>'+
      '<button data-op="copy">초대 링크 복사</button>'+
      (!r.is_archived&&r.is_active?'<button data-op="enter">방 입장</button>':'')+
      '<button data-op="members">참여자 관리</button>'+
      '<button data-op="messages">메시지 관리</button></div>'+
      '<div class="panel" data-detail hidden></div></div></details>';
  }
  let currentRooms=[];
  async function load(){
    const expandedRoomId=roomsEl.querySelector('details.room[open]')?.dataset.room||'';
    const d=await api('operator-list-rooms');
    currentRooms=d.rooms||[];
    roomsEl.innerHTML=currentRooms.length?currentRooms.map(roomHtml).join(''):'<p>등록된 일반 채팅방이 없어.</p>';
    if(expandedRoomId){
      const room=[...roomsEl.querySelectorAll('details.room')].find(el=>el.dataset.room===expandedRoomId);
      if(room)room.open=true;
    }
    note('');
  }
  // Refresh only the visible counts; do not close any expanded room or erase unsaved forms.
  let refreshingOnlineCounts=false;
  async function refreshOnlineCounts(){
    if(document.hidden||panel.hidden||refreshingOnlineCounts)return;
    refreshingOnlineCounts=true;
    try{
      const response=await api('operator-list-rooms');
      const counts=new Map((response.rooms||[]).map(room=>[String(room.id),Number(room.online_count)||0]));
      roomsEl.querySelectorAll('[data-online-room-id]').forEach(el=>{
        const number=counts.get(el.dataset.onlineRoomId);
        if(number!==undefined)el.textContent=String(Math.max(0,number));
      });
    }catch(error){
      if(!check(error))console.warn('채팅방 접속 인원 갱신 실패',error);
    }finally{refreshingOnlineCounts=false}
  }
  setInterval(refreshOnlineCounts,45000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshOnlineCounts()});
  async function showMembers(r,detail){
    const {members}=await api('operator-list-members',{roomId:r.id});
    detail.innerHTML='<h4>참여자 차단·해제</h4>'+
      ((members||[]).length?members.map(m=>
      '<div class="member"><div><b>'+esc(m.nickname)+'</b><small>'+(m.is_blocked?'차단 중':'정상 이용')+'</small></div>'+
      '<button type="button" '+(m.is_blocked?'':'class="danger"')+' data-member="'+esc(m.id)+'" data-blocked="'+(!m.is_blocked)+'">'+(m.is_blocked?'차단 해제':'차단')+'</button></div>').join(''):'<p>참여자가 없어.</p>');
    detail.hidden=false;
    detail.querySelectorAll('[data-member]').forEach(b=>b.addEventListener('click',async()=>{
      if(!confirm('이 참여자를 '+(b.dataset.blocked==='true'?'차단':'차단 해제')+'할까?'))return;
      b.disabled=true;
      try{await api('operator-set-blocked',{roomId:r.id,memberId:b.dataset.member,isBlocked:b.dataset.blocked==='true'});
        await showMembers(r,detail)}
      catch(e){if(!check(e))alert(e.message)}
      finally{b.disabled=false}
    }));
  }
  async function showMessages(r,detail){
    const {messages}=await api('operator-list-messages',{roomId:r.id});
    detail.innerHTML='<h4>최근 메시지 40개 · 개별 관리</h4>'+
      ((messages||[]).length?messages.map(m=>
      '<div class="message"><div><small>'+esc(m.nickname)+' · '+esc(new Date(m.created_at).toLocaleString('ko-KR'))+'</small>'+
      '<span>'+esc(m.body).slice(0,500)+(m.message_type==='image'?' [이미지]':'')+'</span></div>'+
      '<button type="button" class="danger" data-message="'+esc(m.id)+'">삭제</button></div>').join(''):'<p>메시지가 없어.</p>');
    detail.hidden=false;
    detail.querySelectorAll('[data-message]').forEach(b=>b.addEventListener('click',async()=>{
      if(!confirm('이 메시지 하나를 삭제할까? 다른 대화는 그대로 보존돼.'))return;
      b.disabled=true;
      try{await api('operator-delete-message',{roomId:r.id,messageId:Number(b.dataset.message)});
        await showMessages(r,detail)}
      catch(e){if(!check(e))alert(e.message)}
      finally{b.disabled=false}
    }));
  }
  async function clickRoom(b){
    const r=currentRooms.find(r=>String(r.id)===String(b.closest('[data-room]')?.dataset.room));
    if(!r)return;
    const op=b.dataset.op;
    const detail=b.closest('.room').querySelector('[data-detail]');
    if(op==='members'){await showMembers(r,detail);return}
    if(op==='messages'){await showMessages(r,detail);return}
    if(op==='archive'){
      if(!confirm('채팅방을 '+(r.is_archived?'복원':'보관')+'할까? 대화 기록은 지워지지 않아.'))return;
      await api('operator-set-archived',{roomId:r.id,isArchived:!r.is_archived});
      await load();note(r.is_archived?'보관된 채팅방을 복원했어.':'대화를 보존하면서 방을 보관했어.');return;
    }
    if(op==='copy'){
      const url=new URL('/chat.html',location.origin);url.searchParams.set('room',r.code);
      try{await navigator.clipboard.writeText(url.toString());note('초대 링크를 복사했어. 방 비밀번호는 따로 전달해 줘.')}
      catch(_){prompt('초대 링크를 복사해 줘. 방 비밀번호는 따로 알려줘.',url.toString())}
      return;
    }
    if(op==='enter'){
      const entered=await api('operator-admin-enter-room',{roomId:r.id});
      if(!entered?.member?.id||!entered?.sessionToken)throw Error('채팅방 입장 정보를 확인하지 못했어.');
      const mapKey='bokjaksoChatSessionsV2';
      let map={};try{map=JSON.parse(localStorage.getItem(mapKey)||'{}')||{}}catch(_){}
      const code=String(entered.room.code||'').toUpperCase();
      const saved={room:entered.room,member:entered.member,sessionToken:entered.sessionToken,operator:true,expiresAt:Date.now()+30*24*3600*1000};
      map[code]=saved;
      localStorage.setItem(mapKey,JSON.stringify(map));
      localStorage.setItem('bokjaksoChatSessionV1',JSON.stringify(saved));
      location.href='/chat.html?room='+encodeURIComponent(code);return;
    }
    if(op==='rename'){
      const title=prompt('새 채팅방 제목 (최대 50자)',r.title);
      if(title===null||title.trim()===r.title)return;
      if(!title.trim()||title.trim().length>50)throw Error('방 제목은 1~50자여야 해.');
      await api('operator-rename-room',{roomId:r.id,expectedTitle:r.title,title:title.trim()});
      await load();note('방 제목이 변경됐어.');return;
    }
    if(op==='toggle'){
      const next=!r.is_active;
      if(!confirm('이 방을 '+(next?'다시 열기':'일시 닫기')+' 할까?'))return;
      await api('operator-set-active',{roomId:r.id,isActive:next});
      await load();note('채팅방 상태를 변경했어.');return;
    }
    if(op==='password'){
      if(!confirm('비밀번호를 바꾸면 기존 참여자가 다시 입장해야 하고 알림도 다시 켜야 해. 계속할까?'))return;
      const password=prompt('새 채팅방 입장 비밀번호 (8자 이상)');
      if(password===null)return;
      if(password.length<8)throw Error('비밀번호는 8자 이상이어야 해.');
      await api('operator-change-password',{roomId:r.id,password});
      note('비밀번호가 변경됐어. 이전 참여자는 새 비밀번호로 다시 입장해야 해.');
    }
  }
  roomsEl.addEventListener('click',async e=>{
    const b=e.target.closest('button[data-op]');if(!b||b.disabled)return;
    b.disabled=true;
    try{await clickRoom(b)}catch(err){if(!check(err))alert(err.message)}
    finally{b.disabled=false}
  });
  document.getElementById('createRoomForm').addEventListener('submit',async e=>{
    e.preventDefault();
    const button=document.getElementById('createRoomBtn'),status=document.getElementById('createRoomStatus');
    const title=document.getElementById('newRoomTitle').value.trim();
    const password=document.getElementById('newRoomPassword').value;
    if(!title||password.length<8){status.textContent='방 이름과 8자 이상 비밀번호를 입력해 줘.';return}
    const digits=new Uint8Array(8);
    crypto.getRandomValues(digits);
    const code='ROOM'+Array.from(digits,b=>b.toString(16).padStart(2,'0')).join('').toUpperCase();
    button.disabled=true;status.textContent='채팅방 만드는 중…';
    try{
      await api('operator-create-room',{title,password,code});
      document.getElementById('newRoomTitle').value='';
      document.getElementById('newRoomPassword').value='';
      status.textContent='채팅방을 만들었어! 목록에서 초대 링크를 복사할 수 있어.';
      await load();
    }catch(error){if(!check(error))status.textContent=error.message}
    finally{button.disabled=false}
  });
  document.getElementById('loginForm').addEventListener('submit',async e=>{
    e.preventDefault();const btn=document.getElementById('loginBtn');btn.disabled=true;loginStatus.textContent='확인 중…';
    try{
      const remember=document.getElementById('rememberOperator').checked;
      const d=await api('operator-login',{password:document.getElementById('operatorPassword').value,remember},'');
      clearToken();
      (remember?localStorage:sessionStorage).setItem(KEY,d.accessToken);
      loginCard.hidden=true;panel.hidden=false;
      await Promise.all([load(),loadOperatorProfile()]);
    }catch(err){if(err.status!==401&&err.status!==429&&err.status!==503){showLogin(err.message)}else loginStatus.textContent=err.message}
    finally{btn.disabled=false}
  });
  document.getElementById('refreshBtn').addEventListener('click',async()=>{
    try{await load()}catch(e){if(!check(e))note(e.message)}
  });
  document.getElementById('logoutBtn').addEventListener('click',()=>showLogin('로그아웃했어.'));
  if(token()){loginCard.hidden=true;panel.hidden=false;Promise.all([load(),loadOperatorProfile()]).catch(e=>{if(!check(e))showLogin(e.message)})}
})();
</script>
</body>
</html>
