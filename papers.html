<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>논문 | 이원주</title>
  <meta name="description" content="이원주의 연구와 논문을 소개합니다.">
  <link rel="icon" href="/favicon-32x32.png">
  <style>
    :root{--bg:#f6f1ea;--paper:#fffdf9;--text:#1f1a17;--muted:#6e655d;--line:rgba(31,26,23,.12);--accent:#8b6847;--max:980px}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;word-break:keep-all}
    a{color:inherit;text-decoration:none}
    .wrap{max-width:var(--max);margin:0 auto;padding:0 24px}
    .top{position:sticky;top:0;z-index:10;background:rgba(246,241,234,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
    .topin{height:66px;display:flex;align-items:center;justify-content:space-between;gap:16px}
    .brand{font-weight:800;font-size:23px;color:#2b2724;letter-spacing:-.03em}
    .back{font-size:13px;color:var(--muted);font-weight:750}
    .hero{margin:0 -24px;padding:36px 24px 24px;background:#efe6da;border-bottom:1px solid rgba(139,104,71,.18)}
    .eyebrow{font-size:12px;letter-spacing:.12em;color:var(--accent);font-weight:800;text-transform:uppercase}
    .section-nav{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:7px 0 8px}
    .section-nav h1{margin:0;font-family:"Noto Serif KR","Nanum Myeongjo",serif;font-size:38px;font-weight:500;letter-spacing:-.055em}
    .books-link{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border:1px solid rgba(139,104,71,.22);border-radius:999px;background:rgba(255,253,249,.62);color:#6a5643;font-size:13px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;transition:background .18s ease,border-color .18s ease,color .18s ease,transform .18s ease}
    .books-link:hover{background:#fffaf3;border-color:rgba(139,104,71,.42);color:var(--accent);transform:translateY(-1px)}
    .hero-summary{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
    .hero p{margin:0;color:var(--muted);line-height:1.75;font-size:15px}
    .paper-count{flex:0 0 auto;color:var(--accent);font-size:13px;font-weight:800}
    .papers{padding:28px 0 72px}
    .paper-toolbar{display:flex;justify-content:flex-end;margin-bottom:14px}
    .add-paper{display:none;align-items:center;justify-content:center;width:38px;height:38px;border:1px solid rgba(139,104,71,.28);border-radius:50%;background:var(--paper);color:var(--accent);font-size:24px;line-height:1;cursor:pointer}
    .add-paper.show{display:inline-flex}
    .paper-list{display:grid;gap:0}
    .paper-item{display:block;padding:24px 4px;border-bottom:1px solid var(--line)}
    .paper-content{position:relative;min-width:0;padding-left:16px}
    .paper-title{font-family:"Noto Serif KR","Nanum Myeongjo",serif;font-size:22px;font-weight:650;line-height:1.45;letter-spacing:-.035em}
    .paper-title::before{content:"·";position:absolute;left:0;top:0;color:var(--accent);font-weight:900}
    .paper-meta{margin-top:7px;color:var(--accent);font-size:12px;font-weight:750;letter-spacing:-.01em}
    .paper-summary{margin-top:10px;color:var(--muted);font-size:14px;line-height:1.75;white-space:pre-line}
    .paper-actions{display:none;gap:6px;flex-wrap:wrap;justify-content:flex-end;margin-top:14px}
    .paper-actions.show{display:flex}
    .edit-paper,.delete-paper,.move-paper{padding:7px 10px;border-radius:10px;font:800 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;cursor:pointer}
    .edit-paper{border:1px solid rgba(139,104,71,.28);background:#fffaf3;color:#795f45}
    .delete-paper{border:1px solid rgba(173,67,55,.34);background:#fff4f1;color:#a23d32}
    .move-paper{min-width:34px;border:1px solid rgba(139,104,71,.22);background:#fff;color:#6f6258}
    .move-paper:disabled{opacity:.35;cursor:default}
    .paper-editor{display:none;margin-bottom:18px;padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--paper)}
    .paper-editor.show{display:block}
    .paper-editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .paper-editor .full{grid-column:1/-1}
    .paper-editor input,.paper-editor textarea{width:100%;min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;font:inherit;color:var(--text)}
    .paper-editor textarea{min-height:92px;resize:vertical;line-height:1.6}
    .paper-editor-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
    .paper-editor-actions button{padding:10px 16px;border-radius:12px;font-weight:800;cursor:pointer}
    #cancelPaperBtn{border:1px solid var(--line);background:#fff;color:var(--muted)}
    #savePaperBtn{border:1px solid rgba(139,104,71,.28);background:var(--accent);color:#fff}
    .paper-pagination{display:none;align-items:center;justify-content:center;gap:8px;margin-top:24px}
    .paper-pagination.show{display:flex}
    .paper-pagination button{min-width:38px;height:38px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--muted);font-weight:800;cursor:pointer}
    .paper-pagination button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    .paper-pagination button:disabled{opacity:.4;cursor:default}
    .empty{padding:72px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:24px;background:rgba(255,253,249,.62)}
    .empty strong{display:block;margin-bottom:10px;color:var(--text);font-family:"Noto Serif KR","Nanum Myeongjo",serif;font-size:24px;font-weight:600}
    footer{margin-top:18px;padding:22px 0 34px;background:#f2eae0;border-top:1px solid rgba(139,104,71,.12);font-size:12px;color:var(--muted)}
    .foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
    @media(max-width:560px){
      .wrap{padding:0 14px}.topin{height:58px}.hero{margin:0 -14px;padding:14px 14px 12px}
      .section-nav{gap:10px;margin:2px 0 0}
      .section-nav h1{font-size:34px}
      .books-link{padding:7px 10px;font-size:12px}
      .hero-summary{gap:10px;align-items:baseline}.hero p{margin-top:6px}.paper-count{font-size:12px}
      .papers{padding:12px 0 36px}.paper-item{padding:20px 2px}.paper-title{font-size:20px}.paper-summary{font-size:13px}.paper-actions{justify-content:flex-start;margin-top:12px;padding-left:16px}.paper-editor{padding:14px}.paper-editor-grid{grid-template-columns:1fr}.paper-editor .full{grid-column:auto}.empty{padding:52px 16px}
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap topin">
      <a class="brand" href="/">이원주</a>
      <a class="back" href="/">← 홈페이지</a>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <div class="eyebrow">Paper · Research</div>
      <div class="section-nav" aria-label="논문과 책 소개">
        <h1>논문</h1>
        <a class="books-link" href="/books.html?page=1">← 책 소개</a>
      </div>
      <div class="hero-summary">
        <p>연구와 논문 기록을 한곳에 정리합니다.</p>
        <span class="paper-count">0편</span>
      </div>
    </section>

    <section class="papers">
      <div class="paper-toolbar">
        <button class="add-paper" id="addPaperBtn" type="button" aria-label="논문 제목 추가">+</button>
      </div>
      <div class="paper-editor" id="paperEditor">
        <div class="paper-editor-grid">
          <input class="full" id="paperTitleInput" type="text" maxlength="180" placeholder="논문 제목">
          <input id="paperYearInput" type="text" maxlength="20" inputmode="numeric" placeholder="발표연도 예: 2026">
          <input id="paperJournalInput" type="text" maxlength="120" placeholder="학술지 · 학교 · 기관명">
          <textarea class="full" id="paperSummaryInput" maxlength="600" placeholder="논문을 한두 문장으로 간단히 소개해 주세요."></textarea>
        </div>
        <div class="paper-editor-actions">
          <button id="cancelPaperBtn" type="button">취소</button>
          <button id="savePaperBtn" type="button">저장</button>
        </div>
      </div>
      <div class="paper-list" id="paperList"></div>
      <div class="paper-pagination" id="paperPagination"></div>
      <div class="empty" id="paperEmpty">
        <strong>등록된 논문이 없습니다.</strong>
        관리자 로그인 후 + 버튼으로 논문 제목을 추가할 수 있습니다.
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap foot"><span>© <span id="year"></span> Lee Wonju.</span><a href="/admin.html">관리자</a></div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL='https://vefeplfczeztbplowjmj.supabase.co';
    const SUPABASE_ANON_KEY='sb_publishable_mYAEJ3rvEscEgM3esQi_7Q_1Nv_fRLC';
    const client=(window.supabase&&SUPABASE_URL&&SUPABASE_ANON_KEY)?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
    const ADMIN_TOKEN_KEY='wjarchiveAdminAccessToken';
    const addPaperBtn=document.getElementById('addPaperBtn');
    const paperEditor=document.getElementById('paperEditor');
    const paperTitleInput=document.getElementById('paperTitleInput');
    const paperYearInput=document.getElementById('paperYearInput');
    const paperJournalInput=document.getElementById('paperJournalInput');
    const paperSummaryInput=document.getElementById('paperSummaryInput');
    const cancelPaperBtn=document.getElementById('cancelPaperBtn');
    const savePaperBtn=document.getElementById('savePaperBtn');
    const paperList=document.getElementById('paperList');
    const paperEmpty=document.getElementById('paperEmpty');
    const paperCount=document.querySelector('.paper-count');
    const paperPagination=document.getElementById('paperPagination');
    let papersValue={items:[]};
    let editingPaperIndex=-1;
    let currentPaperPage=1;
    const PAPERS_PER_PAGE=5;

    document.getElementById('year').textContent=new Date().getFullYear();

    function adminTokenIsFresh(token){
      const expire=Number(String(token||'').split(':')[0]);
      return Number.isFinite(expire) && expire > Math.floor(Date.now()/1000)+15;
    }

    function currentAdminToken(){
      const token=sessionStorage.getItem(ADMIN_TOKEN_KEY)||'';
      if(!adminTokenIsFresh(token)){
        if(token) sessionStorage.removeItem(ADMIN_TOKEN_KEY);
        return '';
      }
      return token;
    }

    function esc(value){
      return String(value??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
    }

    function renderPapers(){
      const items=Array.isArray(papersValue.items)?papersValue.items.filter(Boolean):[];
      const isAdmin=Boolean(currentAdminToken());
      const totalPages=Math.max(1,Math.ceil(items.length/PAPERS_PER_PAGE));
      if(currentPaperPage>totalPages) currentPaperPage=totalPages;
      if(currentPaperPage<1) currentPaperPage=1;
      const start=(currentPaperPage-1)*PAPERS_PER_PAGE;
      const visibleItems=items.slice(start,start+PAPERS_PER_PAGE);

      paperList.innerHTML=visibleItems.map((item,visibleIndex)=>{
        const index=start+visibleIndex;
        const data=typeof item==='string'?{title:item}:item||{};
        const title=data.title||'제목 없음';
        const meta=[data.year,data.journal].filter(Boolean).join(' · ');
        const summary=data.summary||'';
        return '<article class="paper-item" data-index="'+index+'">'
          +'<div class="paper-content">'
          +'<div class="paper-title">'+esc(title)+'</div>'
          +(meta?'<div class="paper-meta">'+esc(meta)+'</div>':'')
          +(summary?'<div class="paper-summary">'+esc(summary)+'</div>':'')
          +'</div>'
          +'<div class="paper-actions'+(isAdmin?' show':'')+'">'
          +'<button class="edit-paper" type="button" data-edit-index="'+index+'">수정</button>'
          +'<button class="delete-paper" type="button" data-delete-index="'+index+'">삭제</button>'
          +'<button class="move-paper" type="button" data-move-index="'+index+'" data-move-dir="-1" aria-label="위로 이동" '+(index===0?'disabled':'')+'>↑</button>'
          +'<button class="move-paper" type="button" data-move-index="'+index+'" data-move-dir="1" aria-label="아래로 이동" '+(index===items.length-1?'disabled':'')+'>↓</button>'
          +'</div>'
          +'</article>';
      }).join('');

      if(items.length>PAPERS_PER_PAGE){
        let paginationHtml='<button type="button" data-page="'+(currentPaperPage-1)+'" '+(currentPaperPage===1?'disabled':'')+'>이전</button>';
        for(let page=1;page<=totalPages;page+=1){
          paginationHtml+='<button type="button" data-page="'+page+'" class="'+(page===currentPaperPage?'active':'')+'">'+page+'</button>';
        }
        paginationHtml+='<button type="button" data-page="'+(currentPaperPage+1)+'" '+(currentPaperPage===totalPages?'disabled':'')+'>다음</button>';
        paperPagination.innerHTML=paginationHtml;
        paperPagination.classList.add('show');
      }else{
        paperPagination.innerHTML='';
        paperPagination.classList.remove('show');
      }

      paperEmpty.hidden=items.length>0;
      paperCount.textContent=items.length+'편';
      addPaperBtn.classList.toggle('show',isAdmin);
      paperEmpty.innerHTML=isAdmin
        ? '<strong>등록된 논문이 없습니다.</strong>위의 + 버튼을 눌러 논문 제목을 추가하면, 제목 오른쪽에 삭제 버튼이 표시됩니다.'
        : '<strong>등록된 논문이 없습니다.</strong>논문 목록을 준비하고 있습니다.';
    }

    async function loadPapers(){
      if(!client){renderPapers();return;}
      const {data,error}=await client.from('site_settings').select('value').eq('key','papers').maybeSingle();
      if(error){console.warn(error);renderPapers();return;}
      let value=data?.value||{};
      if(typeof value==='string'){try{value=JSON.parse(value)}catch(e){value={}}}
      papersValue=value&&typeof value==='object'?value:{};
      if(!Array.isArray(papersValue.items)) papersValue.items=[];
      renderPapers();
    }

    async function fetchLatestPapers(){
      if(!client) return papersValue&&typeof papersValue==='object'?papersValue:{items:[]};
      const {data,error}=await client.from('site_settings').select('value').eq('key','papers').maybeSingle();
      if(error) throw error;
      let value=data?.value||{};
      if(typeof value==='string'){try{value=JSON.parse(value)}catch(e){value={}}}
      if(!value||typeof value!=='object'||Array.isArray(value)) value={};
      if(!Array.isArray(value.items)) value.items=[];
      return value;
    }

    async function savePapers(buildNextValue){
      const token=currentAdminToken();
      if(!token){
        alert('관리자 로그인이 필요합니다.');
        return false;
      }
      savePaperBtn.disabled=true;
      try{
        for(let attempt=0;attempt<2;attempt+=1){
          const latestValue=await fetchLatestPapers();
          const nextValue=buildNextValue(latestValue);
          const response=await fetch('/api/site-settings-admin',{
            method:'PUT',
            headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},
            body:JSON.stringify({section:'papers',value:nextValue,baseValue:latestValue})
          });
          const result=await response.json().catch(()=>({}));
          if(response.ok){
            papersValue=nextValue;
            renderPapers();
            return true;
          }
          if(response.status===409 && result.code==='STALE_ADMIN_STATE' && attempt===0) continue;
          throw new Error(result.message||'저장에 실패했습니다.');
        }
        throw new Error('최신 내용을 다시 확인한 뒤 저장해 주세요.');
      }catch(error){
        alert(error.message||'저장에 실패했습니다.');
        return false;
      }finally{
        savePaperBtn.disabled=false;
      }
    }

    function resetPaperEditor(){
      editingPaperIndex=-1;
      paperTitleInput.value='';
      paperYearInput.value='';
      paperJournalInput.value='';
      paperSummaryInput.value='';
      paperEditor.classList.remove('show');
    }

    addPaperBtn.addEventListener('click',()=>{
      if(paperEditor.classList.contains('show') && editingPaperIndex<0){
        resetPaperEditor();
        return;
      }
      resetPaperEditor();
      paperEditor.classList.add('show');
      setTimeout(()=>paperTitleInput.focus(),0);
    });

    cancelPaperBtn.addEventListener('click',resetPaperEditor);

    savePaperBtn.addEventListener('click',async()=>{
      const title=paperTitleInput.value.trim();
      const year=paperYearInput.value.trim();
      const journal=paperJournalInput.value.trim();
      const summary=paperSummaryInput.value.trim();
      if(!title){
        alert('논문 제목을 입력해 주세요.');
        paperTitleInput.focus();
        return;
      }

      const originalIndex=editingPaperIndex;
      const originalItem=originalIndex>=0 && Array.isArray(papersValue.items)?papersValue.items[originalIndex]:null;
      const originalKey=originalItem==null?'':JSON.stringify(originalItem);
      const nextPaper={title,year,journal,summary};

      const ok=await savePapers(latest=>{
        const latestItems=Array.isArray(latest.items)?[...latest.items]:[];
        if(originalIndex>=0){
          const matchIndex=latestItems.findIndex(item=>JSON.stringify(item)===originalKey);
          if(matchIndex>=0) latestItems[matchIndex]=nextPaper;
          else latestItems.push(nextPaper);
        }else{
          latestItems.unshift(nextPaper);
          currentPaperPage=1;
        }
        return {...latest,items:latestItems};
      });

      if(ok) resetPaperEditor();
    });

    paperPagination.addEventListener('click',event=>{
      const button=event.target.closest('[data-page]');
      if(!button || button.disabled) return;
      const page=Number(button.dataset.page);
      if(!Number.isInteger(page) || page<1) return;
      currentPaperPage=page;
      renderPapers();
      document.querySelector('.papers')?.scrollIntoView({behavior:'smooth',block:'start'});
    });

    paperList.addEventListener('click',async event=>{
      if(!currentAdminToken()) return;
      const editButton=event.target.closest('[data-edit-index]');
      if(editButton){
        const index=Number(editButton.dataset.editIndex);
        if(!Number.isInteger(index)) return;
        const items=Array.isArray(papersValue.items)?papersValue.items:[];
        const raw=items[index];
        const item=typeof raw==='string'?{title:raw}:raw||{};
        editingPaperIndex=index;
        paperTitleInput.value=item.title||'';
        paperYearInput.value=item.year||'';
        paperJournalInput.value=item.journal||'';
        paperSummaryInput.value=item.summary||'';
        paperEditor.classList.add('show');
        paperEditor.scrollIntoView({behavior:'smooth',block:'center'});
        setTimeout(()=>paperTitleInput.focus(),250);
        return;
      }

      const moveButton=event.target.closest('[data-move-index]');
      if(moveButton){
        const index=Number(moveButton.dataset.moveIndex);
        const dir=Number(moveButton.dataset.moveDir);
        if(!Number.isInteger(index) || ![-1,1].includes(dir)) return;
        const items=Array.isArray(papersValue.items)?papersValue.items:[];
        const target=items[index];
        if(!target) return;
        const targetKey=JSON.stringify(target);
        await savePapers(latest=>{
          const latestItems=Array.isArray(latest.items)?[...latest.items]:[];
          const currentIndex=latestItems.findIndex(item=>JSON.stringify(item)===targetKey);
          if(currentIndex<0) return latest;
          const nextIndex=currentIndex+dir;
          if(nextIndex<0 || nextIndex>=latestItems.length) return latest;
          [latestItems[currentIndex],latestItems[nextIndex]]=[latestItems[nextIndex],latestItems[currentIndex]];
          currentPaperPage=Math.floor(nextIndex/PAPERS_PER_PAGE)+1;
          return {...latest,items:latestItems};
        });
        return;
      }

      const button=event.target.closest('[data-delete-index]');
      if(!button) return;
      const index=Number(button.dataset.deleteIndex);
      if(!Number.isInteger(index)) return;
      const items=Array.isArray(papersValue.items)?papersValue.items:[];
      const target=items[index];
      const title=typeof target==='string'?target:target?.title;
      if(!confirm('이 논문을 삭제할까요?\n\n'+(title||''))) return;
      const targetKey=JSON.stringify(target);
      await savePapers(latest=>{
        const latestItems=Array.isArray(latest.items)?latest.items:[];
        const removeIndex=latestItems.findIndex(item=>JSON.stringify(item)===targetKey);
        if(removeIndex<0) return latest;
        return {...latest,items:latestItems.filter((_,i)=>i!==removeIndex)};
      });
    });

    loadPapers();
  </script>
</body>
</html>
