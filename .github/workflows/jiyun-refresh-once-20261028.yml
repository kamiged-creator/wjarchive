name: Refresh Jiyun pingpong from updated 8s Flow video
on:
  push:
    branches:
      - feature/saju-video-header-shortcut-20261019
    paths:
      - .github/workflows/jiyun-refresh-once-20261028.yml
permissions:
  contents: write
jobs:
  replace-preview-jiyun:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/saju-video-header-shortcut-20261019
          persist-credentials: true
      - name: Render 8s forward plus 8s reverse with no audio
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg >/dev/null
          fi
          curl --fail --location --silent --show-error --retry 3 --max-time 90 \
            'https://pherh2oisbugqyou.public.blob.vercel-storage.com/jiyun.mp4' -o /tmp/jiyun-refreshed.mp4
          echo 'cc56dae9bf7f0006b6e2eb396797b9f2b7de0889a01830fedfbde7d76cbaf0f9  /tmp/jiyun-refreshed.mp4' | sha256sum -c -
          python3 - <<'PY'
          import json,subprocess
          p='/tmp/jiyun-refreshed.mp4'
          d=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','json',p]))['format']['duration']
          assert 7.6<float(d)<8.4, 'expected 8s new source, got '+str(d)
          print('source duration',d)
          PY
          ffmpeg -hide_banner -loglevel error -y -i /tmp/jiyun-refreshed.mp4 \
            -filter_complex '[0:v]fps=24,split=2[forward][backward];[backward]reverse[reverse];[forward][reverse]concat=n=2:v=1:a=0,format=yuv420p[v]' \
            -map '[v]' -an -c:v libx264 -preset medium -crf 21 -movflags +faststart \
            chat-pwa/jiyun-pingpong.mp4
          python3 - <<'PY'
          import json,subprocess
          p='chat-pwa/jiyun-pingpong.mp4'
          m=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration,size','-show_entries','stream=codec_type,width,height','-of','json',p]))
          seconds=float(m['format']['duration'])
          assert 15.6<seconds<16.4, 'expected 16s, got '+str(seconds)
          assert len(m['streams'])==1 and m['streams'][0]['codec_type']=='video', 'video only'
          print('ready',seconds,m['format']['size'],m['streams'])
          PY
      - name: Commit new preview video only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chat-pwa/jiyun-pingpong.mp4
          git commit -m 'Update preview Jiyun 16s pingpong from refreshed 8s Flow video'
          git push origin HEAD:feature/saju-video-header-shortcut-20261019
